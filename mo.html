<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
  <title>NLC — MO Record</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #FFFFFF;
      color: #1F1F1F;
      line-height: 1.45;
      -webkit-text-size-adjust: 100%;
    }
    .header {
      background: #24275E;
      padding: 18px 20px 16px 20px;
      display: flex;
      align-items: center;
    }
    .header img {
      height: 44px;
      width: auto;
      background: #FFFFFF;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .header-text { margin-left: 14px; color: #FFFFFF; }
    .header-text .kicker {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #F6851F;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .header-text .title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .accent {
      height: 4px;
      background: #F6851F;
      margin: 0;
    }
    .container {
      padding: 22px 20px 28px 20px;
      max-width: 560px;
      margin: 0 auto;
    }
    .mo-banner {
      background: #F5F5F5;
      border-left: 4px solid #24275E;
      padding: 14px 16px;
      margin-bottom: 18px;
      border-radius: 0 6px 6px 0;
    }
    .mo-banner .label {
      font-size: 11px;
      color: #6B6B6B;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .mo-banner .value {
      font-size: 22px;
      font-weight: 700;
      color: #24275E;
      letter-spacing: 0.3px;
    }
    .field {
      display: flex;
      flex-direction: column;
      padding: 12px 0;
      border-bottom: 1px solid #ECECEC;
    }
    .field:last-child { border-bottom: none; }
    .field .label {
      font-size: 11px;
      color: #6B6B6B;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .field .value {
      font-size: 16px;
      color: #1F1F1F;
      font-weight: 500;
      word-break: break-word;
    }
    .field .value.empty {
      color: #B0B0B0;
      font-style: italic;
      font-weight: 400;
    }
    .section {
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 700;
      color: #F6851F;
      margin: 18px 0 2px 0;
      padding-bottom: 6px;
      border-bottom: 2px solid #24275E;
    }
    .footer {
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid #ECECEC;
      text-align: center;
      font-size: 11px;
      color: #6B6B6B;
    }
    .footer .brand { color: #24275E; font-weight: 600; }
    .nodata {
      padding: 40px 20px;
      text-align: center;
      color: #6B6B6B;
    }
    .nodata h2 { color: #24275E; font-size: 18px; margin-bottom: 8px; }
  </style>
</head>

  <div class="accent"></div>
  <div class="container" id="content"></div>

  <script>
    // Field definitions.
    // Field entry: [URL key, Display label] or [URL key, Display label, fallbackKey]
    // Section header: {section: "Heading"}
    var FIELDS = [
      {section: "Product"},
      ["no",       "Line Item #"],
      ["model",    "Model"],
      ["series",   "Series"],
      ["type",     "Type"],
      ["watt",     "Wattage"],
      ["kelvin",   "Color Temp (K)"],
      {section: "Production"},
      ["conveyor", "Conveyor"],
      ["date",     "Production Date"],
      ["line",     "Assembly Line"],
      ["foreman",  "Foreman"],
      ["qc",       "QC Checker"],
      ["status",   "Status"],
      {section: "Order"},
      ["so",       "SO Number"],
      ["customer", "Customer", "client"]
    ];

    function getParam(name) {
      var m = window.location.search.match(new RegExp("[?&]" + name + "=([^&]*)"));
      return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
    }

    function render() {
      var content = document.getElementById("content");
      var mo = getParam("mo");

      // Render whenever any record data is present, not only when an MO exists.
      var hasAny = !!(mo && mo.trim());
      for (var j = 0; j < FIELDS.length && !hasAny; j++) {
        var f = FIELDS[j];
        if (f.section) continue;
        var rv = getParam(f[0]);
        if ((!rv || !rv.trim()) && f[2]) rv = getParam(f[2]);
        if (rv && rv.trim()) hasAny = true;
      }
      if (!hasAny) {
        content.innerHTML = '<div class="nodata"><h2>No record data</h2>' +
          '<p>This page expects production data in the URL.</p></div>';
        return;
      }

      // Headline: MO number if present, otherwise Model, then Line Item #.
      var bannerLabel, bannerValue;
      if (mo && mo.trim()) {
        bannerLabel = "MO Number"; bannerValue = mo;
      } else if (getParam("model").trim()) {
        bannerLabel = "Model"; bannerValue = getParam("model");
      } else if (getParam("no").trim()) {
        bannerLabel = "Line Item #"; bannerValue = getParam("no");
      } else {
        bannerLabel = "Record"; bannerValue = "\u2014";
      }

      var html = '<div class="mo-banner">' +
                 '<div class="label">' + escapeHtml(bannerLabel) + '</div>' +
                 '<div class="value">' + escapeHtml(bannerValue) + '</div>' +
                 '</div>';

      for (var i = 0; i < FIELDS.length; i++) {
        var entry = FIELDS[i];
        if (entry.section) {
          html += '<div class="section">' + escapeHtml(entry.section) + '</div>';
          continue;
        }
        var key = entry[0], label = entry[1], fallback = entry[2];
        var raw = getParam(key);
        if ((!raw || !raw.trim()) && fallback) { raw = getParam(fallback); }
        var has = raw && raw.trim();
        var value = has ? escapeHtml(raw) : '<span class="empty">Not recorded</span>';
        html += '<div class="field">' +
                '<div class="label">' + label + '</div>' +
                '<div class="value' + (has ? '' : ' empty') + '">' + value + '</div>' +
                '</div>';
      }

      html += '<div class="footer">' +
              '<span class="brand">National Lighting Company</span> · Full Traceability System' +
              '</div>';

      content.innerHTML = html;
      document.title = "NLC \u2014 " + bannerValue;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    render();
  </script>
</body>
</html>
