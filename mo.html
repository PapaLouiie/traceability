<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NLC Traceability</title>
<style>
  :root{
    --navy:#24275E; --navy-deep:#1a1c45; --orange:#F6851F; --orange-soft:#fff2e6;
    --ink:#1c1e33; --muted:#71749a; --line:#e7e8f1; --bg:#f5f6fb; --card:#ffffff;
    --ok:#1f9d63; --ok-bg:#e7f6ee; --warn:#c9820b; --warn-bg:#fdf3e0;
    --info:#3457b2; --info-bg:#eaf0fc; --hold:#c0392b; --hold-bg:#fdecea;
    --radius:14px; --shadow:0 1px 2px rgba(36,39,94,.06),0 8px 24px rgba(36,39,94,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.45;
    -webkit-font-smoothing:antialiased; padding:0 0 40px;
  }
  .wrap{max-width:560px; margin:0 auto; padding:0 16px}

  /* header */
  header{
    background:var(--navy); color:#fff; padding:14px 16px 16px;
    border-bottom:3px solid var(--orange);
  }
  .head-in{max-width:560px; margin:0 auto; display:flex; align-items:center; gap:12px}
  .brand-logo{height:32px; width:auto; display:block; flex:none}
  .brand-tag{font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:#b9bce0;
    padding-left:12px; border-left:1px solid rgba(255,255,255,.28)}
  .who{margin-left:auto; text-align:right; font-size:11.5px; color:#c3c6e6}
  .who a{color:#fff; text-decoration:underline; cursor:pointer; font-weight:600}

  /* hero */
  .hero{margin-top:18px; background:var(--navy); color:#fff; border-radius:var(--radius);
    padding:18px 18px 20px; box-shadow:var(--shadow); position:relative; overflow:hidden}
  .hero:after{content:""; position:absolute; right:-40px; top:-40px; width:150px; height:150px;
    background:radial-gradient(circle,rgba(246,133,31,.28),transparent 68%)}
  .hero .eyebrow{font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:#b9bce0}
  .hero .serial{font-size:29px; font-weight:800; letter-spacing:.5px; margin:2px 0 4px;
    font-variant-numeric:tabular-nums; word-break:break-all}
  .hero .model{font-size:14px; color:#dfe0f2}
  .chip{display:inline-block; margin-top:12px; font-size:12px; font-weight:700;
    letter-spacing:.4px; padding:5px 11px; border-radius:999px; background:#fff; color:var(--navy)}
  .chip[data-tone="ok"]{background:var(--ok-bg); color:var(--ok)}
  .chip[data-tone="warn"]{background:var(--warn-bg); color:var(--warn)}
  .chip[data-tone="info"]{background:var(--info-bg); color:var(--info)}
  .chip[data-tone="hold"]{background:var(--hold-bg); color:var(--hold)}

  /* cards */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); margin-top:14px; overflow:hidden}
  .card > h2{margin:0; font-size:11px; letter-spacing:2px; text-transform:uppercase;
    color:var(--navy); padding:13px 16px 0}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line);
    margin:12px 0 0; border-top:1px solid var(--line)}
  .grid .cell{background:var(--card); padding:11px 16px}
  .grid .cell.full{grid-column:1 / -1}
  .lbl{font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted)}
  .val{font-size:15px; font-weight:600; margin-top:2px; word-break:break-word}
  .val.mono{font-variant-numeric:tabular-nums}
  .val.dim{color:var(--muted); font-weight:500}

  /* stat strip */
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:14px}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; text-align:center; box-shadow:var(--shadow)}
  .stat b{display:block; font-size:24px; color:var(--navy); font-variant-numeric:tabular-nums}
  .stat span{font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--muted)}

  /* worker table */
  table{width:100%; border-collapse:collapse; margin-top:10px; font-size:13px}
  thead th{background:var(--navy); color:#fff; font-weight:600; text-align:left;
    padding:9px 12px; font-size:11px; letter-spacing:.6px}
  tbody td{padding:9px 12px; border-bottom:1px solid var(--line)}
  tbody tr:last-child td{border-bottom:none}
  tbody td.num{text-align:right; font-variant-numeric:tabular-nums}
  .work-name{font-weight:600}
  .work-sub{color:var(--muted); font-size:11.5px}

  /* sign-in */
  .signin{margin-top:14px; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
  .signin .bar{display:flex; align-items:center; gap:10px; padding:14px 16px; cursor:pointer}
  .signin .bar .key{width:34px; height:34px; border-radius:9px; background:var(--orange-soft);
    display:grid; place-items:center; color:var(--orange); font-size:17px; flex:none}
  .signin .bar b{font-size:14px; color:var(--navy)}
  .signin .bar small{display:block; color:var(--muted); font-size:12px; font-weight:400}
  .signin .bar .chev{margin-left:auto; color:var(--muted); transition:transform .2s}
  .signin.open .chev{transform:rotate(180deg)}
  .signin .body{display:none; padding:0 16px 16px; border-top:1px solid var(--line)}
  .signin.open .body{display:block}
  .field{margin-top:12px}
  .field label{font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--muted)}
  .field input{width:100%; margin-top:5px; padding:11px 12px; font-size:15px;
    border:1px solid var(--line); border-radius:10px; background:#fbfbfe; color:var(--ink)}
  .field input:focus{outline:2px solid var(--orange); outline-offset:1px; border-color:transparent}
  .btn{width:100%; margin-top:14px; padding:12px; font-size:15px; font-weight:700;
    color:#fff; background:var(--navy); border:none; border-radius:10px; cursor:pointer}
  .btn:active{background:var(--navy-deep)}
  .btn[disabled]{opacity:.6; cursor:default}
  .signin .msg{margin-top:10px; font-size:13px; color:var(--hold); display:none}
  .signin .msg.show{display:block}

  /* status blocks */
  .state{margin-top:40px; text-align:center; color:var(--muted)}
  .state .mk{font-size:34px; margin-bottom:8px}
  .state h3{margin:0 0 4px; color:var(--ink); font-size:17px}
  .state p{margin:0; font-size:14px}
  .spinner{width:34px; height:34px; margin:0 auto 12px; border:3px solid var(--line);
    border-top-color:var(--orange); border-radius:50%; animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spinner{animation:none}}

  footer{max-width:560px; margin:26px auto 0; padding:0 16px; text-align:center;
    font-size:11px; letter-spacing:.4px; color:var(--muted)}
  footer b{color:var(--navy)}
</style>
</head>

<div class="wrap" id="app">
  <div class="state"><div class="spinner"></div><p>Reading tag&hellip;</p></div>
</div>

<footer>Powered by <b>NLC Traceability</b> &middot; scan reflects the live record</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---------------- CONFIG (anon key is public and safe to ship) --------- */
const SUPABASE_URL  = "https://ekwjpezbepkzmcaiwzcm.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrd2pwZXpiZXBrem1jYWl3emNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTkwNTMsImV4cCI6MjA5ODg5NTA1M30.BE5m6snqwJzXkXBn-J8RllCvC0nWgFjJbg_t2466Q6M";
/* ---------------------------------------------------------------------- */

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const app = document.getElementById("app");
const whoEl = document.getElementById("who");
const sn = new URLSearchParams(location.search).get("sn");

const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dash = v => (v==null||v==="") ? '<span class="val dim">&mdash;</span>' : esc(v);
const t = v => v ? String(v).slice(0,5) : "";        // HH:MM:SS -> HH:MM
const n1 = v => (v==null||v==="") ? "" : (Math.round(Number(v)*10)/10);

function statusTone(s){
  const x=(s||"").toLowerCase();
  if(/complete|done|closed|passed/.test(x)) return "ok";
  if(/hold|reject|fail/.test(x)) return "hold";
  if(/progress|assembl|qc|check/.test(x)) return "info";
  return "warn";
}

function cell(label,value,full){
  return `<div class="cell${full?' full':''}"><div class="lbl">${label}</div><div class="val">${value}</div></div>`;
}

function hero(r){
  return `<div class="hero">
    <div class="eyebrow">Serial</div>
    <div class="serial">${dash(r.serial)}</div>
    <div class="model">${dash(r.model)}</div>
    <span class="chip" data-tone="${statusTone(r.status)}">${esc(r.status||"Open")}</span>
  </div>`;
}

function productCard(r){
  return `<section class="card"><h2>Product</h2><div class="grid">
    ${cell("Model", dash(r.model), true)}
    ${cell("Series", dash(r.series))}
    ${cell("Type", dash(r.type))}
    ${cell("Watt", dash(r.watt))}
    ${cell("Kelvin / rating", dash(r.kelvin))}
  </div></section>`;
}

function orderCard(r){
  return `<section class="card"><h2>Order</h2><div class="grid">
    ${cell("Sales order", dash(r.so_number))}
    ${cell("MO number", dash(r.mo_number))}
    ${cell("Customer", dash(r.customer), true)}
    ${cell("Production date", dash(r.production_date))}
    ${cell("Line", dash(r.line))}
  </div></section>`;
}

/* ---------------- PUBLIC (no session) --------------------------------- */
async function renderPublic(){
  const { data, error } = await db.rpc("scan_serial", { p_serial: sn });
  if(error) return fail("Could not read this tag", "Check your connection and scan again.");
  const r = data && data[0];
  if(!r) return notFound();
  app.innerHTML =
    hero(r) + productCard(r) + orderCard(r) +
    `<div class="stats">
      <div class="stat"><b>${r.total_units??0}</b><span>Units</span></div>
      <div class="stat"><b>${r.worker_count??0}</b><span>Workers</span></div>
      <div class="stat"><b>${esc((r.status||"Open").split(" ")[0])}</b><span>Status</span></div>
    </div>` +
    signinBlock();
  wireSignin();
}

/* ---------------- FULL (foreman session) ------------------------------ */
async function renderFull(email){
  const { data:r, error } = await db.from("production_records").select("*").eq("serial", sn).maybeSingle();
  if(error) return fail("Could not load record", "Your session may have expired. Sign in again.");
  if(!r) return notFound(true);

  const { data:workers } = await db.from("worker_entries")
    .select("qty,conveyor,start_time,finish_time,work_type,remarks,total_mins,cycle_time,staff(full_name,called_name)")
    .eq("record_id", r.id).order("conveyor",{ascending:true});

  const rows = (workers||[]).map(w=>{
    const name = w.staff ? (w.staff.full_name||w.staff.called_name) : "Unassigned";
    return `<tr>
      <td><div class="work-name">${esc(name)}</div><div class="work-sub">${esc(w.conveyor||"")}</div></td>
      <td>${esc(t(w.start_time))}&ndash;${esc(t(w.finish_time))}</td>
      <td>${w.work_type==="S"?"Stickers":"Complete"}</td>
      <td class="num">${w.qty??0}</td>
      <td class="num">${n1(w.cycle_time)}</td>
    </tr>`;
  }).join("");

  const units = (workers||[]).reduce((a,w)=>a+(w.qty||0),0);
  const mins  = (workers||[]).reduce((a,w)=>a+(Number(w.total_mins)||0),0);
  const cyc   = units ? (mins/units) : null;

  app.innerHTML =
    hero(r) + productCard(r) + orderCard(r) +
    `<section class="card"><h2>Assignment</h2><div class="grid">
      ${cell("Foreman", dash(r.foreman))}
      ${cell("QC checker", dash(r.qc_checker))}
    </div></section>` +
    `<div class="stats">
      <div class="stat"><b>${units}</b><span>Units</span></div>
      <div class="stat"><b>${(workers||[]).length}</b><span>Entries</span></div>
      <div class="stat"><b>${cyc?n1(cyc):"&mdash;"}</b><span>Min / unit</span></div>
    </div>` +
    `<section class="card"><h2>Worker entries</h2>
      ${rows ? `<table><thead><tr><th>Worker</th><th>Shift</th><th>Task</th><th class="num">Qty</th><th class="num">Cyc</th></tr></thead><tbody>${rows}</tbody></table>`
             : `<div class="grid"><div class="cell full"><div class="val dim">No worker entries yet. This record was created but assembly data has not been logged.</div></div></div>`}
    </section>` +
    (r.remarks ? `<section class="card"><h2>Remarks</h2><div class="grid"><div class="cell full"><div class="val dim">${esc(r.remarks)}</div></div></div></section>` : "");

  whoEl.innerHTML = `${esc(email)}<br><a id="out">Sign out</a>`;
  document.getElementById("out").onclick = async ()=>{ await db.auth.signOut(); location.reload(); };
}

/* ---------------- sign-in affordance ---------------------------------- */
function signinBlock(){
  return `<div class="signin" id="si">
    <div class="bar" id="si-bar">
      <div class="key">&#128273;</div>
      <div><b>Staff sign in</b><small>See foreman, QC and worker detail</small></div>
      <div class="chev">&#9662;</div>
    </div>
    <div class="body">
      <div class="field"><label>Email</label><input id="si-email" type="email" autocomplete="username" inputmode="email"></div>
      <div class="field"><label>Password</label><input id="si-pass" type="password" autocomplete="current-password"></div>
      <button class="btn" id="si-go">Sign in</button>
      <div class="msg" id="si-msg"></div>
    </div>
  </div>`;
}
function wireSignin(){
  const box=document.getElementById("si");
  document.getElementById("si-bar").onclick=()=>box.classList.toggle("open");
  const go=document.getElementById("si-go"), msg=document.getElementById("si-msg");
  go.onclick=async()=>{
    const email=document.getElementById("si-email").value.trim();
    const pass=document.getElementById("si-pass").value;
    if(!email||!pass){ msg.textContent="Enter your email and password."; msg.classList.add("show"); return; }
    go.disabled=true; go.textContent="Signing in\u2026"; msg.classList.remove("show");
    const { error }=await db.auth.signInWithPassword({ email, password:pass });
    if(error){ go.disabled=false; go.textContent="Sign in"; msg.textContent="Sign in failed. Check your details and try again."; msg.classList.add("show"); return; }
    location.reload();
  };
  document.getElementById("si-pass").addEventListener("keydown",e=>{ if(e.key==="Enter") go.click(); });
}

/* ---------------- states ---------------------------------------------- */
function notFound(auth){
  app.innerHTML=`<div class="state"><div class="mk">&#128269;</div>
    <h3>No record for this serial</h3>
    <p>${sn?("Serial "+esc(sn)+" is not in the system yet."):"This link has no serial."}</p></div>`
    + (auth?"":signinBlock());
  if(!auth) wireSignin();
}
function fail(title,sub){
  app.innerHTML=`<div class="state"><div class="mk">&#9888;&#65039;</div><h3>${esc(title)}</h3><p>${esc(sub)}</p></div>`;
}

/* ---------------- boot ------------------------------------------------- */
(async function(){
  if(!sn){ fail("Nothing to show","This page opens from a scanned NLC QR code."); return; }
  const { data:{ session } } = await db.auth.getSession();
  if(session){ await renderFull(session.user.email); }
  else { await renderPublic(); }
})();
</script>
</body>
