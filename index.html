  html[data-theme="dark"]{
    --bg:#131427; --card:#1c1e38; --ink:#e7e8f5; --muted:#9a9dc6; --line:#30325c;
    --orange-soft:#3a2a17; --ok-bg:#0f2b1e; --warn-bg:#332609; --info-bg:#172341; --hold-bg:#331313;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
  html[data-theme="dark"] input, html[data-theme="dark"] select, html[data-theme="dark"] textarea{background:#23254a; color:var(--ink); border-color:var(--line)}
  html[data-theme="dark"] .btn.ghost{background:#23254a; color:var(--ink)}
  html[data-theme="dark"] thead th{background:#23254a}
  html[data-theme="dark"] tfoot .totals td{background:#20224a}
  html[data-theme="dark"] .wk-head{background:#20224a}
  html[data-theme="dark"] .modal{background:var(--card)}
  html[data-theme="dark"] .login .card{background:var(--card)}
  html[data-theme="dark"] h1, html[data-theme="dark"] .sn{color:#aeb3ff}
  html[data-theme="dark"] .rec:hover{background:#20224a}
  html[data-theme="dark"] .bom-table td.bom-cell input:hover{background:#20224a}
  html[data-theme="dark"] .bom-table td.bom-cell input:focus{background:#23254a}
  html[data-theme="dark"] input:disabled{background:#181a33 !important; color:var(--muted)}
  .tabs{display:flex; gap:6px; background:#eceef6; padding:4px; border-radius:11px}
  .tabs button{border:none; background:none; padding:8px 16px; font-size:13.5px; font-weight:700; color:var(--muted);
    border-radius:8px; cursor:pointer; font-family:inherit}
  .tabs button.on{background:#fff; color:var(--navy); box-shadow:0 1px 3px rgba(36,39,94,.12)}
  html[data-theme="dark"] .tabs{background:#181a33}
  html[data-theme="dark"] .tabs button.on{background:#2a2c52; color:var(--ink)}
  input[type="file"]{padding:7px}
  input[type="file"]::file-selector-button{background:#fff; color:var(--navy); border:1px solid var(--line);
    border-radius:8px; padding:7px 13px; font-weight:700; font-size:13px; font-family:inherit; cursor:pointer; margin-right:10px}
  html[data-theme="dark"] input[type="file"]::file-selector-button{background:#23254a; color:var(--ink)}
  .chipsearch{display:flex; flex-wrap:wrap; gap:6px; align-items:center; background:#fbfbfe;
    border:1px solid var(--line); border-radius:9px; padding:5px 9px; cursor:text}
  .chipsearch:focus-within{outline:2px solid var(--orange); outline-offset:1px}
  .chipsearch input{border:none; background:none; outline:none; flex:1; min-width:110px; padding:5px 2px}
  .chip-s{display:inline-flex; align-items:center; gap:5px; background:var(--orange-soft); color:#a55a12;
    border:1px solid #f3d3ad; border-radius:999px; padding:3px 6px 3px 11px; font-size:12.5px; font-weight:700}
  .chip-s b{cursor:pointer; color:#c0392b; font-weight:800; padding:0 3px; line-height:1; font-size:14px}
  html[data-theme="dark"] .chipsearch{background:#23254a}
  html[data-theme="dark"] .chip-s{background:#3a2a17; color:#f0b075; border-color:#5a4020}
  .cap-edit{color:var(--info); cursor:pointer; text-decoration:underline dotted; font-size:12.5px}
  .ld-chip{cursor:pointer}
  .ld-chip:hover{outline:2px solid var(--orange); outline-offset:1px}
  html[data-theme="dark"] .ld-row:hover td{background:#20224a}
  .ld-row:hover td{background:#f4f5fb}
  .ld-bar{height:4px; background:var(--line); border-radius:2px; margin-top:4px; overflow:hidden}
  .ld-bar i{display:block; height:100%}
  .role-tag{display:inline-block; font-size:10px; font-weight:800; letter-spacing:.8px; text-transform:uppercase;
    background:var(--orange); color:#fff; padding:1px 7px; border-radius:5px}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Bizmo","Bizmo Semi Bold",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.45; -webkit-font-smoothing:antialiased}
  .wrap{max-width:760px; margin:0 auto; padding:0 16px 60px}
  body.wide .wrap{max-width:96vw}
  body.wide .bom-table{min-width:0; width:100%; table-layout:fixed}
  body.wide .bom-table th:nth-child(1){width:13%}
  body.wide .bom-table th:nth-child(2){width:14%}
  body.wide .bom-table th:nth-child(3){width:8%}
  body.wide .bom-table th:nth-child(n+4){width:auto}
  body.wide .bom-table td{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  body.wide .bom-table td.bom-cell input{min-width:0}

  header{background:var(--navy); color:#fff; padding:14px 16px; border-bottom:3px solid var(--orange)}
  .head-in{max-width:760px; margin:0 auto; display:flex; align-items:center; gap:12px}
  .brand-logo{height:32px; width:auto; display:block; flex:none}
  .brand-tag{font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:#b9bce0;
    padding-left:12px; border-left:1px solid rgba(255,255,255,.28)}
  .who{margin-left:auto; text-align:right; font-size:11.5px; color:#c3c6e6}
  .brand-home{color:#c3c6e6; text-decoration:none; font-size:12.5px; font-weight:600; padding:4px 11px;
    border:1px solid rgba(255,255,255,.28); border-radius:8px; cursor:pointer}
  .brand-home:hover{background:rgba(255,255,255,.12); color:#fff}
  .who a{color:#fff; text-decoration:underline; cursor:pointer; font-weight:600}

  h1{font-size:20px; margin:22px 0 2px; color:var(--navy)}
  .sub{color:var(--muted); font-size:13.5px; margin:0 0 16px}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); margin-top:14px}
  .card h2{margin:0; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--navy);
    padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px}
  .card .pad{padding:16px}

  .row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  @media(max-width:560px){ .row{grid-template-columns:1fr} }
  .field{margin-bottom:12px}
  .field.full{grid-column:1 / -1}
  label{display:block; font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
  input,select{width:100%; padding:10px 12px; font-size:15px; border:1px solid var(--line);
    border-radius:10px; background:#fbfbfe; color:var(--ink); font-family:inherit}
  input:focus,select:focus{outline:2px solid var(--orange); outline-offset:1px; border-color:transparent}
  .hint{font-size:12px; color:var(--muted); margin-top:5px}
  .hint b{color:var(--navy); font-variant-numeric:tabular-nums}
  .radios{display:flex; gap:14px; padding-top:4px}
  .radio{display:flex; align-items:center; gap:6px; font-size:14px; font-weight:600;
    color:var(--ink); text-transform:none; letter-spacing:0; cursor:pointer; margin:0}
  .radio input{width:auto; margin:0; accent-color:var(--orange)}
  .qrbox img.kind-Production{border:5px solid var(--navy)}
  .qrbox img.kind-Sample{border:5px solid var(--orange)}
  .wk-head{margin:14px 0 6px; padding:5px 10px; background:#eef0f7; border-radius:8px; font-size:11.5px;
    font-weight:800; letter-spacing:1px; color:var(--navy)}
  .badge-sample{display:inline-block; font-size:10px; font-weight:800; letter-spacing:.5px; color:#fff;
    background:var(--orange); padding:1px 6px; border-radius:5px; vertical-align:middle}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
  .chip-w{display:inline-flex; align-items:center; gap:6px; background:var(--orange-soft); color:#a55a12;
    border:1px solid #f3d3ad; border-radius:999px; padding:4px 6px 4px 11px; font-size:13px; font-weight:600}
  .chip-w b{cursor:pointer; color:#c0392b; font-weight:800; padding:0 3px; line-height:1}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 18px;
    font-size:15px; font-weight:700; border:none; border-radius:10px; cursor:pointer; font-family:inherit}
  .btn.primary{background:var(--navy); color:#fff}
  .btn.primary:active{background:var(--navy-deep)}
  .btn.orange{background:var(--orange); color:#fff}
  .btn.ghost{background:#fff; color:var(--navy); border:1px solid var(--line)}
  .btn.sm{padding:8px 12px; font-size:13px}
  .btn[disabled]{opacity:.55; cursor:default}
  .btn.link{background:none; border:none; color:var(--muted); padding:6px; font-weight:600; cursor:pointer}
  .btn.danger{background:none; border:none; color:var(--hold); cursor:pointer; font-size:13px; font-weight:600}

  .chip{display:inline-block; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px;
    background:var(--warn-bg); color:var(--warn)}
  .chip[data-tone="ok"]{background:var(--ok-bg); color:var(--ok)}
  .chip[data-tone="info"]{background:var(--info-bg); color:var(--info)}
  .chip[data-tone="hold"]{background:var(--hold-bg); color:var(--hold)}

  .toolbar{display:flex; gap:10px; align-items:center; margin-top:14px; flex-wrap:wrap}
  .toolbar input{flex:1; min-width:180px}

  .qr-sel{width:16px; height:16px; accent-color:var(--orange); margin-right:4px; flex:none; align-self:center}
  .rec{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer}
  .rec:last-child{border-bottom:none}
  .rec:hover{background:#fafbff}
  .rec .sn{font-weight:700; color:var(--navy); font-variant-numeric:tabular-nums; font-size:14px}
  .rec .meta{font-size:12.5px; color:var(--muted)}
  .rec .r-right{margin-left:auto; text-align:right}
  .flag{display:inline-block; font-size:10px; font-weight:800; letter-spacing:.5px; color:#fff;
    background:#c0392b; padding:1px 6px; border-radius:5px; vertical-align:middle}
  .modal-bg{position:fixed; inset:0; background:rgba(26,28,69,.45); display:flex; align-items:center;
    justify-content:center; padding:16px; z-index:50}
  .modal{background:var(--card); border-radius:14px; max-width:460px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.3);
    max-height:86vh; overflow:auto}
  .modal .mh{padding:16px; border-bottom:1px solid var(--line); font-weight:700; color:var(--navy); display:flex; align-items:center}
  .modal .mh .x{margin-left:auto; cursor:pointer; color:var(--muted); font-size:20px; line-height:1}
  .modal .mb{padding:16px}

  table{width:100%; border-collapse:collapse; font-size:13.5px}
  .tbl-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
  .bom-table td.bom-cell{padding:3px 4px}
  .bom-table td.bom-cell input{width:100%; min-width:130px; padding:8px 10px; border:1px solid transparent;
    border-radius:7px; background:transparent; font-size:13.5px; font-family:inherit}
  .bom-table td.bom-cell select{width:100%; min-width:0; padding:8px 9px; border:1px solid transparent;
    border-radius:7px; background:transparent; font-size:13px}
  .bom-table td.bom-cell select:hover{border-color:var(--line); background:#fbfbfe}
  .bom-table td.bom-cell.changed select{background:var(--orange-soft); border-color:#f3d3ad; font-weight:600}
  .bom-table td.bom-cell input:hover{border-color:var(--line); background:#fbfbfe}
  .bom-table td.bom-cell input:focus{outline:2px solid var(--orange); background:#fff}
  .bom-table td.bom-cell.changed input{background:var(--orange-soft); border-color:#f3d3ad; font-weight:600}
  table{min-width:640px}
  thead th{background:#f0f1f8; color:var(--navy); text-align:left; padding:9px 12px; font-size:11px; letter-spacing:.5px}
  tbody td{padding:9px 12px; border-top:1px solid var(--line)}
  tfoot .totals td{border-top:2px solid var(--navy); background:#f4f5fb; font-weight:800; color:var(--navy); padding:11px 12px}
  tbody td.num{text-align:right; font-variant-numeric:tabular-nums}

  .qrbox{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
  .qrbox img{width:150px; height:150px; border:1px solid var(--line); border-radius:10px; background:#fff}
  .qrbox .serial{font-size:22px; font-weight:800; color:var(--navy); font-variant-numeric:tabular-nums; word-break:break-all}

  .banner{margin-top:16px; padding:12px 14px; border-radius:10px; font-size:14px; display:none}
  .banner.show{display:block}
  .banner.ok{background:var(--ok-bg); color:var(--ok)}
  .banner.err{background:var(--hold-bg); color:var(--hold)}

  /* login */
  .login{max-width:380px; margin:60px auto; padding:0 16px}
  .login .card{margin-top:0}
  .login .logo-wrap{text-align:center; margin-bottom:22px}
  .login .logo-wrap img{height:40px}

  .empty{padding:26px 16px; text-align:center; color:var(--muted); font-size:14px}
  .spinner{width:30px; height:30px; margin:40px auto; border:3px solid var(--line);
    border-top-color:var(--orange); border-radius:50%; animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.spinner{animation:none}}
  .hidden{display:none !important}
</style>
</head>

function toggleTheme(){
  const el=document.documentElement;
  const dark=el.dataset.theme==="dark";

  try{ localStorage.setItem("nlc-theme", dark?"light":"dark"); }catch(e){}

function wkStr(ds){ if(!ds) return null; const dt=new Date(ds+"T00:00:00Z");
  const t=new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate()));
  const day=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-day+3);
  const wy=t.getUTCFullYear(); const jan4=new Date(Date.UTC(wy,0,4));
  const wk=1+Math.round(((t-jan4)/86400000-3+((jan4.getUTCDay()+6)%7))/7);
  return wy+"-W"+String(wk).padStart(2,"0"); }
function wkMon(ws){ const m=(ws||"").match(/^(\d{4})-W(\d{2})$/); if(!m) return null;
  const y=+m[1], w=+m[2]; const jan4=new Date(Date.UTC(y,0,4));
  const day=(jan4.getUTCDay()+6)%7; const mon=new Date(jan4);
  mon.setUTCDate(jan4.getUTCDate()-day+(w-1)*7); return mon.toISOString().slice(0,10); }

}

(async function(){
  const { data:{ session } } = await db.auth.getSession();
  if(!session){ renderLogin(); return; }
  SESSION = session;
  const { data:staff } = await db.from("staff").select("id,full_name,called_name").order("full_name");
  STAFF = staff||[];
  const { data:lt } = await db.from("light_types").select("name").order("name");
  LIGHT_TYPES = (lt||[]).map(x=>x.name);
  try{ const { data:pm } = await db.rpc("my_permissions");
    (pm||[]).forEach(p=>PERMS[p.section]={view:p.can_view, edit:p.can_edit}); }catch(e){}
  try{ const { data:r0 } = await db.rpc("my_role"); ROLE=r0||""; }catch(e){}
  route();
})();

/* ---------------- URL routing so refresh keeps your place ------------- */
let suppressHash=false;
function setHash(h){
  if(location.hash===h) return;
  suppressHash=true; location.hash=h;
  setTimeout(()=>{ suppressHash=false; },0);
}
window.addEventListener("hashchange",()=>{ if(!suppressHash) route(); });

async function route(){
  const h=location.hash||"";
  const m=h.match(/^#\/record\/([0-9a-fA-F-]{36})$/);
  if(m){ await openRecord(m[1],true); return; }
  if(h==="#/admin" && may("admin","view")){ renderAdmin(); return; }
  if(h==="#/bom" && may("engineering","edit")){ renderBomEditor(); return; }
  if(h==="#/lines"){ renderLines(); return; }
  if(h==="#/new"){ renderEditor(null); return; }
  renderHome();
}

/* ---------------- login ---------------- */
function renderLogin(msg){
  root.innerHTML = `<div class="login">
    <div class="logo-wrap"><img src="${LOGO}" alt="NLC"></div>
    <div class="card"><h2>Staff sign in</h2><div class="pad">
      <div class="field"><label>Email</label><input id="l-email" type="email" autocomplete="username" inputmode="email"></div>
      <div class="field"><label>Password</label><input id="l-pass" type="password" autocomplete="current-password"></div>
      <button class="btn primary" id="l-go" style="width:100%">Sign in</button>
      <div class="banner err ${msg?'show':''}" id="l-msg">${esc(msg||"")}</div>
    </div></div>
    <p class="sub" style="text-align:center;margin-top:14px">Accounts are created by your admin. There is no self sign up.</p>
  </div>`;
  const go=document.getElementById("l-go");
  const submit=async()=>{
    const email=document.getElementById("l-email").value.trim(), pass=document.getElementById("l-pass").value;
    if(!email||!pass) return renderLogin("Enter your email and password.");
    go.disabled=true; go.textContent="Signing in\u2026";
    const { error }=await db.auth.signInWithPassword({email,password:pass});
    if(error) return renderLogin("Sign in failed. Check your details and try again.");
    location.reload();
  };
  go.onclick=submit;
  document.getElementById("l-pass").addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
}

function monthRange(year,month){
  // returns [from,to) ISO dates for the chosen filter, or null if none
  if(!year && !month) return null;
  const y=year?parseInt(year,10):null;
  if(y && month){ const m=parseInt(month,10); const from=`${y}-${month}-01`;
    const to=(m===12)?`${y+1}-01-01`:`${y}-${String(m+1).padStart(2,"0")}-01`; return [from,to]; }
  if(y && !month){ return [`${y}-01-01`,`${y+1}-01-01`]; }
  if(!y && month){ const yy=new Date().getFullYear(); const m=parseInt(month,10);
    const to=(m===12)?`${yy+1}-01-01`:`${yy}-${String(m+1).padStart(2,"0")}-01`; return [`${yy}-${month}-01`,to]; }
  return null;
}

  if(listFilter.week){
    const mon=wkMon(listFilter.week);
    if(mon){ const end=new Date(mon+"T00:00:00Z"); end.setUTCDate(end.getUTCDate()+7);
      rng=[mon, end.toISOString().slice(0,10)]; }
  }
  let [scol,sdir]=(listFilter.sort||"production_date|desc").split("|");
  const weekGroup=(scol==="week"); if(weekGroup) scol="production_date";

  // issue filter -> matching record ids (or ids to exclude)
  let tagIds=null, excludeIds=null;
  if(listFilter.tag==="none"){
    const { data:fids }=await db.from("v_record_flags").select("record_id").gt("open_ccrs",0);
    excludeIds=(fids||[]).map(f=>f.record_id);
  } else if(listFilter.tag){
    let fq=db.from("v_record_flags").select("record_id,open_types,open_ccrs");
    if(listFilter.tag==="any") fq=fq.gt("open_ccrs",0);
    else fq=fq.contains("open_types",[listFilter.tag]);
    const { data:fids, error:ferr }=await fq;
    if(ferr){ list.innerHTML=`<div class="empty">Could not apply issue filter: ${esc(ferr.message)}</div>`; return; }
    tagIds=(fids||[]).map(f=>f.record_id);

  if(rng){ query=query.gte("production_date",rng[0]).lt("production_date",rng[1]); }
  if(tagIds){ query=query.in("id",tagIds); }
  if(excludeIds && excludeIds.length){ query=query.not("id","in","("+excludeIds.join(",")+")"); }
  if(listFilter.kind){ query=query.eq("record_kind",listFilter.kind); }
  if(q){
    const terms=q.split(/[,\s]+/).filter(Boolean);
    const pats=terms.map(t=>`serial.ilike.%${t}%,so_number.ilike.%${t}%,mo_number.ilike.%${t}%,model.ilike.%${t}%,customer.ilike.%${t}%,customer_reference.ilike.%${t}%`).join(",");
    query=query.or(pats);

    (fl||[]).forEach(f=>flags[f.record_id]=f.open_types||[]); }catch(e){}

  const isoW=ds=>{ if(!ds) return null; const dt=new Date(ds+"T00:00:00Z");
    const t=new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate()));
    const day=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-day+3);
    const wy=t.getUTCFullYear(); const jan4=new Date(Date.UTC(wy,0,4));
    const wk=1+Math.round(((t-jan4)/86400000-3+((jan4.getUTCDay()+6)%7))/7);
    return wy+"-W"+String(wk).padStart(2,"0"); };
  let lastWeek=null;
  LAST_LIST=data;
  list.innerHTML=data.map(r=>`${weekGroup?(w=>{const h=w&&w!==lastWeek?`<div class="wk-head">${w}</div>`:""; lastWeek=w; return h;})(isoW(r.production_date)):""}<div class="rec" data-id="${r.id}">

        <div class="meta">${esc(r.model||"")}${r.light_type?" &middot; "+esc(r.light_type):""} &middot; SO ${esc(r.so_number||"-")}${r.planned_qty!=null?" &middot; qty "+r.planned_qty:""}${r.customer?" &middot; "+esc(r.customer):""}${r.customer_reference?" &middot; "+esc(r.customer_reference):""}</div>
      </div>
      <div class="r-right">
        <span class="chip" data-tone="${tone(r.status)}">${esc(r.status||"Open")}</span>
        <div class="meta" style="margin-top:4px">${esc(r.production_date||"")}</div>
      </div>
    </div>`).join("");
  list.querySelectorAll(".rec").forEach(el=>el.onclick=()=>openRecord(el.dataset.id));
  const pbtn=document.getElementById("printSel");
  const updPrint=()=>{ if(!pbtn) return; pbtn.style.display=QRSEL.size?"inline-flex":"none"; pbtn.textContent=`Print QRs (${QRSEL.size})`; };
  list.querySelectorAll(".qr-sel").forEach(cb=>{
    cb.checked=QRSEL.has(cb.dataset.qr);

  });
  updPrint();
  if(pbtn) pbtn.onclick=()=>{
    const recs=[...QRSEL].map(id=>LAST_LIST.find(r=>r.id===id)||{id});

    m.el.querySelector("#pr-sheet").onclick=()=>{ m.close(); printSheet(recs); };

    w.document.close();

  function zplExport(recs, size){
    const missing=recs.filter(r=>!r.serial);
    const base=location.origin+location.pathname.replace(/index\.html?$/,"");
    const zsan=t=>String(t==null?"":t).replace(/[\^~\\]/g," ");
    const L=[];

${kind?`^FO260,210^A0N,24,24^FDType: ${zsan(kind)}^FS`:""}
^XZ`});
      } else {

${head}

^FO330,108^A0N,30,30^FD${zsan((r.model||"").slice(0,28))}^FS
^FO330,152^A0N,30,30^FD${zsan(r.so_number||"")}${r.planned_qty?"  Qty "+r.planned_qty:""}^FS
^FO330,196^A0N,26,26^FD${zsan((r.customer||"").slice(0,30))}^FS

^FO330,300^A0N,20,20^FDNational Lighting Company^FS
^XZ`});

function chipSearch(boxId, inputId, onChange, live){
  const box=document.getElementById(boxId), inp=document.getElementById(inputId);
  let terms=[];
  const all=()=>terms.concat(inp.value.trim()?[inp.value.trim()]:[]).join(" ");
  const draw=()=>{
    box.querySelectorAll(".chip-s").forEach(x=>x.remove());
    terms.forEach((t,i)=>{
      const sp=document.createElement("span"); sp.className="chip-s";
      sp.innerHTML=`${esc(t)}<b data-i="${i}">\u00d7</b>`;
      box.insertBefore(sp,inp);
    });
    box.querySelectorAll(".chip-s b").forEach(b=>b.onclick=()=>{ terms.splice(+b.dataset.i,1); draw(); onChange(all()); });
  };
  const commit=()=>{
    const v=inp.value.trim(); if(!v) return false;
    v.split(/[,\s]+/).forEach(t=>{ if(t&&!terms.includes(t)) terms.push(t); });
    inp.value=""; draw(); onChange(all()); return true;
  };
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"||e.key===","){ e.preventDefault(); commit(); }
    else if(e.key==="Backspace"&&!inp.value&&terms.length){ terms.pop(); draw(); onChange(all()); }
  });
  if(live) inp.addEventListener("input",()=>onChange(all()));
  box.addEventListener("click",()=>inp.focus());
  return { get:all, set:a=>{ terms=a.slice(); draw(); }, commit, terms:()=>terms.slice() };
}

function modal(title, bodyHTML){

  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.querySelector(".x").onclick=close;
  bg.onclick=e=>{ if(e.target===bg) close(); };
  return { el:bg, close };
}

/* ---------------- Excel export (date range) ---------------- */
function openExport(){
  const today=new Date().toISOString().slice(0,10);
  const first=today.slice(0,8)+"01";
  const m=modal("Export records to Excel", `
    <p class="hint" style="margin:0 0 12px">Choose the production date range. Every record in that range is exported with its totals.</p>
    <div class="row">
      <div class="field"><label>From</label><input id="ex-from" type="date" value="${first}"></div>
      <div class="field"><label>To</label><input id="ex-to" type="date" value="${today}"></div>
    </div>
    <button class="btn primary" id="ex-go">Export</button>
    <div class="banner" id="ex-msg" style="margin-top:12px"></div>`);
  const go=m.el.querySelector("#ex-go"), msg=m.el.querySelector("#ex-msg");
  go.onclick=async()=>{
    const from=m.el.querySelector("#ex-from").value, to=m.el.querySelector("#ex-to").value;
    if(!from||!to){ msg.className="banner show err"; msg.textContent="Pick both dates."; return; }
    go.disabled=true; go.textContent="Building\u2026";
    try{
      const rows=await fetchRecordsRange(from,to);
      if(!rows.length){ msg.className="banner show err"; msg.textContent="No records in that range."; go.disabled=false; go.textContent="Export"; return; }
      buildWorkbook(rows,from,to);
      m.close();
    }catch(e){ msg.className="banner show err"; msg.textContent="Export failed: "+e.message; go.disabled=false; go.textContent="Export"; }
  };
}
async function fetchRecordsRange(from,to){
  const out=[]; const size=1000; let start=0;
  while(true){
    const { data, error }=await db.from("v_record_summary")
      .select("*").gte("production_date",from).lte("production_date",to)
      .order("production_date",{ascending:true}).range(start,start+size-1);
    if(error) throw error;
    out.push(...(data||[]));
    if(!data || data.length<size) break;
    start+=size;
  }
  return out;
}
function buildWorkbook(rows,from,to){
  const part=(m,i)=>((m||"").split("-")[i]||"");
  const data=rows.map(r=>({
    Serial:r.serial, "Production Date":r.production_date, "SO Number":r.so_number, "MO Number":r.mo_number,
    Customer:r.customer, "Customer Reference":r.customer_reference,
    "Odoo Variant Name":r.odoo_variant_name, "Odoo Variant ID":r.odoo_variant_id,
    "Light Type":r.light_type, Model:r.model,
    Series:r.series, Type:part(r.model,1), Watt:part(r.model,2), "Kelvin/Rating":part(r.model,3),
    Line:r.line, Foreman:r.foreman, "QC Checker":r.qc_checker, Status:r.status,
    "Total Units":r.total_units, "Entries":r.entry_count, "Workers":r.worker_count,
    "Total Minutes":r.total_mins!=null?Math.round(r.total_mins):"",
    "Avg Cycle (min/unit)":r.avg_cycle_time!=null?Math.round(r.avg_cycle_time*100)/100:""
  }));
  const ws=XLSX.utils.json_to_sheet(data);
  ws["!cols"]=Object.keys(data[0]).map(k=>({wch:Math.max(12,k.length+2)}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Records");
  XLSX.writeFile(wb,`NLC_Records_${from}_to_${to}.xlsx`);
}

      const s=document.getElementById("w-start").value, f=document.getElementById("w-finish").value;
      const q=parseInt(document.getElementById("w-qty").value||"0",10);
      const mins=minsBetween(s,f);
      if(mins==null){ prev.innerHTML=""; return; }
      const cyc=q>0?(mins/q):null;
      prev.innerHTML=`Total time <b>${mins} min</b>`+(cyc!=null?` &middot; Cycle <b>${Math.round(cyc*10)/10} min/unit</b>`:` &middot; enter a quantity for cycle time`);
    };
    ["w-start","w-finish","w-qty"].forEach(id=>document.getElementById(id).addEventListener("input",calc));

    selWorkers=[];
    const wIn=document.getElementById("w-staff-in");
    const commitWorker=()=>{
      const v=wIn.value.trim(); if(!v) return;
      const s=STAFF.find(x=>`${x.full_name} (${x.id})`===v || x.full_name.toLowerCase()===v.toLowerCase() || x.id===v);
      if(!s){ banner("No worker matches \u201c"+v+"\u201d."); return; }
      if(!selWorkers.includes(s.id)) selWorkers.push(s.id);
      wIn.value=""; renderChips();
    };
    wIn.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); commitWorker(); } });
    wIn.addEventListener("change",commitWorker);
    renderChips();

    loadWorkers();
  }
}

}

            <label class="radio" style="display:inline-flex;margin-left:8px"><input type="checkbox" data-pe="${role}|${sec}" ${p.can_edit?"checked":""}> edit</label>
          </td>`;}).join("")}</tr>`).join("")
      }</tbody></table></div>
    </div></div>`;

  document.getElementById("nr-add").onclick=async()=>{
    const name=document.getElementById("nr-name").value.trim();
    if(!name) return banner("Enter a role name.");
    const { error }=await db.rpc("create_role",{ p_role:name });
    if(error) return banner(error.message);
    banner(`Role "${name.toLowerCase()}" created. Set its permissions in the grid below.`,true);
    renderAdmin();
  };
  body.querySelectorAll("[data-del-role]").forEach(b=>b.onclick=async()=>{
    const role=b.dataset.delRole;
    if(!confirm(`Delete the role "${role}"? Its permission settings are removed.`)) return;
    const { error }=await db.rpc("delete_role",{ p_role:role });
    if(error) return banner(error.message);
    banner(`Role "${role}" deleted.`,true); renderAdmin();
  });
  document.getElementById("au-add").onclick=async()=>{
    const email=document.getElementById("au-email").value.trim().toLowerCase();
    const role=document.getElementById("au-role").value;
    if(!email) return banner("Enter an email address.");
    const { error }=await db.rpc("set_user_role",{ p_email:email, p_role:role, p_active:true });
    if(error) return banner(error.message);
    banner("Access updated for "+email+".",true); renderAdmin();
  };
  body.querySelectorAll("[data-role-for]").forEach(sel=>sel.onchange=async()=>{
    const email=sel.dataset.roleFor;
    const active=body.querySelector(`[data-active-for="${email}"]`).checked;
    const { error }=await db.rpc("set_user_role",{ p_email:email, p_role:sel.value, p_active:active });
    if(error){ banner(error.message); renderAdmin(); return; }
    banner("Role updated for "+email+".",true);
  });
  body.querySelectorAll("[data-active-for]").forEach(cb=>cb.onchange=async()=>{
    const email=cb.dataset.activeFor;
    const role=body.querySelector(`[data-role-for="${email}"]`).value;
    const { error }=await db.rpc("set_user_role",{ p_email:email, p_role:role, p_active:cb.checked });
    if(error){ banner(error.message); renderAdmin(); return; }
    banner((cb.checked?"Enabled ":"Disabled ")+email+".",true);
  });
  body.querySelectorAll("[data-del-user]").forEach(b=>b.onclick=async()=>{
    const email=b.dataset.delUser;
    if(!confirm("Remove access for "+email+"? They will fall back to the viewer role.")) return;
    const { error }=await db.rpc("delete_app_user",{ p_email:email });
    if(error) return banner(error.message);
    banner("Removed "+email+".",true); renderAdmin();
  });
  const savePerm=async(role,sec)=>{
    const v=body.querySelector(`[data-pv="${role}|${sec}"]`).checked;
    const eBox=body.querySelector(`[data-pe="${role}|${sec}"]`);
    if(!v) eBox.checked=false;
    const { error }=await db.rpc("set_role_permission",{ p_role:role, p_section:sec, p_can_view:v, p_can_edit:eBox.checked });
    if(error){ banner(error.message); renderAdmin(); return; }
    banner("Permissions updated.",true);
  };
  body.querySelectorAll("[data-pv]").forEach(cb=>cb.onchange=()=>{ const [r,s]=cb.dataset.pv.split("|"); savePerm(r,s); });
  body.querySelectorAll("[data-pe]").forEach(cb=>cb.onchange=()=>{ const [r,s]=cb.dataset.pe.split("|");
    if(cb.checked) body.querySelector(`[data-pv="${r}|${s}"]`).checked=true; savePerm(r,s); });
}

function applyGating(){
  const lock=(ids,allowed)=>{ if(allowed) return;
    ids.forEach(id=>{ const el=document.getElementById(id); if(el){ el.disabled=true; el.style.background="#f2f3f8"; } }); };
  // record fields
  lock(["f-date","f-status","f-so","f-mo","f-model","f-customer","f-cref","f-light","f-ovn","f-ovid",
        "f-qty","f-voltage","f-line","f-foreman","f-qc","save","addLight"], may("records","edit"));
  if(!may("records","edit")) document.querySelectorAll('input[name="kind"]').forEach(el=>el.disabled=true);
  // engineering
  lock(["f-bdriver","f-bled","f-bem","f-bhousing","f-bremarks"], may("engineering","edit"));
  // entries
  lock(["w-staff-in","w-conv","w-type","w-start","w-finish","w-qty","w-remarks","addWorker"], may("entries","edit"));
  // quality
  lock(["ccr-type","ccr-files","ccr-desc","ccr-qty","raiseCcr"], may("quality","edit"));
  // hide sections the role cannot view at all
  const hideCard=(headingText)=>{
    document.querySelectorAll(".card h2").forEach(h=>{
      if(h.textContent.trim().toLowerCase().startsWith(headingText)) h.closest(".card").style.display="none"; });
  };
  if(!may("engineering","view")) hideCard("engineering");
  if(!may("quality","view")) hideCard("quality issues");
  if(!may("entries","view")) hideCard("production entries");
  const note=document.getElementById("auditLine");
  if(note && !may("records","edit"))
    note.innerHTML='<span style="color:var(--warn)">Your role has read-only access to this section.</span>';
}

/* ---------------- BOM bulk editor ---------------- */
let BOMSRC="plans";  // BOM-first workflow: planning drafts are the default source
async function renderBomEditor(){
  setHash("#/bom");
  document.body.classList.add("wide");
  root.innerHTML=shell(`
    <button class="btn link" id="back">&larr; All records</button>
    <h1>BOM editor</h1>
    <p class="sub">Fill the BOM while orders are still in planning, so engineering data exists before production starts. Changed cells are highlighted; save writes everything together.</p>
    <div class="banner" id="banner"></div>
    <div class="toolbar">
      <div class="tabs" id="bomTabs">
        <button data-src="plans" class="${BOMSRC==="plans"?"on":""}">Planning drafts</button>
        <button data-src="records" class="${BOMSRC==="records"?"on":""}">Production records</button>
      </div>
      <div class="chipsearch" id="bomSearchBox" style="flex:1;min-width:170px"><input id="bomSearch" placeholder="Filter: type a term, press Enter to tag it"></div>
      <select id="bomOnly" style="max-width:190px">
        <option value="">All rows</option>
        <option value="missing">Incomplete BOM only</option>
      </select>
      <button class="btn primary" id="bomSave" disabled>Save changes (0)</button>
    </div>
    <div class="card"><div id="bomGrid"><div class="spinner"></div></div></div>`);
  wireShell();
  document.getElementById("back").onclick=renderHome;
  document.querySelectorAll("#bomTabs button").forEach(b=>b.onclick=()=>{ BOMSRC=b.dataset.src; renderBomEditor(); });

  const isPlans=BOMSRC==="plans";
  let data=[], error=null;
  const B=1000;
  for(let from=0; from<5000; from+=B){
    let chunk;
    if(isPlans){
      ({ data:chunk, error }=await db.from("planned_records")
        .select("id,odoo_so,sap_so,product_name,c_ref,model,customer,plan_status,planned_date,bom_driver,bom_led,bom_em,bom_housing,bom_remarks,bom_stock_status")
        .in("plan_status",["Draft","Returned","Pushed"])
        .order("created_at",{ascending:false}).range(from,from+B-1));
    } else {
      ({ data:chunk, error }=await db.from("production_records")
        .select("id,serial,production_date,so_number,model,customer,bom_driver,bom_led,bom_em,bom_housing,bom_remarks")
        .order("production_date",{ascending:false}).range(from,from+B-1));
    }
    if(error) break;
    data=data.concat(chunk||[]);
    if(!chunk || chunk.length<B) break;
  }
  const grid=document.getElementById("bomGrid");
  if(error){ grid.innerHTML=`<div class="empty">Could not load: ${esc(error.message)}</div>`; return; }
  if(!data.length){ grid.innerHTML=`<div class="empty">${isPlans?"No plans in Draft, Returned or Pushed.":"No production records yet."}</div>`; return; }

  const dirty={};
  const COLS=isPlans
    ?[["bom_driver","Driver"],["bom_led","LED"],["bom_em","EM"],["bom_housing","Housing"],["bom_remarks","Remarks"],["bom_stock_status","Stock status"]]
    :[["bom_driver","Driver"],["bom_led","LED"],["bom_em","EM"],["bom_housing","Housing"],["bom_remarks","Remarks"]];
  const orig={}; data.forEach(r=>{ orig[r.id]={}; COLS.forEach(([k])=>orig[r.id][k]=r[k]||""); });

  function rowVisible(r,q,only){
    if(only==="missing" && r.bom_driver && r.bom_led && r.bom_em && r.bom_housing){
      if(!dirty[r.id]) return false;
    }
    if(!q) return true;
    const terms=q.toLowerCase().split(/[,\s]+/).filter(Boolean);
    const hay=(isPlans?[r.odoo_so,r.sap_so,r.product_name,r.c_ref,r.model,r.customer]
                      :[r.serial,r.so_number,r.model,r.customer]).map(v=>(v||"").toLowerCase());
    return terms.some(t=>hay.some(v=>v.includes(t)));
  }
  function draw(){
    const q=bomCtl.get().trim();
    const only=document.getElementById("bomOnly").value;
    const rows=data.filter(r=>rowVisible(r,q,only));
    grid.innerHTML=`<div class="tbl-wrap"><table class="bom-table"><thead><tr>
        ${isPlans?`<th style="min-width:120px">SO</th><th>Product</th><th style="width:90px">Status</th>`
                 :`<th style="min-width:150px">Serial</th><th>Model</th><th style="width:90px">SO</th>`}
        ${COLS.map(c=>`<th style="min-width:140px">${c[1]}</th>`).join("")}
      </tr></thead><tbody>${
      rows.map(r=>`<tr>
        ${isPlans?`<td><b>${esc(r.odoo_so||r.sap_so||"")}</b><div class="meta">${esc(r.customer||"")}</div></td>
                   <td>${esc(r.product_name||r.model||"")}</td>
                   <td><span class="chip" data-tone="${r.plan_status==='Pushed'?'info':(r.plan_status==='Returned'?'hold':'')}">${esc(r.plan_status)}</span></td>`
                 :`<td><b>${esc(r.serial||"")}</b><div class="meta">${esc(r.production_date||"")}</div></td>
                   <td>${esc(r.model||"")}</td>
                   <td>${esc(r.so_number||"")}</td>`}
        ${COLS.map(([k])=>{
          const cur=(dirty[r.id]&&dirty[r.id][k]!==undefined)?dirty[r.id][k]:orig[r.id][k];
          const changed=dirty[r.id]&&dirty[r.id][k]!==undefined&&dirty[r.id][k]!==orig[r.id][k];
          if(k==="bom_stock_status")
            return `<td class="bom-cell${changed?" changed":""}"><select data-id="${r.id}" data-col="${k}">
              ${["","In Stock","Partial Stock","Cargo/PO Item"].map(o=>`<option value="${o}" ${cur===o?"selected":""}>${o||"\u2014"}</option>`).join("")}</select></td>`;
          return `<td class="bom-cell${changed?" changed":""}"><input data-id="${r.id}" data-col="${k}" value="${esc(cur)}"></td>`;
        }).join("")}
      </tr>`).join("")}</tbody></table></div>
      ${rows.length?"":'<div class="empty">Nothing matches the current filter.</div>'}`;
    grid.querySelectorAll("input[data-id], select[data-id]").forEach(inp=>{
      inp.addEventListener("input",()=>{
        const id=inp.dataset.id, col=inp.dataset.col, v=inp.value;
        dirty[id]=dirty[id]||{};
        if(v===orig[id][col]){ delete dirty[id][col]; if(!Object.keys(dirty[id]).length) delete dirty[id]; }
        else dirty[id][col]=v;
        inp.closest("td").classList.toggle("changed", dirty[id]&&dirty[id][col]!==undefined);
        updateSaveBtn();
      });
    });
  }
  function updateSaveBtn(){
    const n=Object.keys(dirty).length;
    const b=document.getElementById("bomSave");
    b.disabled=n===0; b.textContent=`Save changes (${n})`;
  }
  const bomCtl=chipSearch("bomSearchBox","bomSearch",()=>draw(),true);
  document.getElementById("bomOnly").addEventListener("change",draw);
  document.getElementById("bomSave").onclick=async()=>{
    const b=document.getElementById("bomSave");
    const rows=Object.entries(dirty).map(([id,ch])=>{
      const o={ id }; COLS.forEach(([k])=>o[k]=ch[k]!==undefined?ch[k]:orig[id][k]); return o; });
    b.disabled=true; b.textContent="Saving\u2026";
    const { data:count, error }=await db.rpc(isPlans?"bulk_update_plan_bom":"bulk_update_bom",{ p_rows:rows });
    if(error){ banner(error.message); updateSaveBtn(); return; }
    rows.forEach(r=>{ orig[r.id]={}; COLS.forEach(([k])=>orig[r.id][k]=r[k]||"");
      const rec=data.find(x=>x.id===r.id);
      if(rec) COLS.forEach(([k])=>rec[k]=r[k]); });
    Object.keys(dirty).forEach(k=>delete dirty[k]);
    updateSaveBtn(); draw();
    banner(`Updated ${count} ${isPlans?"plan":"record"}${count==1?"":"s"}.`,true);
  };
  draw();
}

/* ---------------- line load: capacity vs assigned pieces ---------------- */
let LINESMODE="day", LINESWEEK=null;
async function renderLines(){
  setHash("#/lines");
  document.body.classList.add("wide");
  if(!LINESWEEK) LINESWEEK=wkStr(new Date().toISOString().slice(0,10));
  root.innerHTML=shell(`
    <button class="btn link" id="back">&larr; All records</button>
    <h1>Line load</h1>
    <p class="sub">Pieces assigned to each line against its capacity, so the assembly team can balance the load. Click a capacity number to change it.</p>
    <div class="banner" id="banner"></div>
    <div class="toolbar">
      <div class="tabs" id="lmTabs">
        <button data-m="day" class="${LINESMODE==="day"?"on":""}">By day</button>
        <button data-m="week" class="${LINESMODE==="week"?"on":""}">By week</button>
      </div>
      <button class="btn ghost sm" id="lnPrev">&larr;</button>
      <b style="color:var(--navy)" id="lnRange"></b>
      <button class="btn ghost sm" id="lnNext">&rarr;</button>
      <button class="btn ghost sm" id="lnNow">This week</button>
    </div>
    <div class="card"><div id="linesGrid"><div class="spinner"></div></div></div>`);
  wireShell();
  document.getElementById("back").onclick=renderHome;
  document.querySelectorAll("#lmTabs button").forEach(b=>b.onclick=()=>{ LINESMODE=b.dataset.m; renderLines(); });
  document.getElementById("lnPrev").onclick=()=>{ shiftLines(-1); };
  document.getElementById("lnNext").onclick=()=>{ shiftLines(1); };
  document.getElementById("lnNow").onclick=()=>{ LINESWEEK=wkStr(new Date().toISOString().slice(0,10)); renderLines(); };
  await drawLines();
}
function shiftLines(dir){
  const mon=new Date(wkMon(LINESWEEK)+"T00:00:00Z");
  mon.setUTCDate(mon.getUTCDate()+dir*7*(LINESMODE==="week"?8:1));
  LINESWEEK=wkStr(mon.toISOString().slice(0,10));
  renderLines();
}
async function drawLines(){
  const grid=document.getElementById("linesGrid");
  const monISO=wkMon(LINESWEEK);
  let from, to, cols;   // cols: [{key,label}]
  if(LINESMODE==="day"){
    from=monISO;
    const end=new Date(monISO+"T00:00:00Z"); end.setUTCDate(end.getUTCDate()+6);
    to=end.toISOString().slice(0,10);
    cols=[];
    for(let i=0;i<7;i++){ const d=new Date(monISO+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+i);
      const iso=d.toISOString().slice(0,10);
      cols.push({key:iso,label:d.toLocaleDateString("en",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"})}); }
    document.getElementById("lnRange").textContent=LINESWEEK+" ("+cols[0].label+" to "+cols[6].label+")";
  } else {
    from=monISO;
    const end=new Date(monISO+"T00:00:00Z"); end.setUTCDate(end.getUTCDate()+8*7-1);
    to=end.toISOString().slice(0,10);
    cols=[];
    for(let i=0;i<8;i++){ const d=new Date(monISO+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+i*7);
      const w=wkStr(d.toISOString().slice(0,10)); cols.push({key:w,label:w.slice(5)}); }
    document.getElementById("lnRange").textContent=cols[0].key+" to "+cols[cols.length-1].key;
  }
  const [{ data:caps }, { data:recs, error }]=await Promise.all([
    db.from("line_capacity").select("line,daily_capacity").order("line"),
    db.from("production_records").select("id,serial,so_number,model,customer,line,production_date,planned_qty,status,record_kind")
      .gte("production_date",from).lte("production_date",to).not("line","is",null)
  ]);
  if(error){ grid.innerHTML=`<div class="empty">Could not load: ${esc(error.message)}</div>`; return; }
  const capOf={}; (caps||[]).forEach(c=>capOf[c.line]=c.daily_capacity);
  const lines=[...new Set([...(caps||[]).map(c=>c.line), ...(recs||[]).map(r=>r.line)])].sort();
  const load={};   // line -> colkey -> pieces
  const cellOrders={}; // "line|colkey" -> records
  (recs||[]).forEach(r=>{
    const key=LINESMODE==="day"?r.production_date:wkStr(r.production_date);
    if(!key) return;
    (load[r.line]=load[r.line]||{})[key]=(load[r.line]?.[key]||0)+(r.planned_qty||0);
    (cellOrders[r.line+"|"+key]=cellOrders[r.line+"|"+key]||[]).push(r);
  });
  const capFor=line=>LINESMODE==="day"?(capOf[line]??200):(capOf[line]??200)*5;
  grid.innerHTML=`<div class="tbl-wrap"><table style="min-width:900px"><thead><tr>
      <th style="min-width:130px">Line</th>
      <th style="width:110px">Capacity/${LINESMODE==="day"?"day":"week"}</th>
      ${cols.map(c=>`<th style="text-align:center">${esc(c.label)}</th>`).join("")}
      <th class="num">Total</th></tr></thead><tbody>
    ${lines.map(line=>{
      const cap=capFor(line);
      let total=0;
      const cells=cols.map(c=>{
        const n=load[line]?.[c.key]||0; total+=n;
        const pct=cap>0?n/cap:0;
        const tone=n===0?"":(pct>1?"hold":(pct>=.8?"":"ok"));
        const bar=Math.min(100,Math.round(pct*100));
        return `<td style="text-align:center;min-width:74px">
          ${n?`<span class="chip ld-chip" data-tone="${tone}" data-cell="${esc(line)}|${c.key}" title="Show the orders behind this number">${n}</span>
          <div class="ld-bar"><i style="width:${bar}%;background:${pct>1?"var(--hold)":(pct>=.8?"var(--warn)":"var(--ok)")}"></i></div>`
          :'<span style="color:var(--muted)">\u2013</span>'}</td>`;
      }).join("");
      return `<tr>
        <td><b>${esc(line)}</b></td>
        <td><a class="cap-edit" data-line="${esc(line)}" title="Click to change">${capOf[line]??200}/day</a></td>
        ${cells}
        <td class="num"><b>${total}</b></td></tr>`;
    }).join("")}
  </tbody></table></div>
  <p class="hint" style="padding:0 16px 14px">Green under 80% of capacity, amber from 80%, red over capacity. Load counts the record quantities assigned to each line for the ${LINESMODE==="day"?"day":"ISO week"}.</p>`;
  grid.querySelectorAll(".ld-chip").forEach(ch=>ch.onclick=()=>{
    const [line,key]=ch.dataset.cell.split("|");
    const list=(cellOrders[ch.dataset.cell]||[]).slice().sort((a,b)=>(b.planned_qty||0)-(a.planned_qty||0));
    const total=list.reduce((a,r)=>a+(r.planned_qty||0),0);
    const label=LINESMODE==="day"
      ? new Date(key+"T00:00:00Z").toLocaleDateString("en",{weekday:"long",day:"numeric",month:"short",timeZone:"UTC"})
      : key;
    const m=modal(`${line} \u00b7 ${label} \u00b7 ${total} pieces`, `
      <div class="tbl-wrap"><table><thead><tr><th>Serial</th><th>SO</th><th>Model</th><th>Customer</th>
        <th class="num">Qty</th><th>Status</th></tr></thead><tbody>${
        list.map(r=>`<tr class="ld-row" data-open="${r.id}" style="cursor:pointer" title="Open this record">
          <td><b>${esc(r.serial||"")}</b>${r.record_kind==="Sample"?' <span class="badge-sample">SAMPLE</span>':""}</td>
          <td>${esc(r.so_number||"")}</td>
          <td>${esc(r.model||"")}</td>
          <td>${esc(r.customer||"")}</td>
          <td class="num">${r.planned_qty??""}</td>
          <td><span class="chip" data-tone="${tone(r.status)}">${esc(r.status||"Open")}</span></td>
        </tr>`).join("")}</tbody></table></div>
      <p class="hint" style="margin-top:10px">Click a row to open the record.</p>`);
    m.el.querySelectorAll("[data-open]").forEach(tr=>tr.onclick=()=>{ m.close(); openRecord(tr.dataset.open); });
  });
  grid.querySelectorAll(".cap-edit").forEach(a=>a.onclick=async()=>{
    if(!may("records","edit")){ banner("Your role cannot change line capacity."); return; }
    const line=a.dataset.line;
    const v=prompt("Daily capacity (pieces) for "+line+":", capOf[line]??200);
    if(v===null) return;
    const n=parseInt(v,10);
    if(isNaN(n)||n<0){ banner("Enter a number of pieces, zero or more."); return; }
    const { error }=await db.rpc("set_line_capacity",{ p_line:line, p_capacity:n });
    if(error){ banner(error.message); return; }
    banner("Capacity updated for "+line+".",true); drawLines();
  });
}

async function saveRecord(){
  const kindEl=document.querySelector('input[name="kind"]:checked');
  const fabEl=document.querySelector('input[name="fab"]:checked');
  const payload={
    production_date:document.getElementById("f-date").value||null,
    status:document.getElementById("f-status").value,
    so_number:document.getElementById("f-so").value.trim(),
    mo_number:document.getElementById("f-mo").value.trim()||null,
    model:document.getElementById("f-model").value.trim(),
    customer:document.getElementById("f-customer").value.trim()||null,
    customer_reference:document.getElementById("f-cref").value.trim()||null,
    light_type:document.getElementById("f-light").value.trim()||null,
    odoo_variant_name:document.getElementById("f-ovn").value.trim()||null,
    odoo_variant_id:document.getElementById("f-ovid").value.trim()||null,
    voltage:document.getElementById("f-voltage").value.trim()||null,
    planned_qty:document.getElementById("f-qty").value.trim()||null,
    record_kind:kindEl?kindEl.value:"Production",
    needs_fabrication:fabEl?fabEl.value==="yes":false,
    bom_driver:document.getElementById("f-bdriver").value.trim()||null,
    bom_led:document.getElementById("f-bled").value.trim()||null,
    bom_em:document.getElementById("f-bem").value.trim()||null,
    bom_housing:document.getElementById("f-bhousing").value.trim()||null,
    bom_remarks:document.getElementById("f-bremarks").value.trim()||null,
    line:document.getElementById("f-line").value.trim()||null,
    foreman:document.getElementById("f-foreman").value.trim()||null,
    qc_checker:document.getElementById("f-qc").value.trim()||null
  };
  if(!payload.production_date||!payload.so_number||!payload.model)
    return banner("Production date, SO and model are required.");
  if(!payload.planned_qty)
    return banner("Quantity is required so entries can be checked against it.");

  // BOM completeness: warn, but let the user proceed
  const missing=[];
  if(!payload.bom_driver) missing.push("Driver");
  if(!payload.bom_led) missing.push("LED");
  if(!payload.bom_em) missing.push("EM");
  if(!payload.bom_housing) missing.push("Housing");
  if(missing.length){
    const ok=confirm("The BOM is missing: "+missing.join(", ")+".\n\nYou can fill these in later. Save anyway?");
    if(!ok) return;
  }

  const btn=document.getElementById("save"); btn.disabled=true; const label=btn.textContent; btn.textContent="Saving\u2026";

  if(!current){
    const { data, error }=await db.from("production_records").insert({...payload, created_by:SESSION.user.email}).select().single();
    btn.disabled=false; btn.textContent=label;
    if(error){ banner(error.message.includes("duplicate")?"A record with this date, SO and model already exists.":"Could not save: "+error.message); return; }
    current=data;
    setHash("#/record/"+data.id);
    const qi=document.getElementById("qrimg");
    qi.src=qrURL(data.serial); qi.className="kind-"+(data.record_kind||"Production");
    document.getElementById("serialTxt").textContent=data.serial;
    document.getElementById("afterCreate").classList.remove("hidden");
    document.querySelector("h1").textContent=data.serial;
    document.getElementById("save").textContent="Save changes";
    document.getElementById("printBtn").onclick=()=>printTag(current);
    document.getElementById("addWorker").onclick=addWorker;
    loadWorkers(); renderAudit(); updateBomChip();
    banner("Record created. Serial "+data.serial+".",true);
  } else {
    // update via POST RPC so proxies that block PATCH do not break saves
    const { data, error }=await db.rpc("update_production_record",{ p_id:current.id, p_fields:payload });
    btn.disabled=false; btn.textContent=label;
    if(error){ banner(/fetch/i.test(error.message||"")
        ?"Network error reaching the database. Check your connection, then try again."
        :"Could not save changes: "+error.message); return; }
    current=data; banner("Changes saved.",true); renderAudit(); updateBomChip();
    const qi=document.getElementById("qrimg");
    if(qi) qi.className="kind-"+(data.record_kind||"Production");
    loadWorkers();
  }
}

function updateBomChip(){
  const c=document.getElementById("bomChip"); if(!c) return;
  const vals=["f-bdriver","f-bled","f-bem","f-bhousing"].map(id=>{
    const el=document.getElementById(id); return el?el.value.trim():""; });
  const filled=vals.filter(Boolean).length;

}

    .select("id,qty,conveyor,start_time,finish_time,work_type,total_mins,cycle_time,remarks,staff_id,staff_ids")
    .eq("record_id",current.id).order("created_at",{ascending:true});

  if(error){ box.innerHTML=`<div class="empty">Could not load entries: ${esc(error.message)}</div>`; return; }

  if(!data.length){ box.innerHTML=`<div class="empty">No entries yet.</div>`; return; }
  const totQty=data.reduce((a,w)=>a+(w.qty||0),0);
  const totMin=data.reduce((a,w)=>a+(Number(w.total_mins)||0),0);
  const avgCyc=totQty>0?Math.round(totMin/totQty*10)/10:null;
  const qh=document.getElementById("qtyHint");
  window.__loggedUnits = totQty>0 ? totQty : null;
  const ch=document.getElementById("ccrQtyHint");
  if(ch){ const ceil=ccrCeiling();
    ch.innerHTML = ceil!=null ? `Out of <b>${ceil}</b> units on this record` : ""; }
  if(qh && current && current.planned_qty!=null){
    const rem=current.planned_qty-totQty;

    qh.style.color = rem<0 ? "var(--hold)" : (rem===0 ? "var(--ok)" : "var(--muted)");
  }
  box.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Worker</th><th>Conveyor</th><th>Start</th><th>Finish</th><th>Task</th>
    <th class="num">Qty</th><th class="num">Total min</th><th class="num">Cycle</th><th></th></tr></thead><tbody>${
    data.map(w=>`<tr>
      <td>${esc(namesOf(w))}${w.remarks?`<div class="meta">${esc(w.remarks)}</div>`:""}</td>
      <td>${esc(w.conveyor||"-")}</td>
      <td>${esc(t5(w.start_time))||"-"}</td>
      <td>${esc(t5(w.finish_time))||"-"}</td>
      <td>${w.work_type==="S"?"Stickers":"Complete"}</td>
      <td class="num">${w.qty??0}</td>
      <td class="num">${w.total_mins!=null?Math.round(w.total_mins):""}</td>
      <td class="num">${w.cycle_time!=null?Math.round(w.cycle_time*10)/10:""}</td>
      <td style="white-space:nowrap"><button class="btn link" data-edit="${w.id}" style="color:var(--navy)">Edit</button>
        <button class="btn danger" data-del="${w.id}">Remove</button></td>
    </tr>`).join("")}</tbody>
    <tfoot><tr class="totals">
      <td colspan="5" style="text-align:right">Record totals</td>
      <td class="num">${totQty}</td>
      <td class="num">${Math.round(totMin)}</td>
      <td class="num">${avgCyc!=null?avgCyc:""}</td><td></td>
    </tr></tfoot></table></div>`;
  box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delWorker(b.dataset.del));
  box.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{
    const w=data.find(x=>x.id===b.dataset.edit); if(w) editEntry(w, totQty);

/* ---------------- edit a worker entry ---------------- */
function editEntry(w, loggedTotal){
  const planned=current&&current.planned_qty!=null?current.planned_qty:null;
  const others=loggedTotal-(w.qty||0);
  const headroom=planned!=null?(planned-others):null;
  let sel=(w.staff_ids&&w.staff_ids.length)?w.staff_ids.slice():(w.staff_id?[w.staff_id]:[]);

  const m=modal("Edit entry", `
    <div class="row">
      <div class="field full"><label>Workers</label>
        <input id="ee-staff-in" list="stafflist2" placeholder="Type a name and press Enter">
        <datalist id="stafflist2">${STAFF.map(s=>`<option value="${esc(s.full_name)} (${esc(s.id)})">`).join("")}</datalist>
        <div id="ee-chips" class="chips"></div></div>
      <div class="field"><label>Conveyor</label><select id="ee-conv"><option value=""></option>${CONVEYORS.map(c=>`<option ${c===w.conveyor?"selected":""}>${c}</option>`).join("")}</select></div>
      <div class="field"><label>Task</label><select id="ee-type"><option value="C" ${w.work_type!=="S"?"selected":""}>Complete</option><option value="S" ${w.work_type==="S"?"selected":""}>Stickers</option></select></div>
      <div class="field"><label>Start time</label><input id="ee-start" type="time" value="${esc(t5(w.start_time))}"></div>
      <div class="field"><label>Completion time</label><input id="ee-finish" type="time" value="${esc(t5(w.finish_time))}"></div>
      <div class="field"><label>Quantity finished</label><input id="ee-qty" type="number" min="0" value="${w.qty??0}">
        ${headroom!=null?`<div class="hint">Maximum for this entry is <b>${headroom}</b> (record total ${planned}, other entries ${others}).</div>`:""}</div>
      <div class="field full"><label>Remarks</label><input id="ee-remarks" value="${esc(w.remarks||"")}"></div>
    </div>
    <div class="hint" id="ee-preview" style="margin-bottom:12px"></div>
    <button class="btn primary" id="ee-save">Save entry</button>
    <div class="banner" id="ee-msg" style="margin-top:12px"></div>`);

  const chips=()=>{ const box=m.el.querySelector("#ee-chips");
    box.innerHTML=sel.map(id=>`<span class="chip-w">${esc(staffName(id))}<b data-rm="${esc(id)}">\u00d7</b></span>`).join("");
    box.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{ sel=sel.filter(i=>i!==x.dataset.rm); chips(); }); };
  chips();
  const inp=m.el.querySelector("#ee-staff-in");
  const commit=()=>{ const v=inp.value.trim(); if(!v) return;
    const s=STAFF.find(x=>`${x.full_name} (${x.id})`===v || x.full_name.toLowerCase()===v.toLowerCase() || x.id===v);
    if(!s) return; if(!sel.includes(s.id)) sel.push(s.id); inp.value=""; chips(); };
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); commit(); } });
  inp.addEventListener("change",commit);

  const prev=m.el.querySelector("#ee-preview");
  const calc=()=>{ const mins=minsBetween(m.el.querySelector("#ee-start").value, m.el.querySelector("#ee-finish").value);
    const q=parseInt(m.el.querySelector("#ee-qty").value||"0",10);
    if(mins==null){ prev.innerHTML=""; return; }
    const c=q>0?Math.round(mins/q*10)/10:null;
    prev.innerHTML=`Total time <b>${mins} min</b>`+(c!=null?` &middot; Cycle <b>${c} min/unit</b>`:""); };
  ["ee-start","ee-finish","ee-qty"].forEach(id=>m.el.querySelector("#"+id).addEventListener("input",calc));
  calc();

  m.el.querySelector("#ee-save").onclick=async()=>{
    const btn=m.el.querySelector("#ee-save"), msg=m.el.querySelector("#ee-msg");
    const qty=parseInt(m.el.querySelector("#ee-qty").value||"0",10);
    if(headroom!=null && qty>headroom){
      msg.className="banner show err";
      msg.textContent=`Quantity cannot exceed ${headroom}. The record total is ${planned} and other entries already account for ${others}.`;
      return;
    }
    btn.disabled=true; btn.textContent="Saving\u2026";
    const fields={ staff_ids:sel, staff_id:sel[0]||null,
      conveyor:m.el.querySelector("#ee-conv").value||null,
      work_type:m.el.querySelector("#ee-type").value,
      start_time:m.el.querySelector("#ee-start").value||null,
      finish_time:m.el.querySelector("#ee-finish").value||null,
      qty:String(qty),
      remarks:m.el.querySelector("#ee-remarks").value.trim()||null };
    const { error }=await db.rpc("update_worker_entry",{ p_id:w.id, p_fields:fields });
    btn.disabled=false; btn.textContent="Save entry";
    if(error){ msg.className="banner show err"; msg.textContent=error.message; return; }
    m.close(); loadWorkers(); banner("Entry updated.",true);
  };
}

/* ---------------- CCR / quality issues ---------------- */
function ccrCeiling(){
  if(!current) return null;
  if(window.__loggedUnits) return window.__loggedUnits;
  return current.planned_qty!=null?current.planned_qty:null;
}

async function loadCcrs(){
  const box=document.getElementById("ccrList"); const cnt=document.getElementById("ccrCount");
  const { data:ccrs, error }=await db.from("ccrs").select("*").eq("record_id",current.id).order("created_at",{ascending:false});
  if(error){ box.innerHTML=`<div class="empty">Could not load issues: ${esc(error.message)}</div>`; return; }
  const open=(ccrs||[]).filter(c=>c.status!=="Resolved").length;
  cnt.textContent=(ccrs.length||0)+(ccrs.length===1?" issue":" issues"); cnt.setAttribute("data-tone",open?"hold":"ok");
  if(!ccrs.length){ box.innerHTML=`<div class="empty">No quality issues on this record.</div>`; return; }
  const ids=ccrs.map(c=>c.id);
  let docsByCcr={};
  const { data:docs }=await db.from("ccr_documents").select("*").in("ccr_id",ids);
  (docs||[]).forEach(d=>{ (docsByCcr[d.ccr_id]=docsByCcr[d.ccr_id]||[]).push(d); });
  box.innerHTML=ccrs.map(c=>`<div style="padding:14px 16px;border-top:1px solid var(--line)">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="chip" data-tone="${c.status==='Resolved'?'ok':'hold'}">${esc(c.issue_type||'Issue')}</span>
        ${c.affected_qty!=null?`<span class="badge-sample" style="background:var(--hold)">${c.affected_qty} affected</span>`:""}
        <span class="meta">${esc(c.status)} &middot; ${esc((c.created_at||'').slice(0,10))}${c.created_by?' &middot; '+esc(c.created_by):''}</span>
        ${c.status!=='Resolved'?`<button class="btn link" style="margin-left:auto" data-resolve="${c.id}">Mark resolved</button>`:''}
      </div>
      <div class="val" style="margin-top:6px">${esc(c.description)}</div>
      <div class="chips" style="margin-top:8px">${(docsByCcr[c.id]||[]).map(d=>`<a class="chip-w" style="text-decoration:none;cursor:pointer" data-doc="${esc(d.storage_path)}" data-name="${esc(d.file_name)}">\u{1F4CE} ${esc(d.file_name)}</a>`).join("")}</div>
    </div>`).join("");
  box.querySelectorAll("[data-resolve]").forEach(b=>b.onclick=()=>resolveCcr(b.dataset.resolve));
  box.querySelectorAll("[data-doc]").forEach(a=>a.onclick=()=>openDoc(a.dataset.doc));
}

async function raiseCcr(){
  const desc=document.getElementById("ccr-desc").value.trim();
  const type=document.getElementById("ccr-type").value;
  const files=document.getElementById("ccr-files").files;
  const qtyRaw=document.getElementById("ccr-qty").value.trim();
  const affected=qtyRaw===""?null:parseInt(qtyRaw,10);
  if(!desc){ banner("Describe the issue before raising it."); return; }
  const ceiling=ccrCeiling();
  if(affected!=null && ceiling!=null && affected>ceiling){
    banner(`Pieces affected cannot exceed the ${ceiling} units on this record.`); return; }
  const btn=document.getElementById("raiseCcr"); btn.disabled=true; btn.textContent="Saving\u2026";
  const { data:ccr, error }=await db.from("ccrs")
    .insert({record_id:current.id, issue_type:type, description:desc, affected_qty:affected, created_by:SESSION.user.email})
    .select().single();
  if(error){ btn.disabled=false; btn.textContent="Raise issue"; banner("Could not raise issue: "+error.message); return; }
  // upload any documents
  let uploadErr=null;
  for(const f of files){
    const path=`${current.id}/${ccr.id}/${Date.now()}_${f.name.replace(/[^\w.\-]/g,"_")}`;
    const { error:upErr }=await db.storage.from("ccr-docs").upload(path,f);
    if(upErr){ uploadErr=upErr.message; continue; }
    await db.from("ccr_documents").insert({ccr_id:ccr.id, file_name:f.name, storage_path:path, uploaded_by:SESSION.user.email});
  }
  btn.disabled=false; btn.textContent="Raise issue";
  document.getElementById("ccr-desc").value=""; document.getElementById("ccr-files").value=""; document.getElementById("ccr-qty").value="";
  banner(uploadErr?("Issue raised, but a file failed: "+uploadErr):"Issue raised.",!uploadErr);
  loadCcrs();
}

async function resolveCcr(id){
  const { error }=await db.rpc("set_ccr_status",{ p_id:id, p_status:"Resolved" });
  if(error){ banner(/fetch/i.test(error.message||"")?"Network error reaching the database. Try again.":"Could not update issue: "+error.message); return; }
  loadCcrs();
}

async function addLightType(){
  const name=prompt("New light type category:");
  if(!name) return;
  const clean=name.trim(); if(!clean) return;
  const { error }=await db.from("light_types").insert({name:clean});
  if(error && !/duplicate/i.test(error.message)){ banner("Could not add type: "+error.message); return; }
  if(!LIGHT_TYPES.includes(clean)){ LIGHT_TYPES.push(clean); LIGHT_TYPES.sort(); }
  const sel=document.getElementById("f-light");
  sel.innerHTML=`<option value=""></option>`+LIGHT_TYPES.map(x=>`<option>${esc(x)}</option>`).join("");
  sel.value=clean;
}

async function renderAudit(){
  const el=document.getElementById("auditLine"); if(!el||!current) return;
  let txt="";
  if(current.created_by||current.created_at) txt+=`Created by ${esc(current.created_by||"unknown")}${current.created_at?" on "+esc(current.created_at.slice(0,16).replace("T"," ")):""}`;
  if(current.updated_by) txt+=`${txt?" &middot; ":""}last updated by ${esc(current.updated_by)}${current.updated_at?" on "+esc(current.updated_at.slice(0,16).replace("T"," ")):""}`;
  el.innerHTML=txt;
}

async function openDoc(path){
  const { data, error }=await db.storage.from("ccr-docs").createSignedUrl(path,3600);
  if(error){ banner("Could not open file: "+error.message); return; }
  window.open(data.signedUrl,"_blank");
}

/* ---------------- print ---------------- */

  const isSample=(r.record_kind==="Sample");
  const bcol=isSample?"#F6851F":"#24275E";
  const w=window.open("","_blank","width=420,height=560");
  w.document.write(`<html><head><title>${esc(r.serial)}</title><style>
    body{font-family:Arial,sans-serif;text-align:center;padding:26px;color:#1c1e33}
    img{width:260px;height:260px;border:6px solid ${bcol};border-radius:6px;box-sizing:content-box}
    .kind{margin-top:12px;display:inline-block;font-size:12px;font-weight:800;letter-spacing:1px;
      color:#fff;background:${bcol};padding:3px 12px;border-radius:5px}
    .sn{font-size:26px;font-weight:800;color:#24275E;margin:10px 0 4px;letter-spacing:.5px}
    .m{font-size:15px;color:#444;margin:2px 0}
    .b{height:6px;background:${bcol};margin:18px auto 0;width:272px;border-radius:3px}
  </style></head><body>
    <img src="${qrURL(r.serial)}" alt="QR">
    <div class="kind">${isSample?"SAMPLE":"PRODUCTION"}</div>
    <div class="sn">${esc(r.serial)}</div>
    <div class="m">${esc(r.model||"")}</div>
    <div class="m">SO ${esc(r.so_number||"-")}${r.customer?" &middot; "+esc(r.customer):""}${r.planned_qty!=null?" &middot; Qty "+r.planned_qty:""}</div>
    <div class="b"></div>
    <script>setTimeout(function(){window.print()},400)<\/script>
  </body></html>`);
  w.document.close();
}
</script>
