<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NLC Traceability Console</title>
<style>
  :root{
    --navy:#24275E; --navy-deep:#1a1c45; --orange:#F6851F; --orange-soft:#fff2e6;
    --ink:#1c1e33; --muted:#71749a; --line:#e7e8f1; --bg:#f5f6fb; --card:#ffffff;
    --ok:#1f9d63; --ok-bg:#e7f6ee; --warn:#c9820b; --warn-bg:#fdf3e0;
    --info:#3457b2; --info-bg:#eaf0fc; --hold:#c0392b; --hold-bg:#fdecea;
    --radius:14px; --shadow:0 1px 2px rgba(36,39,94,.06),0 8px 24px rgba(36,39,94,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.45; -webkit-font-smoothing:antialiased}
  .wrap{max-width:760px; margin:0 auto; padding:0 16px 60px}

  header{background:var(--navy); color:#fff; padding:14px 16px; border-bottom:3px solid var(--orange)}
  .head-in{max-width:760px; margin:0 auto; display:flex; align-items:center; gap:12px}
  .brand-logo{height:32px; width:auto; display:block; flex:none}
  .brand-tag{font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:#b9bce0;
    padding-left:12px; border-left:1px solid rgba(255,255,255,.28)}
  .who{margin-left:auto; text-align:right; font-size:11.5px; color:#c3c6e6}
  .who a{color:#fff; text-decoration:underline; cursor:pointer; font-weight:600}

  h1{font-size:20px; margin:22px 0 2px; color:var(--navy)}
  .sub{color:var(--muted); font-size:13.5px; margin:0 0 16px}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); margin-top:14px}
  .card h2{margin:0; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--navy);
    padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px}
  .card .pad{padding:16px}

  .row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  @media(max-width:560px){ .row{grid-template-columns:1fr} }
  .field{margin-bottom:12px}
  .field.full{grid-column:1 / -1}
  label{display:block; font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
  input,select{width:100%; padding:10px 12px; font-size:15px; border:1px solid var(--line);
    border-radius:10px; background:#fbfbfe; color:var(--ink); font-family:inherit}
  input:focus,select:focus{outline:2px solid var(--orange); outline-offset:1px; border-color:transparent}
  .hint{font-size:12px; color:var(--muted); margin-top:5px}
  .hint b{color:var(--navy); font-variant-numeric:tabular-nums}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
  .chip-w{display:inline-flex; align-items:center; gap:6px; background:var(--orange-soft); color:#a55a12;
    border:1px solid #f3d3ad; border-radius:999px; padding:4px 6px 4px 11px; font-size:13px; font-weight:600}
  .chip-w b{cursor:pointer; color:#c0392b; font-weight:800; padding:0 3px; line-height:1}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 18px;
    font-size:15px; font-weight:700; border:none; border-radius:10px; cursor:pointer; font-family:inherit}
  .btn.primary{background:var(--navy); color:#fff}
  .btn.primary:active{background:var(--navy-deep)}
  .btn.orange{background:var(--orange); color:#fff}
  .btn.ghost{background:#fff; color:var(--navy); border:1px solid var(--line)}
  .btn.sm{padding:8px 12px; font-size:13px}
  .btn[disabled]{opacity:.55; cursor:default}
  .btn.link{background:none; border:none; color:var(--muted); padding:6px; font-weight:600; cursor:pointer}
  .btn.danger{background:none; border:none; color:var(--hold); cursor:pointer; font-size:13px; font-weight:600}

  .chip{display:inline-block; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px;
    background:var(--warn-bg); color:var(--warn)}
  .chip[data-tone="ok"]{background:var(--ok-bg); color:var(--ok)}
  .chip[data-tone="info"]{background:var(--info-bg); color:var(--info)}
  .chip[data-tone="hold"]{background:var(--hold-bg); color:var(--hold)}

  .toolbar{display:flex; gap:10px; align-items:center; margin-top:14px; flex-wrap:wrap}
  .toolbar input{flex:1; min-width:180px}

  .rec{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer}
  .rec:last-child{border-bottom:none}
  .rec:hover{background:#fafbff}
  .rec .sn{font-weight:700; color:var(--navy); font-variant-numeric:tabular-nums; font-size:14px}
  .rec .meta{font-size:12.5px; color:var(--muted)}
  .rec .r-right{margin-left:auto; text-align:right}

  table{width:100%; border-collapse:collapse; font-size:13.5px}
  thead th{background:#f0f1f8; color:var(--navy); text-align:left; padding:9px 12px; font-size:11px; letter-spacing:.5px}
  tbody td{padding:9px 12px; border-top:1px solid var(--line)}
  tbody td.num{text-align:right; font-variant-numeric:tabular-nums}

  .qrbox{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
  .qrbox img{width:150px; height:150px; border:1px solid var(--line); border-radius:10px; background:#fff}
  .qrbox .serial{font-size:22px; font-weight:800; color:var(--navy); font-variant-numeric:tabular-nums; word-break:break-all}

  .banner{margin-top:16px; padding:12px 14px; border-radius:10px; font-size:14px; display:none}
  .banner.show{display:block}
  .banner.ok{background:var(--ok-bg); color:var(--ok)}
  .banner.err{background:var(--hold-bg); color:var(--hold)}

  /* login */
  .login{max-width:380px; margin:60px auto; padding:0 16px}
  .login .card{margin-top:0}
  .login .logo-wrap{text-align:center; margin-bottom:22px}
  .login .logo-wrap img{height:40px}

  .empty{padding:26px 16px; text-align:center; color:var(--muted); font-size:14px}
  .spinner{width:30px; height:30px; margin:40px auto; border:3px solid var(--line);
    border-top-color:var(--orange); border-radius:50%; animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.spinner{animation:none}}
  .hidden{display:none !important}
</style>
</head>

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const root = document.getElementById("root");
const STATUSES = ["Open","In Progress","QC","Completed","Hold"];
const CONVEYORS = Array.from({length:10},(_,i)=>"Conveyor #"+String(i+1).padStart(2,"0"));
let STAFF = [];
let SESSION = null;
let current = null;   // currently open record
let selWorkers = [];  // staff ids chosen for the next entry

const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const t5  = v => v ? String(v).slice(0,5) : "";
const tone = s => { const x=(s||"").toLowerCase();
  if(/complete|closed|passed/.test(x))return"ok"; if(/hold|reject|fail/.test(x))return"hold";
  if(/progress|qc|check/.test(x))return"info"; return""; };
const qrURL = sn => "https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=0&data="+encodeURIComponent(VIEWER_BASE+"?sn="+sn);
const minsBetween = (s,f)=>{ if(!s||!f) return null;
  const [a,b]=s.split(":").map(Number), [c,d]=f.split(":").map(Number);
  let m=(c*60+d)-(a*60+b); if(m<0) m+=24*60; return m; };
const staffName = id => { if(!id) return "Unassigned"; const s=STAFF.find(x=>x.id===id); return s?s.full_name:("ID "+id); };
const namesOf = w => { const ids=(w.staff_ids&&w.staff_ids.length)?w.staff_ids:(w.staff_id?[w.staff_id]:[]);
  return ids.length?ids.map(staffName).join(", "):"Unassigned"; };
function renderChips(){
  const box=document.getElementById("w-chips"); if(!box) return;
  box.innerHTML=selWorkers.map(id=>`<span class="chip-w">${esc(staffName(id))}<b data-rm="${esc(id)}">\u00d7</b></span>`).join("");
  box.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{ selWorkers=selWorkers.filter(i=>i!==x.dataset.rm); renderChips(); });
}

/* ---------------- boot ---------------- */
(async function(){
  const { data:{ session } } = await db.auth.getSession();
  if(!session){ renderLogin(); return; }
  SESSION = session;
  const { data:staff } = await db.from("staff").select("id,full_name,called_name").order("full_name");
  STAFF = staff||[];
  renderHome();
})();

/* ---------------- login ---------------- */
function renderLogin(msg){
  root.innerHTML = `<div class="login">
    <div class="logo-wrap"><img src="${LOGO}" alt="NLC"></div>
    <div class="card"><h2>Staff sign in</h2><div class="pad">
      <div class="field"><label>Email</label><input id="l-email" type="email" autocomplete="username" inputmode="email"></div>
      <div class="field"><label>Password</label><input id="l-pass" type="password" autocomplete="current-password"></div>
      <button class="btn primary" id="l-go" style="width:100%">Sign in</button>
      <div class="banner err ${msg?'show':''}" id="l-msg">${esc(msg||"")}</div>
    </div></div>
    <p class="sub" style="text-align:center;margin-top:14px">Accounts are created by your admin. There is no self sign up.</p>
  </div>`;
  const go=document.getElementById("l-go");
  const submit=async()=>{
    const email=document.getElementById("l-email").value.trim(), pass=document.getElementById("l-pass").value;
    if(!email||!pass) return renderLogin("Enter your email and password.");
    go.disabled=true; go.textContent="Signing in\u2026";
    const { error }=await db.auth.signInWithPassword({email,password:pass});
    if(error) return renderLogin("Sign in failed. Check your details and try again.");
    location.reload();
  };
  go.onclick=submit;
  document.getElementById("l-pass").addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
}

function shell(inner){
  return `<header><div class="head-in">
      <img class="brand-logo" src="${LOGO}" alt="NLC"><span class="brand-tag">Console</span>
      <div class="who">${esc(SESSION.user.email)}<br><a id="signout">Sign out</a></div>
    </div></header><div class="wrap">${inner}</div>`;
}
function wireShell(){
  const so=document.getElementById("signout");
  if(so) so.onclick=async()=>{ await db.auth.signOut(); location.reload(); };
}

/* ---------------- home: new + search + recent ---------------- */
async function renderHome(){
  root.innerHTML = shell(`
    <h1>Production records</h1>
    <p class="sub">Create a record to generate its serial and QR, then fill details as assembly progresses.</p>
    <div class="toolbar">
      <button class="btn primary" id="newBtn">+ New record</button>
      <input id="search" placeholder="Search serial, SO, MO, model, customer">
      <button class="btn ghost" id="searchBtn">Search</button>
      <a class="btn ghost" href="dashboard.html">Dashboard</a>
    </div>
    <div class="card"><h2>Recent</h2><div id="list"><div class="spinner"></div></div></div>
  `);
  wireShell();
  document.getElementById("newBtn").onclick=()=>renderEditor(null);
  const doSearch=()=>loadList(document.getElementById("search").value.trim());
  document.getElementById("searchBtn").onclick=doSearch;
  document.getElementById("search").addEventListener("keydown",e=>{if(e.key==="Enter")doSearch();});
  loadList("");
}

async function loadList(q){
  const list=document.getElementById("list");
  let query=db.from("production_records")
    .select("id,serial,production_date,so_number,model,customer,status")
    .order("created_at",{ascending:false}).limit(30);
  if(q) query=query.or(`serial.ilike.%${q}%,so_number.ilike.%${q}%,mo_number.ilike.%${q}%,model.ilike.%${q}%,customer.ilike.%${q}%`);
  const { data, error }=await query;
  if(error){ list.innerHTML=`<div class="empty">Could not load records.</div>`; return; }
  if(!data.length){ list.innerHTML=`<div class="empty">${q?"No matches for \u201c"+esc(q)+"\u201d.":"No records yet. Create your first one."}</div>`; return; }
  list.innerHTML=data.map(r=>`<div class="rec" data-id="${r.id}">
      <div>
        <div class="sn">${esc(r.serial||"(no serial)")}</div>
        <div class="meta">${esc(r.model||"")} &middot; SO ${esc(r.so_number||"-")}${r.customer?" &middot; "+esc(r.customer):""}</div>
      </div>
      <div class="r-right">
        <span class="chip" data-tone="${tone(r.status)}">${esc(r.status||"Open")}</span>
        <div class="meta" style="margin-top:4px">${esc(r.production_date||"")}</div>
      </div>
    </div>`).join("");
  list.querySelectorAll(".rec").forEach(el=>el.onclick=()=>openRecord(el.dataset.id));
}

async function openRecord(id){
  const { data, error }=await db.from("production_records").select("*").eq("id",id).single();
  if(error) return;
  renderEditor(data);
}

/* ---------------- editor (create + edit) ---------------- */
function opt(list,val){ return list.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join(""); }
function staffOpts(val){
  return `<option value="">Select worker\u2026</option>`+STAFF.map(s=>
    `<option value="${esc(s.id)}" ${s.id===val?"selected":""}>${esc(s.full_name)} (${esc(s.id)})</option>`).join("");
}

function renderEditor(rec){
  current=rec;
  const isNew=!rec;
  const r=rec||{ production_date:new Date().toISOString().slice(0,10), status:"Open" };
  const nameList=STAFF.map(s=>`<option value="${esc(s.full_name)}">`).join("");

  root.innerHTML = shell(`
    <button class="btn link" id="back">&larr; All records</button>
    <h1>${isNew?"New record":esc(r.serial||"Record")}</h1>
    <p class="sub">${isNew?"Enter the essentials to create the record. You can fill the rest later.":"Update fields anytime. Changes save to the database."}</p>
    <div class="banner" id="banner"></div>

    <div class="card"><h2>Record</h2><div class="pad">
      <div class="row">
        <div class="field"><label>Production date *</label><input id="f-date" type="date" value="${esc(r.production_date||"")}"></div>
        <div class="field"><label>Status</label><select id="f-status">${opt(STATUSES,r.status||"Open")}</select></div>
        <div class="field"><label>Sales order (SO) *</label><input id="f-so" value="${esc(r.so_number||"")}" placeholder="S00311"></div>
        <div class="field"><label>MO number</label><input id="f-mo" value="${esc(r.mo_number||"")}"></div>
        <div class="field full"><label>Model *</label><input id="f-model" value="${esc(r.model||"")}" placeholder="SM-01-37W-4000K">
          <div class="hint" id="parse"></div></div>
        <div class="field full"><label>Customer</label><input id="f-customer" value="${esc(r.customer||"")}"></div>
        <div class="field"><label>Line</label><input id="f-line" list="convlist" value="${esc(r.line||"")}"></div>
        <div class="field"><label>Foreman</label><input id="f-foreman" list="namelist" value="${esc(r.foreman||"")}"></div>
        <div class="field"><label>QC checker</label><input id="f-qc" list="namelist" value="${esc(r.qc_checker||"")}"></div>
      </div>
      <datalist id="convlist">${CONVEYORS.map(c=>`<option value="${c}">`).join("")}</datalist>
      <datalist id="namelist">${nameList}</datalist>
      <button class="btn primary" id="save">${isNew?"Create record":"Save changes"}</button>
    </div></div>

    <div id="afterCreate" class="${isNew?"hidden":""}">
      <div class="card"><h2>Tag</h2><div class="pad"><div class="qrbox">
        <img id="qrimg" alt="QR" src="${rec&&rec.serial?qrURL(rec.serial):""}">
        <div>
          <div class="serial" id="serialTxt">${esc((rec&&rec.serial)||"")}</div>
          <p class="hint" style="margin:6px 0 12px">Print this and place it inside the product. Scanning always shows the live record.</p>
          <button class="btn orange sm" id="printBtn">Print tag</button>
        </div>
      </div></div></div>

      <div class="card"><h2>Production entries <span id="wc" class="chip" style="margin-left:auto"></span></h2>
        <div class="pad">
          <p class="hint" style="margin:0 0 12px">One entry per worker. Total time and cycle time are calculated for you from the start time, completion time and quantity.</p>
          <div class="row">
            <div class="field full"><label>Workers (add one or more)</label>
              <input id="w-staff-in" list="stafflist" placeholder="Type a name and press Enter">
              <datalist id="stafflist">${STAFF.map(s=>`<option value="${esc(s.full_name)} (${esc(s.id)})">`).join("")}</datalist>
              <div id="w-chips" class="chips"></div>
            </div>
            <div class="field"><label>Conveyor</label><select id="w-conv"><option value=""></option>${CONVEYORS.map(c=>`<option>${c}</option>`).join("")}</select></div>
            <div class="field"><label>Task</label><select id="w-type"><option value="C">Complete</option><option value="S">Stickers</option></select></div>
            <div class="field"><label>Start time</label><input id="w-start" type="time"></div>
            <div class="field"><label>Completion time</label><input id="w-finish" type="time"></div>
            <div class="field"><label>Quantity finished</label><input id="w-qty" type="number" min="0" value="0"></div>
            <div class="field full"><label>Remarks</label><input id="w-remarks"></div>
          </div>
          <div class="hint" id="wPreview" style="margin-bottom:12px"></div>
          <button class="btn ghost" id="addWorker">+ Add entry</button>
        </div>
        <div id="workers"></div>
      </div>
    </div>
  `);
  wireShell();
  document.getElementById("back").onclick=renderHome;

  const modelInput=document.getElementById("f-model");
  const parse=document.getElementById("parse");
  const showParse=()=>{ const p=(modelInput.value||"").split("-");
    parse.innerHTML=p[0]?`Series <b>${esc(p[0]||"-")}</b> &middot; Type <b>${esc(p[1]||"-")}</b> &middot; Watt <b>${esc(p[2]||"-")}</b> &middot; Kelvin/rating <b>${esc(p[3]||"-")}</b>`:""; };
  modelInput.addEventListener("input",showParse); showParse();

  document.getElementById("save").onclick=saveRecord;
  if(!isNew){
    document.getElementById("printBtn").onclick=()=>printTag(current);
    document.getElementById("addWorker").onclick=addWorker;
    const prev=document.getElementById("wPreview");
    const calc=()=>{
      const s=document.getElementById("w-start").value, f=document.getElementById("w-finish").value;
      const q=parseInt(document.getElementById("w-qty").value||"0",10);
      const mins=minsBetween(s,f);
      if(mins==null){ prev.innerHTML=""; return; }
      const cyc=q>0?(mins/q):null;
      prev.innerHTML=`Total time <b>${mins} min</b>`+(cyc!=null?` &middot; Cycle <b>${Math.round(cyc*10)/10} min/unit</b>`:` &middot; enter a quantity for cycle time`);
    };
    ["w-start","w-finish","w-qty"].forEach(id=>document.getElementById(id).addEventListener("input",calc));

    selWorkers=[];
    const wIn=document.getElementById("w-staff-in");
    const commitWorker=()=>{
      const v=wIn.value.trim(); if(!v) return;
      const s=STAFF.find(x=>`${x.full_name} (${x.id})`===v || x.full_name.toLowerCase()===v.toLowerCase() || x.id===v);
      if(!s){ banner("No worker matches \u201c"+v+"\u201d."); return; }
      if(!selWorkers.includes(s.id)) selWorkers.push(s.id);
      wIn.value=""; renderChips();
    };
    wIn.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); commitWorker(); } });
    wIn.addEventListener("change",commitWorker);
    renderChips();

    loadWorkers();
  }
}

function banner(msg,ok){
  const b=document.getElementById("banner");
  b.textContent=msg; b.className="banner show "+(ok?"ok":"err");
  if(ok) setTimeout(()=>b.classList.remove("show"),2500);
}

async function saveRecord(){
  const payload={
    production_date:document.getElementById("f-date").value||null,
    status:document.getElementById("f-status").value,
    so_number:document.getElementById("f-so").value.trim(),
    mo_number:document.getElementById("f-mo").value.trim()||null,
    model:document.getElementById("f-model").value.trim(),
    customer:document.getElementById("f-customer").value.trim()||null,
    line:document.getElementById("f-line").value.trim()||null,
    foreman:document.getElementById("f-foreman").value.trim()||null,
    qc_checker:document.getElementById("f-qc").value.trim()||null
  };
  if(!payload.production_date||!payload.so_number||!payload.model)
    return banner("Production date, SO and model are required.");
  const btn=document.getElementById("save"); btn.disabled=true; const label=btn.textContent; btn.textContent="Saving\u2026";

  if(!current){
    const { data, error }=await db.from("production_records").insert(payload).select().single();
    btn.disabled=false; btn.textContent=label;
    if(error){ banner(error.message.includes("duplicate")?"A record with this date, SO and model already exists.":"Could not save: "+error.message); return; }
    current=data;
    document.getElementById("qrimg").src=qrURL(data.serial);
    document.getElementById("serialTxt").textContent=data.serial;
    document.getElementById("afterCreate").classList.remove("hidden");
    document.querySelector("h1").textContent=data.serial;
    document.getElementById("save").textContent="Save changes";
    document.getElementById("printBtn").onclick=()=>printTag(current);
    document.getElementById("addWorker").onclick=addWorker;
    loadWorkers();
    banner("Record created. Serial "+data.serial+".",true);
  } else {
    const { data, error }=await db.from("production_records").update(payload).eq("id",current.id).select();
    btn.disabled=false; btn.textContent=label;
    if(error){ banner(error.message.includes("duplicate")?"Another record already has this date, SO and model.":"Could not save changes: "+error.message); return; }
    if(!data||!data.length){ banner("No matching record was updated. Reopen it and try again."); return; }
    current=data[0]; banner("Changes saved.",true);
  }
}

/* ---------------- worker entries ---------------- */
async function loadWorkers(){
  const box=document.getElementById("workers");
  const { data, error }=await db.from("worker_entries")
    .select("id,qty,conveyor,start_time,finish_time,work_type,total_mins,cycle_time,remarks,staff_id,staff_ids")
    .eq("record_id",current.id).order("created_at",{ascending:true});
  const wc=document.getElementById("wc");
  if(error){ box.innerHTML=`<div class="empty">Could not load entries: ${esc(error.message)}</div>`; return; }
  wc.textContent=(data.length||0)+(data.length===1?" entry":" entries");
  if(!data.length){ box.innerHTML=`<div class="empty">No entries yet.</div>`; return; }
  const totQty=data.reduce((a,w)=>a+(w.qty||0),0);
  const totMin=data.reduce((a,w)=>a+(Number(w.total_mins)||0),0);
  const avgCyc=totQty>0?Math.round(totMin/totQty*10)/10:null;
  box.innerHTML=`<table><thead><tr><th>Worker</th><th>Conveyor</th><th>Start</th><th>Finish</th><th>Task</th>
    <th class="num">Qty</th><th class="num">Total min</th><th class="num">Cycle</th><th></th></tr></thead><tbody>${
    data.map(w=>`<tr>
      <td>${esc(namesOf(w))}${w.remarks?`<div class="meta">${esc(w.remarks)}</div>`:""}</td>
      <td>${esc(w.conveyor||"-")}</td>
      <td>${esc(t5(w.start_time))||"-"}</td>
      <td>${esc(t5(w.finish_time))||"-"}</td>
      <td>${w.work_type==="S"?"Stickers":"Complete"}</td>
      <td class="num">${w.qty??0}</td>
      <td class="num">${w.total_mins!=null?Math.round(w.total_mins):""}</td>
      <td class="num">${w.cycle_time!=null?Math.round(w.cycle_time*10)/10:""}</td>
      <td><button class="btn danger" data-del="${w.id}">Remove</button></td>
    </tr>`).join("")}</tbody>
    <tfoot><tr style="font-weight:700;color:var(--navy)">
      <td colspan="5" style="text-align:right">Record totals</td>
      <td class="num">${totQty}</td>
      <td class="num">${Math.round(totMin)}</td>
      <td class="num">${avgCyc!=null?avgCyc:""}</td><td></td>
    </tr></tfoot></table>`;
  box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delWorker(b.dataset.del));
}

async function addWorker(){
  const payload={
    record_id:current.id,
    staff_ids:selWorkers.length?selWorkers.slice():null,
    staff_id:selWorkers[0]||null,
    conveyor:document.getElementById("w-conv").value||null,
    work_type:document.getElementById("w-type").value,
    start_time:document.getElementById("w-start").value||null,
    finish_time:document.getElementById("w-finish").value||null,
    qty:parseInt(document.getElementById("w-qty").value||"0",10),
    remarks:document.getElementById("w-remarks").value.trim()||null
  };
  const btn=document.getElementById("addWorker"); btn.disabled=true; btn.textContent="Adding\u2026";
  const { error }=await db.from("worker_entries").insert(payload);
  btn.disabled=false; btn.textContent="+ Add entry";
  if(error){ banner("Could not add entry: "+error.message); return; }
  ["w-staff-in","w-conv","w-start","w-finish","w-remarks"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("w-qty").value="0";
  selWorkers=[]; renderChips(); document.getElementById("wPreview").innerHTML="";
  loadWorkers();
}

async function delWorker(id){
  const { error }=await db.from("worker_entries").delete().eq("id",id);
  if(error){ banner("Could not remove entry: "+error.message); return; }
  loadWorkers();
}

/* ---------------- print ---------------- */
function printTag(r){
  const w=window.open("","_blank","width=420,height=560");
  w.document.write(`<html><head><title>${esc(r.serial)}</title><style>
    body{font-family:Arial,sans-serif;text-align:center;padding:26px;color:#1c1e33}
    img{width:260px;height:260px}
    .sn{font-size:26px;font-weight:800;color:#24275E;margin:14px 0 4px;letter-spacing:.5px}
    .m{font-size:15px;color:#444;margin:2px 0}
    .b{height:6px;background:#F6851F;margin:18px auto 0;width:260px;border-radius:3px}
  </style></head><body>
    <img src="${qrURL(r.serial)}" alt="QR">
    <div class="sn">${esc(r.serial)}</div>
    <div class="m">${esc(r.model||"")}</div>
    <div class="m">SO ${esc(r.so_number||"-")}${r.customer?" &middot; "+esc(r.customer):""}</div>
    <div class="b"></div>
    <script>setTimeout(function(){window.print()},400)<\/script>
  </body></html>`);
  w.document.close();
}
</script>
</body>
</html>
