<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NLC Traceability Dashboard</title>
<style>
  :root{
    --navy:#24275E; --navy-deep:#1a1c45; --orange:#F6851F; --orange-soft:#fff2e6;
    --ink:#1c1e33; --muted:#71749a; --line:#e7e8f1; --bg:#f5f6fb; --card:#ffffff;
    --radius:14px; --shadow:0 1px 2px rgba(36,39,94,.06),0 8px 24px rgba(36,39,94,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.45; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px; margin:0 auto; padding:0 16px 60px}
  header{background:var(--navy); color:#fff; padding:14px 16px; border-bottom:3px solid var(--orange)}
  .head-in{max-width:1040px; margin:0 auto; display:flex; align-items:center; gap:12px}
  .brand-logo{height:32px; width:auto; display:block; flex:none}
  .brand-tag{font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:#b9bce0;
    padding-left:12px; border-left:1px solid rgba(255,255,255,.28)}
  .who{margin-left:auto; text-align:right; font-size:11.5px; color:#c3c6e6}
  .who a{color:#fff; text-decoration:underline; cursor:pointer; font-weight:600}

  h1{font-size:20px; margin:22px 0 2px; color:var(--navy)}
  .sub{color:var(--muted); font-size:13.5px; margin:0 0 16px}
  .backlink{display:inline-block; margin-top:16px; color:var(--muted); font-weight:600; text-decoration:none; font-size:14px}

  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:6px}
  @media(max-width:640px){ .stats{grid-template-columns:repeat(2,1fr)} }
  .stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow)}
  .stat b{display:block; font-size:28px; color:var(--navy); font-variant-numeric:tabular-nums}
  .stat span{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--muted)}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px}
  @media(max-width:760px){ .grid{grid-template-columns:1fr} }
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px}
  .card.full{grid-column:1 / -1}
  .card h2{margin:0 0 12px; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--navy)}
  .chartbox{position:relative; height:280px}
  .empty{padding:30px 10px; text-align:center; color:var(--muted); font-size:14px}

  .spinner{width:30px; height:30px; margin:60px auto; border:3px solid var(--line);
    border-top-color:var(--orange); border-radius:50%; animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.spinner{animation:none}}
  .login{max-width:380px; margin:60px auto; padding:0 16px; text-align:center}
  .login img{height:40px; margin-bottom:20px}
  .login .card{text-align:left}
  label{display:block; font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); margin:12px 0 5px}
  input{width:100%; padding:10px 12px; font-size:15px; border:1px solid var(--line); border-radius:10px; background:#fbfbfe}
  .btn{display:inline-flex; align-items:center; justify-content:center; padding:11px 18px; font-size:15px;
    font-weight:700; border:none; border-radius:10px; cursor:pointer; background:var(--navy); color:#fff; width:100%; margin-top:16px}
  .msg{color:#c0392b; font-size:13px; margin-top:10px; display:none}
  .msg.show{display:block}
</style>
</head>

  SESSION=session; renderDash();
})();

function renderLogin(msg){
  root.innerHTML=`<div class="login"><img src="${LOGO}" alt="NLC">
    <div class="card">
      <label>Email</label><input id="l-email" type="email">
      <label>Password</label><input id="l-pass" type="password">
      <button class="btn" id="l-go">Sign in</button>
      <div class="msg ${msg?'show':''}" id="l-msg">${esc(msg||"")}</div>
    </div>
    <a class="backlink" href="index.html">Back to console</a></div>`;
  const go=document.getElementById("l-go");
  const submit=async()=>{
    const email=document.getElementById("l-email").value.trim(), pass=document.getElementById("l-pass").value;
    if(!email||!pass) return renderLogin("Enter your email and password.");
    go.disabled=true; go.textContent="Signing in\u2026";
    const { error }=await db.auth.signInWithPassword({email,password:pass});
    if(error) return renderLogin("Sign in failed. Check your details.");
    location.reload();
  };
  go.onclick=submit;
  document.getElementById("l-pass").addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
}

async function renderDash(){
  root.innerHTML=`<header><div class="head-in">
      <img class="brand-logo" src="${LOGO}" alt="NLC"><span class="brand-tag">Dashboard</span>
      <div class="who">${esc(SESSION.user.email)}<br><a id="signout">Sign out</a></div>
    </div></header>
    <div class="wrap">
      <h1>Production overview</h1>
      <p class="sub">Totals and trends across all production records. Updates live as the team enters data.</p>
      <div class="stats" id="stats"></div>
      <div class="grid">
        <div class="card full"><h2>Units by month</h2><div class="chartbox"><canvas id="c-month"></canvas></div></div>
        <div class="card"><h2>Output by line</h2><div class="chartbox"><canvas id="c-line"></canvas></div></div>
        <div class="card"><h2>Output by foreman</h2><div class="chartbox"><canvas id="c-foreman"></canvas></div></div>
        <div class="card"><h2>Records by status</h2><div class="chartbox"><canvas id="c-status"></canvas></div></div>
        <div class="card"><h2>Top clients by units</h2><div class="chartbox"><canvas id="c-client"></canvas></div></div>
        <div class="card full"><h2>Average cycle time by month (min/unit)</h2><div class="chartbox"><canvas id="c-cycle"></canvas></div></div>
      </div>
      <a class="backlink" href="index.html">&larr; Back to console</a>
    </div>`;
  document.getElementById("signout").onclick=async()=>{ await db.auth.signOut(); location.reload(); };

  const [{count:recCount}, trends, byLine, byForeman, byStatus, byClient] = await Promise.all([
    db.from("production_records").select("id",{count:"exact",head:true}),
    db.from("v_monthly_trends").select("*"),
    db.from("v_output_by_line").select("*").limit(5000),
    db.from("v_output_by_foreman").select("*").limit(5000),
    db.from("v_qc_status").select("*").limit(5000),
    db.from("v_client_volumes").select("*").limit(5000)
  ]);

  const tr=(trends.data||[]).filter(m=>m.month);
  const totalUnits=tr.reduce((a,m)=>a+(Number(m.total_quantity)||0),0);
  const totalMins =tr.reduce((a,m)=>a+(Number(m.total_minutes)||0),0);
  const avgCycle  =totalUnits>0?(totalMins/totalUnits):null;
  const lineAgg=sumBy(byLine.data,"line","units");
  const stat=(v,l)=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  document.getElementById("stats").innerHTML=
    stat(fmt(recCount||0),"Records")+
    stat(fmt(totalUnits),"Units produced")+
    stat(avgCycle!=null?(Math.round(avgCycle*10)/10):"0","Avg min / unit")+
    stat(fmt(Object.keys(lineAgg).length),"Active lines");

  if(!tr.length && !(byLine.data||[]).length){
    document.querySelector(".grid").innerHTML=`<div class="card full"><div class="empty">No production data yet. Create records and add entries in the console, then this fills in.</div></div>`;
    return;
  }

  // units by month
  bar("c-month", tr.map(m=>m.month), tr.map(m=>Number(m.total_quantity)||0), "Units", PAL[1]);
  // output by line
  const l=topN(lineAgg,12);
  bar("c-line", l.labels, l.values, "Units", PAL[0]);
  // output by foreman
  const f=topN(sumBy(byForeman.data,"foreman","units"),12);
  bar("c-foreman", f.labels.map(x=>x||"Unassigned"), f.values, "Units", PAL[2]);
  // records by status (doughnut)
  const st=sumBy(byStatus.data,"status","records");
  doughnut("c-status", Object.keys(st).map(x=>x||"Open"), Object.values(st));
  // top clients
  const c=topN(sumBy(byClient.data,"customer","units"),10);
  hbar("c-client", c.labels.map(x=>x||"Unspecified"), c.values, "Units", PAL[3]);
  // avg cycle by month
  line("c-cycle", tr.map(m=>m.month), tr.map(m=>m.avg_minutes_per_unit!=null?Math.round(m.avg_minutes_per_unit*10)/10:null));
}

/* ---------- aggregation helpers ---------- */
function sumBy(rows,key,val){
  const o={}; (rows||[]).forEach(r=>{ const k=r[key]==null?"":r[key]; o[k]=(o[k]||0)+(Number(r[val])||0); }); return o;
}
function topN(obj,n){
  const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n);
  return { labels:e.map(x=>x[0]), values:e.map(x=>x[1]) };
}

/* ---------- chart builders ---------- */
const baseOpts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
  scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{beginAtZero:true,ticks:{font:{size:11}}}}};
function bar(id,labels,values,label,color){
  new Chart(document.getElementById(id),{type:"bar",
    data:{labels,datasets:[{label,data:values,backgroundColor:color,borderRadius:6,maxBarThickness:46}]},options:baseOpts});
}
function hbar(id,labels,values,label,color){
  new Chart(document.getElementById(id),{type:"bar",
    data:{labels,datasets:[{label,data:values,backgroundColor:color,borderRadius:6}]},
    options:{...baseOpts,indexAxis:"y"}});
}
function line(id,labels,values){
  new Chart(document.getElementById(id),{type:"line",
    data:{labels,datasets:[{data:values,borderColor:PAL[0],backgroundColor:"rgba(36,39,94,.08)",
      fill:true,tension:.3,pointBackgroundColor:PAL[1],spanGaps:true}]},options:baseOpts});
}
function doughnut(id,labels,values){
  new Chart(document.getElementById(id),{type:"doughnut",
    data:{labels,datasets:[{data:values,backgroundColor:PAL,borderWidth:2,borderColor:"#fff"}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"58%",
      plugins:{legend:{position:"bottom",labels:{font:{size:11},boxWidth:12}}}}});
}
</script>
</body>
</html>
