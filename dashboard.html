<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NLC Traceability Dashboard</title>
<style>
  :root{
    --navy:#24275E; --navy-deep:#1a1c45; --orange:#F6851F; --orange-soft:#fff2e6;
    --ink:#1c1e33; --muted:#71749a; --line:#e7e8f1; --bg:#f5f6fb; --card:#ffffff;
    --radius:14px; --shadow:0 1px 2px rgba(36,39,94,.06),0 8px 24px rgba(36,39,94,.07);
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.45; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px; margin:0 auto; padding:0 16px 60px}
  header{background:var(--navy); color:#fff; padding:14px 16px; border-bottom:3px solid var(--orange)}
  .head-in{max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:12px}
  .brand-logo{height:32px; width:auto; display:block; flex:none}
  .brand-tag{font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:#b9bce0;
    padding-left:12px; border-left:1px solid rgba(255,255,255,.28)}
  .who{margin-left:auto; text-align:right; font-size:11.5px; color:#c3c6e6}
  .who a{color:#fff; text-decoration:underline; cursor:pointer; font-weight:600}
  .brand-home{color:#c3c6e6; text-decoration:none; font-size:12.5px; font-weight:600; padding:4px 11px; border:1px solid rgba(255,255,255,.28); border-radius:8px; cursor:pointer}
  .brand-home:hover{background:rgba(255,255,255,.12); color:#fff}
  h1{font-size:20px; margin:22px 0 2px; color:var(--navy)}
  .sub{color:var(--muted); font-size:13.5px; margin:0 0 16px}
  .backlink{display:inline-block; margin-top:16px; color:var(--muted); font-weight:600; text-decoration:none; font-size:14px}

  .controls{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:8px}
  .controls .fld{display:flex; flex-direction:column}
  .controls label{font-size:10.5px; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); margin-bottom:4px}
  input,select{padding:9px 11px; font-size:14px; border:1px solid var(--line); border-radius:9px; background:#fbfbfe; font-family:inherit}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 15px; font-size:14px;
    font-weight:700; border:none; border-radius:9px; cursor:pointer}
  .btn.primary{background:var(--navy); color:#fff} .btn.orange{background:var(--orange); color:#fff}
  .btn.ghost{background:#fff; color:var(--navy); border:1px solid var(--line)}
  .btn.sm{padding:5px 9px; font-size:12px}
  .btn[disabled]{opacity:.55; cursor:default}

  .stats{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-top:6px}
  @media(max-width:820px){ .stats{grid-template-columns:repeat(2,1fr)} }
  .stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:15px; box-shadow:var(--shadow)}
  .stat b{display:block; font-size:26px; color:var(--navy); font-variant-numeric:tabular-nums}
  .stat span{font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--muted)}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px}
  @media(max-width:760px){ .grid{grid-template-columns:1fr} }
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px}
  .card.full{grid-column:1 / -1}
  .card .ch-head{display:flex; align-items:center; gap:8px; margin-bottom:12px}
  .card h2{margin:0; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--navy)}
  .card .ch-head .tools{margin-left:auto; display:flex; gap:6px; align-items:center}
  .chartbox{position:relative; height:280px}
  .empty{padding:30px 10px; text-align:center; color:var(--muted); font-size:14px}

  .modal-bg{position:fixed; inset:0; background:rgba(26,28,69,.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:60}
  .modal{background:#fff; border-radius:14px; width:100%; max-width:980px; box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal .mh{padding:16px; border-bottom:1px solid var(--line); font-weight:700; color:var(--navy); display:flex}
  .modal .mh .x{margin-left:auto; cursor:pointer; color:var(--muted); font-size:22px; line-height:1}
  .modal .mb{padding:16px; height:70vh}
  .modal-lg{max-width:1040px}
  .mb2{padding:16px}
  .xctl{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:12px}
  .xctl label{font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); display:flex; gap:6px; align-items:center}
  .xctl select{font-size:13px; padding:6px 9px}
  .xchart{height:50vh; position:relative}
  .xtable{max-height:24vh; overflow:auto; margin-top:14px; border:1px solid var(--line); border-radius:10px}
  .xtable table{width:100%; border-collapse:collapse; font-size:13px}
  .xtable th{position:sticky; top:0; background:#f0f1f8; color:var(--navy); text-align:left; padding:8px 11px; font-size:11px; letter-spacing:.4px}
  .xtable td{padding:7px 11px; border-top:1px solid var(--line)}
  .xtable td.num,.xtable th.num{text-align:right; font-variant-numeric:tabular-nums}

  .spinner{width:30px; height:30px; margin:60px auto; border:3px solid var(--line); border-top-color:var(--orange); border-radius:50%; animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.spinner{animation:none}}
  .login{max-width:380px; margin:60px auto; padding:0 16px; text-align:center}
  .login img{height:40px; margin-bottom:20px}
  .login .card{text-align:left}
  .login label{display:block; font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); margin:12px 0 5px}
  .login input{width:100%}
  .login .btn{width:100%; margin-top:16px}
  .msg{color:#c0392b; font-size:13px; margin-top:10px; display:none} .msg.show{display:block}
</style>
</head>

const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
const root=document.getElementById("root");
const PAL=["#24275E","#F6851F","#3457b2","#1f9d63","#c0392b","#8e44ad","#c9820b","#16a085","#7f8c8d","#e67e22"];
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>(n==null?"0":Number(n).toLocaleString());
let SESSION=null, DATA=null, RANGE={from:"",to:""};
const cfgs={}, insts={}, META={};

(async function(){
  const { data:{ session } }=await db.auth.getSession();
  if(!session){ renderLogin(); return; }
  SESSION=session; renderShell(); await load();
})();

function renderLogin(msg){
  root.innerHTML=`<div class="login"><img src="${LOGO}" alt="NLC">
    <div class="card">
      <label>Email</label><input id="l-email" type="email">
      <label>Password</label><input id="l-pass" type="password">
      <button class="btn primary" id="l-go">Sign in</button>
      <div class="msg ${msg?'show':''}">${esc(msg||"")}</div>
    </div><a class="backlink" href="index.html">Back to console</a></div>`;
  const go=document.getElementById("l-go");
  const submit=async()=>{ const email=document.getElementById("l-email").value.trim(), pass=document.getElementById("l-pass").value;
    if(!email||!pass) return renderLogin("Enter your email and password.");
    go.disabled=true; go.textContent="Signing in\u2026";
    const { error }=await db.auth.signInWithPassword({email,password:pass});
    if(error) return renderLogin("Sign in failed."); location.reload(); };
  go.onclick=submit; document.getElementById("l-pass").addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
}

function renderShell(){
  root.innerHTML=`<header><div class="head-in">
      <a href="index.html" title="Home" style="display:flex;align-items:center;text-decoration:none"><img class="brand-logo" src="${LOGO}" alt="NLC"></a>
      <span class="brand-tag">Dashboard</span>
      <a href="index.html" class="brand-home">Home</a>
      <div class="who">${esc(SESSION.user.email)}<br><a id="signout">Sign out</a></div>
    </div></header>
    <div class="wrap">
      <h1>Production overview</h1>
      <p class="sub">Totals and trends across production records. Filter by date, expand any chart, or export a report.</p>
      <div class="controls">
        <div class="fld"><label>From</label><input id="d-from" type="date" value="${RANGE.from}"></div>
        <div class="fld"><label>To</label><input id="d-to" type="date" value="${RANGE.to}"></div>
        <button class="btn primary" id="apply">Apply</button>
        <button class="btn ghost" id="clear">All time</button>
        <button class="btn orange" id="report" style="margin-left:auto">Export report</button>
      </div>
      <div class="stats" id="stats"></div>
      <div class="grid" id="grid"></div>
      <a class="backlink" href="index.html">&larr; Back to console</a>
    </div>`;
  document.getElementById("signout").onclick=async()=>{ await db.auth.signOut(); location.reload(); };
  document.getElementById("apply").onclick=()=>{ RANGE.from=document.getElementById("d-from").value; RANGE.to=document.getElementById("d-to").value; load(); };
  document.getElementById("clear").onclick=()=>{ RANGE={from:"",to:""}; document.getElementById("d-from").value=""; document.getElementById("d-to").value=""; load(); };
  document.getElementById("report").onclick=exportReport;
}

async function load(){
  document.getElementById("grid").innerHTML=`<div class="card full"><div class="spinner"></div></div>`;
  document.getElementById("stats").innerHTML="";
  const { data, error }=await db.rpc("dashboard_data",{ p_from:RANGE.from||null, p_to:RANGE.to||null });
  if(error){ document.getElementById("grid").innerHTML=`<div class="card full"><div class="empty">Could not load data: ${esc(error.message)}</div></div>`; return; }
  DATA=data; renderStats(); renderCharts();
}

function renderStats(){
  const s=DATA.stats;
  const cell=(v,l)=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  document.getElementById("stats").innerHTML=
    cell(fmt(s.records),"Records")+cell(fmt(s.units),"Units")+
    cell(s.avg_cycle!=null?s.avg_cycle:"0","Avg min/unit")+
    cell(fmt(s.manpower),"Workers")+cell(fmt(s.lines),"Lines");
}

function card(id,title,tools){
  return `<div class="card ${id==='month'||id==='cycle_month'?'full':''}">
    <div class="ch-head"><h2>${title}</h2><div class="tools">${tools||""}<button class="btn ghost sm" data-expand="${id}">Expand</button></div></div>
    <div class="chartbox"><canvas id="cv-${id}"></canvas></div></div>`;
}

function renderCharts(){
  const g=document.getElementById("grid");
  const d=DATA;
  if(!d.stats.records){ g.innerHTML=`<div class="card full"><div class="empty">No production data in this range. Adjust the dates or add records in the console.</div></div>`; return; }
  g.innerHTML=
    card("month","Units by month")+
    card("line","Output by line")+
    card("foreman","Output by foreman")+
    card("status","Records by status")+
    card("client","Top clients by units")+
    card("model","Cycle time by item (min/unit)",`<select class="btn ghost sm" id="sortModel" style="font-weight:600">
        <option value="cyc_desc">Slowest first</option><option value="cyc_asc">Fastest first</option><option value="units">By units</option></select>`)+
    card("cycle_month","Average cycle time by month (min/unit)");

  make("month", barCfg(d.by_month.map(m=>m.month), d.by_month.map(m=>m.units), PAL[1], "Units"));
  make("line", barCfg(d.by_line.map(x=>x.line), d.by_line.map(x=>x.units), PAL[0], "Units"));
  make("foreman", barCfg(d.by_foreman.map(x=>x.foreman), d.by_foreman.map(x=>x.units), PAL[2], "Units"));
  make("status", doughnutCfg(d.by_status.map(x=>x.status), d.by_status.map(x=>x.records)));
  make("client", hbarCfg(d.by_client.slice(0,10).map(x=>x.customer), d.by_client.slice(0,10).map(x=>x.units), PAL[3], "Units"));
  renderModel("cyc_desc");
  make("cycle_month", lineCfg(d.by_month.map(m=>m.month), d.by_month.map(m=>m.avg_cycle)));

  document.getElementById("sortModel").onchange=e=>renderModel(e.target.value);
  g.querySelectorAll("[data-expand]").forEach(b=>b.onclick=()=>expand(b.dataset.expand));
  buildMeta();
}

function buildMeta(){
  const d=DATA;
  META.month     ={title:"Units by month", kind:"bar", rows:d.by_month, label:"month",
     metrics:[{key:"units",name:"Units"},{key:"avg_cycle",name:"Avg min/unit"},{key:"manpower",name:"Workers"}], color:PAL[1], sortable:false};
  META.line      ={title:"Output by line", kind:"bar", rows:d.by_line, label:"line",
     metrics:[{key:"units",name:"Units"}], color:PAL[0], sortable:true};
  META.foreman   ={title:"Output by foreman", kind:"bar", rows:d.by_foreman, label:"foreman",
     metrics:[{key:"units",name:"Units"}], color:PAL[2], sortable:true};
  META.status    ={title:"Records by status", kind:"doughnut", rows:d.by_status, label:"status",
     metrics:[{key:"records",name:"Records"}], color:null, sortable:false};
  META.client    ={title:"Clients by units", kind:"hbar", rows:d.by_client, label:"customer",
     metrics:[{key:"units",name:"Units"}], color:PAL[3], sortable:true};
  META.model     ={title:"Cycle time by item", kind:"hbar", rows:d.by_model.filter(m=>m.avg_cycle!=null), label:"model",
     metrics:[{key:"avg_cycle",name:"Min/unit"},{key:"units",name:"Units"}], color:PAL[5], sortable:true};
  META.cycle_month={title:"Average cycle time by month", kind:"line", rows:d.by_month, label:"month",
     metrics:[{key:"avg_cycle",name:"Min/unit"}], color:PAL[0], sortable:false};
}

function renderModel(sort){
  let rows=DATA.by_model.filter(m=>m.avg_cycle!=null).slice();
  if(sort==="cyc_desc") rows.sort((a,b)=>b.avg_cycle-a.avg_cycle);
  else if(sort==="cyc_asc") rows.sort((a,b)=>a.avg_cycle-b.avg_cycle);
  else rows.sort((a,b)=>b.units-a.units);
  rows=rows.slice(0,14);
  make("model", hbarCfg(rows.map(m=>m.model), rows.map(m=>m.avg_cycle), PAL[5], "Min/unit"));
}

/* ---------- config builders ---------- */
const baseOpts=()=>({responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
  scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{beginAtZero:true,ticks:{font:{size:11}}}}});
function barCfg(labels,values,color,label){ return {type:"bar",
  data:{labels,datasets:[{label,data:values,backgroundColor:color,borderRadius:6,maxBarThickness:48}]},options:baseOpts()}; }
function hbarCfg(labels,values,color,label){ const o=baseOpts(); o.indexAxis="y";
  return {type:"bar",data:{labels,datasets:[{label,data:values,backgroundColor:color,borderRadius:6}]},options:o}; }
function lineCfg(labels,values){ return {type:"line",
  data:{labels,datasets:[{data:values,borderColor:PAL[0],backgroundColor:"rgba(36,39,94,.08)",fill:true,tension:.3,pointBackgroundColor:PAL[1],spanGaps:true}]},options:baseOpts()}; }
function doughnutCfg(labels,values){ return {type:"doughnut",
  data:{labels,datasets:[{data:values,backgroundColor:PAL,borderWidth:2,borderColor:"#fff"}]},
  options:{responsive:true,maintainAspectRatio:false,cutout:"58%",plugins:{legend:{position:"bottom",labels:{font:{size:11},boxWidth:12}}}}}; }

function make(id,cfg){
  cfgs[id]=cfg;
  if(insts[id]) insts[id].destroy();
  insts[id]=new Chart(document.getElementById("cv-"+id),cfg);
}

/* ---------- expand: full data, sort, top-N, metric switch, table ---------- */
function expand(id){
  const m=META[id]; if(!m) return;
  let metric=m.metrics[0].key;
  let sortMode=m.sortable?"val_desc":"none";
  let topN=(m.rows.length>15)?15:99999;
  const bg=document.createElement("div"); bg.className="modal-bg";
  bg.innerHTML=`<div class="modal modal-lg"><div class="mh">${esc(m.title)}<span class="x">&times;</span></div>
    <div class="mb2">
      <div class="xctl">
        ${m.metrics.length>1?`<label>Metric <select id="x-metric">${m.metrics.map(mt=>`<option value="${mt.key}">${mt.name}</option>`).join("")}</select></label>`:""}
        ${m.sortable?`<label>Sort <select id="x-sort"><option value="val_desc">High to low</option><option value="val_asc">Low to high</option><option value="label">By name</option></select></label>`:""}
        ${m.rows.length>10?`<label>Show <select id="x-top"><option value="10">Top 10</option><option value="25">Top 25</option><option value="99999" selected>All (${m.rows.length})</option></select></label>`:""}
      </div>
      <div class="xchart"><canvas id="cv-big"></canvas></div>
      <div class="xtable" id="x-table"></div>
    </div></div>`;
  document.body.appendChild(bg);
  let chart=null;
  const metricName=()=>(m.metrics.find(x=>x.key===metric)||{}).name||"";
  function draw(){
    let rows=m.rows.slice();
    if(sortMode==="val_desc") rows.sort((a,b)=>(b[metric]??-Infinity)-(a[metric]??-Infinity));
    else if(sortMode==="val_asc") rows.sort((a,b)=>(a[metric]??Infinity)-(b[metric]??Infinity));
    else if(sortMode==="label") rows.sort((a,b)=>String(a[m.label]).localeCompare(String(b[m.label])));
    const shown=rows.slice(0,topN);
    const labels=shown.map(r=>r[m.label]), values=shown.map(r=>r[metric]);
    let cfg;
    if(m.kind==="doughnut") cfg=doughnutCfg(labels,values);
    else if(m.kind==="line") cfg=lineCfg(labels,values);
    else if(m.kind==="hbar") cfg=hbarCfg(labels,values,m.color,metricName());
    else cfg=barCfg(labels,values,m.color,metricName());
    if(chart) chart.destroy();
    chart=new Chart(bg.querySelector("#cv-big"),cfg);
    bg.querySelector("#x-table").innerHTML=`<table><thead><tr><th>${esc(m.label)}</th>${m.metrics.map(c=>`<th class="num">${esc(c.name)}</th>`).join("")}</tr></thead><tbody>${
      rows.map(r=>`<tr><td>${esc(r[m.label]??"")}</td>${m.metrics.map(c=>`<td class="num">${r[c.key]??""}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  }
  const mp=bg.querySelector("#x-metric"); if(mp) mp.onchange=e=>{metric=e.target.value; draw();};
  const sp=bg.querySelector("#x-sort");   if(sp) sp.onchange=e=>{sortMode=e.target.value; draw();};
  const tp=bg.querySelector("#x-top");    if(tp) tp.onchange=e=>{topN=parseInt(e.target.value,10); draw();};
  const close=()=>{ if(chart) chart.destroy(); bg.remove(); };
  bg.querySelector(".x").onclick=close; bg.onclick=e=>{ if(e.target===bg) close(); };
  draw();
}

/* ---------- crisp offscreen image for the report ---------- */
function renderOffscreen(cfg,w,h){
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  document.body.appendChild(c);
  const cf=JSON.parse(JSON.stringify(cfg));
  cf.options=cf.options||{}; cf.options.responsive=false; cf.options.maintainAspectRatio=false; cf.options.animation=false;
  const ch=new Chart(c,cf);
  const url=ch.toBase64Image("image/png",1);
  ch.destroy(); c.remove();
  return url;
}

/* ---------- narrative insights ---------- */
function insights(){
  const d=DATA, s=d.stats, out=[];
  const rt=(RANGE.from||RANGE.to)?`Between ${RANGE.from||"the start"} and ${RANGE.to||"today"}`:"Across all recorded production";
  out.push(`${rt}, the floor logged ${fmt(s.records)} production record${s.records==1?"":"s"} totalling ${fmt(s.units)} units, worked by ${fmt(s.manpower)} ${s.manpower==1?"person":"people"} across ${fmt(s.lines)} line${s.lines==1?"":"s"}.`+(s.avg_cycle!=null?` The average assembly cycle was ${s.avg_cycle} minutes per unit.`:""));
  const ln=d.by_line;
  if(ln.length){ const top=ln[0], low=ln[ln.length-1];
    out.push(`Output was highest on ${top.line} at ${fmt(top.units)} units`+(ln.length>1?`, and lowest on ${low.line} at ${fmt(low.units)} units.`:".")); }
  const fm=d.by_foreman.filter(f=>f.foreman!=="Unassigned");
  if(fm.length) out.push(`${fm[0].foreman} led output among foremen with ${fmt(fm[0].units)} units.`);
  const cl=d.by_client.filter(c=>c.customer!=="Unspecified");
  if(cl.length){ const share=s.units?Math.round(cl[0].units/s.units*100):0;
    out.push(`${cl[0].customer} was the largest customer by volume at ${fmt(cl[0].units)} units`+(share?` (${share}% of the total).`:".")); }
  const mdl=d.by_model.filter(m=>m.avg_cycle!=null).sort((a,b)=>b.avg_cycle-a.avg_cycle);
  if(mdl.length>1) out.push(`On cycle time, ${mdl[0].model} was the most time-intensive item at ${mdl[0].avg_cycle} min/unit, while ${mdl[mdl.length-1].model} was the quickest at ${mdl[mdl.length-1].avg_cycle} min/unit.`);
  const lt=(d.by_light_type||[]).filter(x=>x.light_type!=="Unspecified");
  if(lt.length) out.push(`By light type, ${lt[0].light_type} carried the most volume at ${fmt(lt[0].units)} units`+(lt[0].avg_cycle!=null?`, averaging ${lt[0].avg_cycle} min/unit.`:"."));
  const st=d.by_status, tot=st.reduce((a,x)=>a+x.records,0);
  if(tot){ const done=(st.find(x=>/complete|closed/i.test(x.status))||{}).records||0;
    const open=(st.find(x=>/open/i.test(x.status))||{}).records||0;
    out.push(`By status, ${Math.round(done/tot*100)}% of records are completed and ${Math.round(open/tot*100)}% remain open.`); }
  const bm=d.by_month;
  if(bm.length>1){ const f=bm[0], l=bm[bm.length-1];
    const dir=l.units>f.units?"risen":l.units<f.units?"fallen":"held steady";
    out.push(`Monthly output has ${dir} over the period, from ${fmt(f.units)} units in ${f.month} to ${fmt(l.units)} units in ${l.month}.`); }
  return out;
}

  const rangeTxt=(RANGE.from||RANGE.to)?`${RANGE.from||"start"} to ${RANGE.to||"today"}`:"All time";
  const wide=[["month",1160,430],["cycle_month",1160,430],["line",1160,430],["foreman",1160,430],["client",1160,460],["model",1160,520]];
  const narr=insights().map(p=>`<p>${esc(p)}</p>`).join("");
  const chartBlocks=wide.map(([id,w,h])=>{
    if(!cfgs[id]) return "";
    const title=({month:"Units by month",cycle_month:"Average cycle time by month",line:"Output by line",foreman:"Output by foreman",client:"Clients by units",model:"Cycle time by item"})[id];

  w.document.write(`<html><head><title>NLC Production Report</title><style>

    .top .r{margin-left:auto;text-align:right;color:#71749a;font-size:13px}
    h2{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:#24275E;margin:26px 0 10px;border-bottom:1px solid #e7e8f1;padding-bottom:6px}

    .digest .s{border:1px solid #e7e8f1;border-radius:10px;padding:13px;text-align:center}
    .digest b{display:block;font-size:22px;color:#24275E} .digest span{font-size:10px;text-transform:uppercase;color:#71749a;letter-spacing:1px}
    .summary p{font-size:14px;line-height:1.55;margin:0 0 9px;color:#2a2c44}
    .rep-ch{margin:0 0 20px;page-break-inside:avoid}
    .rep-ch h3{font-size:12px;color:#24275E;text-transform:uppercase;letter-spacing:1px;margin:0 0 8px}
    .rep-ch img{display:block;width:100%;height:auto;max-width:820px;border:1px solid #e7e8f1;border-radius:8px}
    .rep-ch.narrow img{max-width:460px}
    .foot{margin-top:20px;color:#9a9cb5;font-size:11px;border-top:1px solid #e7e8f1;padding-top:10px}
    @media print{.noprint{display:none} body{padding:0}}
  </style></head><body>
    <div class="top"><img src="${LOGO}"><div class="t"><h1>Production Report</h1></div>
      <div class="r">${esc(rangeTxt)}<br>Generated ${new Date().toLocaleDateString()}</div></div>
    <div class="digest">
      <div class="s"><b>${fmt(s.records)}</b><span>Records</span></div>
      <div class="s"><b>${fmt(s.units)}</b><span>Units</span></div>
      <div class="s"><b>${s.avg_cycle!=null?s.avg_cycle:"0"}</b><span>Avg min/unit</span></div>
      <div class="s"><b>${fmt(s.manpower)}</b><span>Workers</span></div>
      <div class="s"><b>${fmt(s.lines)}</b><span>Lines</span></div>
    </div>
    <h2>Summary</h2><div class="summary">${narr}</div>
    <h2>Charts</h2>
    ${chartBlocks}${statImg}
    <div class="foot">NLC Traceability. Figures reflect data entered in the console for the selected period.</div>
    <button class="noprint" onclick="window.print()" style="margin-top:16px;padding:10px 18px;background:#24275E;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer">Print / Save as PDF</button>
  </body></html>`);
  w.document.close();
}
</script>
