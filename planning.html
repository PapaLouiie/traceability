  :root{
    --navy:#24275E; --navy-deep:#1a1c45; --orange:#F6851F; --orange-soft:#fff2e6;
    --ink:#1c1e33; --muted:#71749a; --line:#e7e8f1; --bg:#f5f6fb; --card:#ffffff;
    --ok:#1f9d63; --ok-bg:#e7f6ee; --warn:#c9820b; --warn-bg:#fdf3e0;
    --info:#3457b2; --info-bg:#eaf0fc; --hold:#c0392b; --hold-bg:#fdecea;
    --radius:14px; --shadow:0 1px 2px rgba(36,39,94,.06),0 8px 24px rgba(36,39,94,.07);
  }
  html[data-theme="dark"]{
    --bg:#131427; --card:#1c1e38; --ink:#e7e8f5; --muted:#9a9dc6; --line:#30325c;
    --orange-soft:#3a2a17; --ok-bg:#0f2b1e; --warn-bg:#332609; --info-bg:#172341; --hold-bg:#331313;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
  html[data-theme="dark"] input, html[data-theme="dark"] select, html[data-theme="dark"] textarea{background:#23254a; color:var(--ink); border-color:var(--line)}
  html[data-theme="dark"] .kb-col{background:#181a33}
  html[data-theme="dark"] .tabs{background:#181a33}
  html[data-theme="dark"] .tabs button.on{background:#2a2c52; color:var(--ink)}
  html[data-theme="dark"] .btn.ghost{background:#23254a; color:var(--ink)}
  html[data-theme="dark"] thead th{background:#23254a}
  html[data-theme="dark"] .modal, html[data-theme="dark"] .modal .mh{background:var(--card)}
  html[data-theme="dark"] .login .card{background:var(--card)}
  html[data-theme="dark"] .fold:hover{background:#2a2c52; color:var(--ink)}
  html[data-theme="dark"] .cal-card{filter:brightness(.85)}
  html[data-theme="dark"] h1, html[data-theme="dark"] .pcard .t, html[data-theme="dark"] .qrow .t, html[data-theme="dark"] .cal-mini b{color:#aeb3ff}
  .role-tag{display:inline-block; font-size:10px; font-weight:800; letter-spacing:.8px; text-transform:uppercase;
    background:var(--orange); color:#fff; padding:1px 7px; border-radius:5px}
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:"Bizmo","Bizmo Semi Bold",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.45; -webkit-font-smoothing:antialiased}
  .wrap{max-width:96vw; margin:0 auto; padding:0 18px 60px}
  header{background:var(--navy); color:#fff; padding:14px 16px; border-bottom:3px solid var(--orange)}
  .head-in{max-width:96vw; margin:0 auto; display:flex; align-items:center; gap:12px}
  .brand-logo{height:32px; width:auto; display:block; flex:none}
  .brand-tag{font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:#b9bce0;
    padding-left:12px; border-left:1px solid rgba(255,255,255,.28)}
  .brand-home{color:#c3c6e6; text-decoration:none; font-size:12.5px; font-weight:600; padding:4px 11px;
    border:1px solid rgba(255,255,255,.28); border-radius:8px; cursor:pointer}
  .brand-home:hover{background:rgba(255,255,255,.12); color:#fff}
  .who{margin-left:auto; text-align:right; font-size:11.5px; color:#c3c6e6}
  .who a{color:#fff; text-decoration:underline; cursor:pointer; font-weight:600}
  h1{font-size:20px; margin:20px 0 2px; color:var(--navy)}
  .sub{color:var(--muted); font-size:13.5px; margin:0 0 14px}

  .toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 15px; font-size:14px;
    font-weight:700; border:none; border-radius:9px; cursor:pointer; font-family:inherit}
  .btn.primary{background:var(--navy); color:#fff} .btn.orange{background:var(--orange); color:#fff}
  .btn.ghost{background:#fff; color:var(--navy); border:1px solid var(--line)}
  .btn.sm{padding:6px 10px; font-size:12.5px}
  .btn[disabled]{opacity:.55; cursor:default}
  .btn.danger{background:none; border:none; color:var(--hold); cursor:pointer; font-size:13px; font-weight:600}
  input,select,textarea{padding:9px 11px; font-size:14px; border:1px solid var(--line); border-radius:9px;
    background:#fbfbfe; font-family:inherit; color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--orange); outline-offset:1px; border-color:transparent}

  .tabs{display:flex; gap:6px; background:#eceef6; padding:4px; border-radius:11px}
  .tabs button{border:none; background:none; padding:8px 16px; font-size:13.5px; font-weight:700; color:var(--muted);
    border-radius:8px; cursor:pointer; font-family:inherit}
  .tabs button.on{background:#fff; color:var(--navy); box-shadow:0 1px 3px rgba(36,39,94,.12)}

  .banner{margin:0 0 12px; padding:11px 14px; border-radius:10px; font-size:14px; display:none}
  .banner.show{display:block}
  .banner.ok{background:var(--ok-bg); color:var(--ok)}
  .banner.err{background:var(--hold-bg); color:var(--hold)}

  .chip{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px;
    background:var(--warn-bg); color:var(--warn)}
  .chip[data-tone="ok"]{background:var(--ok-bg); color:var(--ok)}
  .chip[data-tone="info"]{background:var(--info-bg); color:var(--info)}
  .chip[data-tone="hold"]{background:var(--hold-bg); color:var(--hold)}

  /* kanban */
  .kb{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; align-items:start}
  .kb.kb5{grid-template-columns:repeat(5,minmax(0,1fr))}
  .kb-col.mini{min-height:0; padding-bottom:4px}
  .fold{margin-left:6px; cursor:pointer; color:var(--muted); font-weight:800; font-size:15px;
    padding:0 6px; border-radius:6px; user-select:none}
  .fold:hover{background:#fff; color:var(--navy)}
  @media(max-width:900px){ .kb,.kb.kb5{grid-template-columns:1fr 1fr} }
  .kb-col{background:#eef0f7; border-radius:var(--radius); padding:10px; min-height:200px}
  .kb-col h3{margin:2px 4px 10px; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--navy);
    display:flex; align-items:center; gap:8px}
  .kb-col h3 .n{margin-left:auto; font-size:11px; background:#fff; border-radius:99px; padding:2px 8px; color:var(--muted)}
  .kb-col.dragover{outline:2px dashed var(--orange); outline-offset:-4px}
  .pcard{background:var(--card); border:1px solid var(--line); border-radius:11px; box-shadow:var(--shadow);
    padding:11px 12px; margin-bottom:10px; cursor:pointer; position:relative; overflow:hidden}
  .pcard.has-rib{padding-left:28px}
  .rib{position:absolute; left:0; top:0; bottom:0; width:18px; display:flex; align-items:center; justify-content:center;
    font-size:8.5px; font-weight:800; letter-spacing:1px; color:#fff;
    writing-mode:vertical-rl; transform:rotate(180deg)}
  .rib.afp{background:var(--ok)} .rib.noafp{background:var(--hold)}
  .cal-mini.has-rib{padding-left:24px; position:relative; overflow:hidden}
  .cal-mini .rib{width:15px; font-size:7.5px}
  .pcard.dragging{opacity:.5}
  .pcard .t{font-weight:700; color:var(--navy); font-size:13.5px; display:flex; gap:6px; align-items:center; flex-wrap:wrap}
  .pcard .m{font-size:12px; color:var(--muted); margin-top:3px}
  .pcard .foot{display:flex; gap:6px; margin-top:8px; align-items:center; flex-wrap:wrap}
  .late{background:var(--hold); color:#fff; font-size:10px; font-weight:800; padding:1px 6px; border-radius:5px}
  .fabb{background:#3457b2; color:#fff; font-size:10px; font-weight:800; padding:1px 6px; border-radius:5px}

  /* calendar */
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:8px}
  .cal .dow{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); text-align:center; padding:4px 0}
  .cal-day{background:var(--card); border:1px solid var(--line); border-radius:10px; min-height:110px; padding:7px}
  .cal-day.other{background:#f2f3f9; opacity:.65}
  .cal-day.today{outline:2px solid var(--orange)}
  .cal-day.dragover{outline:2px dashed var(--orange)}
  .cal-day .d{font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:5px}
  .cal-card{background:var(--orange-soft); border:1px solid #f3d3ad; border-radius:7px; font-size:11.5px;
    padding:4px 7px; margin-bottom:4px; cursor:grab; font-weight:600; color:#7a4a10;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .cal-card[data-status="Pushed"]{background:var(--info-bg); border-color:#c4d3f2; color:var(--info)}
  .cal-card[data-status="Accepted"]{background:var(--ok-bg); border-color:#bfe6d0; color:var(--ok)}
  .cal-card[data-status="Returned"]{background:var(--hold-bg); border-color:#f2c6c1; color:var(--hold)}

  #toTop{display:none; position:fixed; right:18px; bottom:18px; z-index:996; width:44px; height:44px;
    border-radius:50%; border:none; background:var(--navy); color:#fff; font-size:20px; cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.3)}
  #toTop:hover{background:var(--orange)}
  .colf th{padding:4px 6px}
  .colf .shf{width:100%; min-width:56px; font-size:12px; padding:4px 6px; border:1px solid var(--line);
    border-radius:7px; background:var(--card); color:var(--ink)}
  .sync-remind{background:var(--warn-bg); color:var(--warn); border:1px solid #f0dcae; border-radius:10px;
    padding:10px 14px; margin:0 0 12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:13.5px}
  html[data-theme="dark"] .sync-remind{border-color:#5a4a1a}
  .chipsearch{display:flex; flex-wrap:wrap; gap:6px; align-items:center; background:#fbfbfe;
    border:1px solid var(--line); border-radius:9px; padding:5px 9px; cursor:text}
  .chipsearch:focus-within{outline:2px solid var(--orange); outline-offset:1px}
  .chipsearch input{border:none; background:none; outline:none; flex:1; min-width:110px; padding:5px 2px}
  .chip-s{display:inline-flex; align-items:center; gap:5px; background:var(--orange-soft); color:#a55a12;
    border:1px solid #f3d3ad; border-radius:999px; padding:3px 6px 3px 11px; font-size:12.5px; font-weight:700}
  .chip-s b{cursor:pointer; color:#c0392b; font-weight:800; padding:0 3px; line-height:1; font-size:14px}
  html[data-theme="dark"] .chipsearch{background:#23254a}
  html[data-theme="dark"] .chip-s{background:#3a2a17; color:#f0b075; border-color:#5a4020}
  :root{--navy2:#4c50a2}
  .st-tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; margin-bottom:16px}
  .st-tile{background:var(--card); border:1px solid var(--line); border-top:3px solid var(--navy); border-radius:12px;
    box-shadow:var(--shadow); padding:13px 15px}
  .st-big{font-size:26px; font-weight:800; color:var(--navy)}
  html[data-theme="dark"] .st-big{color:#aeb3ff}
  .st-label{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin-top:2px}
  .st-sub{font-size:12.5px; color:var(--muted); margin-top:3px}
  .st-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px}
  .st-card{background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:14px 16px}
  .st-card h2{margin:0 0 12px; font-size:13px; letter-spacing:.8px; text-transform:uppercase; color:var(--navy)}
  html[data-theme="dark"] .st-card h2{color:#aeb3ff}
  .bar-row{display:flex; align-items:center; gap:9px; margin-bottom:7px}
  .bar-lab{flex:0 0 130px; font-size:12px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .bar-tr{flex:1; height:14px; background:var(--line); border-radius:7px; overflow:hidden}
  .bar-tr i{display:block; height:100%; border-radius:7px}
  .bar-val{flex:0 0 78px; text-align:right; font-size:12px; font-weight:700; color:var(--muted)}
  .so-group{background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden}
  .so-head{display:flex; align-items:center; gap:8px; padding:9px 11px; cursor:pointer; font-size:13px}
  .so-head:hover{background:var(--orange-soft)}
  .so-head b{color:var(--navy)}
  .so-head .so-meta{color:var(--muted); font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .so-arrow{color:var(--muted); font-size:12px}
  .so-body{padding:8px; background:#f2f3f9; border-top:1px solid var(--line)}
  .so-body .pcard:last-child{margin-bottom:0}
  html[data-theme="dark"] .so-body{background:#181a33}
  html[data-theme="dark"] .so-head:hover{background:#2a2c52}
  .cal-mini{background:var(--card); border:1px solid var(--line); border-radius:7px; font-size:12px;
    padding:5px 8px; margin-bottom:5px; cursor:pointer; color:var(--ink)}
  .cal-mini .l1,.cal-mini .l2{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .cal-mini .l2{font-size:10.5px; color:var(--muted); margin-top:1px}
  .cal-mini .l2 i{font-style:normal; color:var(--info)}
  .cal-mini b{color:var(--navy)} .cal-mini .late,.cal-mini .fabb{margin-left:4px; font-size:9px; padding:0 4px}
  .mstock{margin-left:4px; font-size:9px; font-weight:800; padding:0 4px; border-radius:4px;
    background:var(--warn-bg); color:var(--warn)}
  .mstock[data-s="In Stock"]{background:var(--ok-bg); color:var(--ok)}
  .mstock[data-s="Cargo/PO Item"]{background:var(--info-bg); color:var(--info)}
  html[data-theme="dark"] .cal-mini b{color:#aeb3ff}

  /* spreadsheet */
  .tbl-wrap{overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:var(--radius)}
  table{width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; min-width:1100px}
  thead th{background:#f0f1f8; color:var(--navy); text-align:left; padding:9px 10px; font-size:11px; letter-spacing:.4px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  tbody td{padding:5px 6px; border-top:1px solid var(--line); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  td.cell input, td.cell select{width:100%; min-width:0; padding:7px 9px; border:1px solid transparent; border-radius:7px;
    background:transparent; font-size:12.5px}
  td.cell input:hover, td.cell select:hover{border-color:var(--line); background:#fbfbfe}
  td.cell input:focus, td.cell select:focus{outline:2px solid var(--orange); background:#fff}
  td.cell.changed input, td.cell.changed select{background:var(--orange-soft); border-color:#f3d3ad; font-weight:600}
  #shTable th{position:relative}
  #shTable .rz{position:absolute; right:0; top:0; bottom:0; width:7px; cursor:col-resize}
  #shTable .rz:hover{background:var(--orange); opacity:.5}

  /* queue */
  .qrow{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:14px 16px; margin-bottom:12px; display:flex; gap:14px; align-items:center; flex-wrap:wrap}
  .qrow .info{min-width:240px}
  .qrow .t{font-weight:700; color:var(--navy)}
  .qrow .m{font-size:12.5px; color:var(--muted); margin-top:2px}
  .qrow .act{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}

  .modal-bg{position:fixed; inset:0; background:rgba(26,28,69,.5); display:flex; align-items:center;
    justify-content:center; padding:18px; z-index:60}
  .modal{background:var(--card); border-radius:14px; width:100%; max-width:640px; box-shadow:0 20px 60px rgba(0,0,0,.3);
    max-height:90vh; overflow:auto}
  .modal .mh{padding:15px 16px; border-bottom:1px solid var(--line); font-weight:700; color:var(--navy); display:flex;
    position:sticky; top:0; background:var(--card); z-index:1}
  .modal .mh .x{margin-left:auto; cursor:pointer; color:var(--muted); font-size:22px; line-height:1}
  .modal .mb{padding:16px}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  @media(max-width:560px){ .row{grid-template-columns:1fr} }
  .field{margin-bottom:10px}
  .field.full{grid-column:1 / -1}
  .field label{display:block; font-size:10.5px; letter-spacing:.9px; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%}
  .checks{display:flex; gap:14px; flex-wrap:wrap; padding-top:4px}
  .checks label{display:flex; gap:6px; align-items:center; font-size:14px; font-weight:600; text-transform:none;
    letter-spacing:0; color:var(--ink); cursor:pointer; margin:0}
  .checks input{width:auto; accent-color:var(--orange)}
  .empty{padding:26px; text-align:center; color:var(--muted); font-size:14px}
  .spinner{width:30px; height:30px; margin:60px auto; border:3px solid var(--line); border-top-color:var(--orange);
    border-radius:50%; animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .login{max-width:380px; margin:60px auto; padding:0 16px; text-align:center}
  .login img{height:40px; margin-bottom:20px}
  .login .card{background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
    padding:18px; text-align:left}
  .login label{display:block; font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); margin:12px 0 5px}
  .login input{width:100%}
  .login .btn{width:100%; margin-top:16px}
  .msg{color:#c0392b; font-size:13px; margin-top:10px; display:none} .msg.show{display:block}
</style>
</head>

// Global activity indicator: every server call (any db.rpc) automatically
// shows a dimmed overlay with a spinner until it settles, so no button is
// ever silent. Self-contained so it works identically on every page.
(function(){
  const st=document.createElement("style");
  st.textContent="@keyframes gspin{to{transform:rotate(360deg)}} #gbusy{display:none;position:fixed;inset:0;background:rgba(20,21,40,.28);z-index:999;align-items:center;justify-content:center} #gbusy i{width:34px;height:34px;border:3px solid rgba(255,255,255,.4);border-top-color:#F6851F;border-radius:50%;animation:gspin .8s linear infinite;display:block}";
  document.head.appendChild(st);
  const el=document.createElement("div"); el.id="gbusy"; el.innerHTML="<i></i>";
  document.addEventListener("DOMContentLoaded",()=>document.body.appendChild(el));
  if(document.body) document.body.appendChild(el);
  let n=0;
  window.gbusy=on=>{ n=Math.max(0,n+(on?1:-1)); el.style.display=n?"flex":"none"; };
  const _rpc=db.rpc.bind(db);
  db.rpc=(fn,args)=>{
    const b=_rpc(fn,args);
    const t=b.then.bind(b);
    b.then=(res,rej)=>{ gbusy(true);
      return t(r=>{ gbusy(false); return res?res(r):r; },
               e=>{ gbusy(false); if(rej) return rej(e); throw e; }); };
    return b;
  };
})();

const isJwtErr=e=>!!e&&/jwt|token|expired|401/i.test(e.message||String(e));
async function recoverSession(){
  try{
    const { data, error }=await db.auth.refreshSession();
    if(!error&&data&&data.session){ if(typeof SESSION!=="undefined") SESSION=data.session; return true; }
  }catch(_){}
  try{ await db.auth.signOut(); }catch(_){}
  location.reload(); return false;
}

}

function chipSearch(boxId, inputId, onChange, live){
  const box=document.getElementById(boxId), inp=document.getElementById(inputId);
  let terms=[];
  const all=()=>terms.concat(inp.value.trim()?[inp.value.trim()]:[]).join(" ");
  const draw=()=>{
    box.querySelectorAll(".chip-s").forEach(x=>x.remove());
    terms.forEach((t,i)=>{
      const sp=document.createElement("span"); sp.className="chip-s";
      sp.innerHTML=`${esc(t)}<b data-i="${i}">\u00d7</b>`;
      box.insertBefore(sp,inp);
    });
    box.querySelectorAll(".chip-s b").forEach(b=>b.onclick=()=>{ terms.splice(+b.dataset.i,1); draw(); onChange(all()); });
  };
  const commit=()=>{
    const v=inp.value.trim(); if(!v) return false;
    v.split(/[,\s]+/).forEach(t=>{ if(t&&!terms.includes(t)) terms.push(t); });
    inp.value=""; draw(); onChange(all()); return true;
  };
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"||e.key===","){ e.preventDefault(); commit(); }
    else if(e.key==="Backspace"&&!inp.value&&terms.length){ terms.pop(); draw(); onChange(all()); }
  });
  if(live) inp.addEventListener("input",()=>onChange(all()));
  box.addEventListener("click",()=>inp.focus());
  return { get:all, set:a=>{ terms=a.slice(); draw(); }, commit };
}
function isoWeekStr(d){
  const dt=(typeof d==="string")?new Date(d+"T00:00:00Z"):new Date(d);
  if(isNaN(dt)) return null;
  const t=new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate()));
  const day=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-day+3);
  const wy=t.getUTCFullYear();
  const jan4=new Date(Date.UTC(wy,0,4));
  const week=1+Math.round(((t-jan4)/86400000-3+((jan4.getUTCDay()+6)%7))/7);
  return wy+"-W"+String(week).padStart(2,"0");
}
function weekMonday(ws){
  const m=(ws||"").match(/^(\d{4})-W(\d{2})$/); if(!m) return null;
  const y=+m[1], w=+m[2];
  const jan4=new Date(Date.UTC(y,0,4));
  const day=(jan4.getUTCDay()+6)%7;
  const mon=new Date(jan4); mon.setUTCDate(jan4.getUTCDate()-day+(w-1)*7);
  return mon.toISOString().slice(0,10);
}
function weekLabel(ws){
  const mon=weekMonday(ws); if(!mon) return ws||"";
  const a=new Date(mon+"T00:00:00Z"), b=new Date(a); b.setUTCDate(a.getUTCDate()+4);
  const f=d=>d.toLocaleDateString("en",{day:"numeric",month:"short",timeZone:"UTC"});
  return `${ws.slice(5)} \u00b7 ${f(a)}\u2013${f(b)}`;
}
function weekOptions(sel){
  const now=new Date(); let out=`<option value=""></option>`;
  for(let i=-6;i<=30;i++){
    const d=new Date(now); d.setDate(now.getDate()+i*7);
    const ws=isoWeekStr(d);
    out+=`<option value="${ws}" ${ws===sel?"selected":""}>${weekLabel(ws)}</option>`;
  }
  if(sel && !out.includes(`value="${sel}"`)) out+=`<option value="${sel}" selected>${weekLabel(sel)}</option>`;
  return out;
}

    const targets=aiTargets(mode);
    if(!targets.length) return;
    AICANCEL=false;
    let filled=0, blank=0, failed=null;
    try{
      for(let i=0;i<targets.length && !AICANCEL;i+=40){
        const chunk=targets.slice(i,i+40);
        aiProgress(true,`AI filling models\u2026 ${Math.min(i+chunk.length,targets.length)}/${targets.length}`);

        let j={}; try{ j=await res.json(); }catch(e){ j={}; }
        if(!res.ok||j.error){ failed=j.error||j.msg||j.message||("HTTP "+res.status); break; }

          if(!r.model){ blank++; continue; }
          const { error }=await db.rpc("upsert_planned_record",{ p_id:r.id, p_fields:{ model:r.model } });
          if(error){ failed=error.message; break; }
          filled++;
        }
        if(failed) break;
      }

    aiProgress(false);
    if(failed){
      if(/ANTHROPIC_API_KEY|not configured|not found|Failed to fetch|404/i.test(failed)){
        try{ sessionStorage.setItem("nlc-ai-off","1"); }catch(e){}
        banner("AI model fill is not set up yet, so models stay manual for now. It will switch on automatically once the model-suggest function and API key are deployed.");
      } else banner(`AI fill stopped after ${filled} model${filled==1?"":"s"}: ${failed}`);
    } else if(AICANCEL){
      banner(`AI fill skipped${filled?` after ${filled} model${filled==1?"":"s"}`:""}.`,true);
    } else if(filled||blank){
      banner(`AI filled ${filled} model${filled==1?"":"s"}${blank?`; ${blank} had too little in the C.Ref to derive one`:""}. Review before pushing.`,true);
    }
    if(filled) await load();
  }
  const afb=document.getElementById("aiFillBtn");
  if(afb) afb.onclick=()=>aiFillMissing(true,"live");
  const afc=document.getElementById("aiFillCxBtn");
  if(afc) afc.onclick=()=>aiFillMissing(true,"cancelled");

    }catch(e){ banner("Sync failed: "+e.message+". Is the odoo-sync function deployed?"); }
    busy(false);
    sb.disabled=false; sb.textContent="Sync from Odoo";
  };
}

// list views need only these columns; the full row (BOM, cargo, allocations,
// remarks) is fetched fresh when a plan is opened. The save function only
// touches fields it is sent, so lean rows are safe to edit from.
const LIST_COLS="id,odoo_so,sap_so,product_name,c_ref,customer,contact,sales_person,region,model,"+
  "so_qty,planned_qty,planned_date,plan_status,bom_stock_status,plan_indicator,estimated_ready_week,"+
  "needs_fabrication,fabrication_stage,record_kind,odoo_state,afp,line,return_reason,production_record_id,"+
  "sort_order,created_by,updated_by,updated_at,created_at";
async function fetchPlans(statuses, excludeStatuses){
  const B=1000; let all=[], from=0;
  while(true){
    let q=db.from("planned_records").select(LIST_COLS)
      .order("sort_order",{ascending:true}).order("created_at",{ascending:true})
      .order("id",{ascending:true})
      .range(from, from+B-1);
    if(statuses) q=q.in("plan_status",statuses);
    else if(excludeStatuses) q=q.not("plan_status","in","("+excludeStatuses.map(x=>'"'+x+'"').join(",")+")");
    const { data, error }=await q;
    if(error) throw error;
    all=all.concat(data||[]);
    if(!data || data.length<B || from>=99000) break;
    from+=B;
  }
  return all;
}
async function load(){
  try{
    // working statuses paint first; accepted history arrives behind them
    const active=await fetchPlans(["Draft","Pushed","Returned"]);
    PLANS=active; draw();
    const everything=await fetchPlans(null);
    const activeIds=new Set(active.map(p=>p.id));
    const accepted=everything.filter(p=>!activeIds.has(p.id));
    PLANS=active.concat(accepted); draw();
    if(may("planning","edit")){
      const _ab=document.getElementById("aiFillBtn");
      if(_ab){ const _t=aiTargets("live");
        _ab.style.display=_t.length?"inline-flex":"none";
        _ab.textContent=`AI: fill ${fmt(_t.length)} missing model${_t.length==1?"":"s"}`; }
      const _ac=document.getElementById("aiFillCxBtn");
      if(_ac){ const _c=aiTargets("cancelled");
        _ac.style.display=_c.length?"inline-flex":"none";
        _ac.textContent=`AI: ${fmt(_c.length)} cancelled`; }
    }
    const qt=document.querySelector('#tabs button[data-v="queue"]');
    if(qt){ const n=PLANS.filter(p=>p.plan_status==="Pushed").length;
      qt.textContent="Acceptance queue"+(n?` (${n})`:""); }
  }catch(error){
    if(isJwtErr(error)&&await recoverSession()) return load();
    document.getElementById("view").innerHTML=`<div class="empty">Could not load plans: ${esc(error.message)}</div>`;
  }
}

function filtered(){
  const q=(SEARCHCTL?SEARCHCTL.get():(document.getElementById("q")?.value||"")).trim().toLowerCase();
  let rows=PLANS;
  if(FABFILTER==="fab") rows=rows.filter(p=>p.needs_fabrication);
  else if(FABFILTER==="nofab") rows=rows.filter(p=>!p.needs_fabrication);
  if(STOCKF) rows=rows.filter(p=>p.bom_stock_status===STOCKF);
  if(INDF) rows=rows.filter(p=>p.plan_indicator===INDF);
  if(STATUSF) rows=rows.filter(p=>p.plan_status===STATUSF);
  if(WEEKF) rows=rows.filter(p=>p.planned_date && isoWeekStr(p.planned_date)===WEEKF);
  if(CANCELF==="hide") rows=rows.filter(p=>p.odoo_state!=="cancel");
  else if(CANCELF==="only") rows=rows.filter(p=>p.odoo_state==="cancel");
  if(DNF==="hidedone") rows=rows.filter(p=>p.odoo_state!=="done");
  else if(DNF==="doneonly") rows=rows.filter(p=>p.odoo_state==="done");
  if(AFPF==="afp") rows=rows.filter(p=>p.afp===true);
  else if(AFPF==="notafp") rows=rows.filter(p=>p.afp===false);
  if(q){
    const terms=q.split(/[,\s]+/).filter(Boolean);   // several SO/model numbers at once: any term matches
    rows=rows.filter(p=>{
      const hay=[p.odoo_so,p.sap_so,p.product_name,p.c_ref,p.customer,p.contact,p.sales_person,p.model,p.region]
        .map(v=>(v||"").toLowerCase());
      return terms.some(t=>hay.some(v=>v.includes(t)));
    });
  }
  rows=rows.slice();
  const dt=p=>new Date(p.updated_at||p.created_at);
  if(SORTSEL==="week_asc") rows.sort((a,b)=>(a.planned_date||"9999").localeCompare(b.planned_date||"9999"));
  else if(SORTSEL==="week_desc") rows.sort((a,b)=>(b.planned_date||"").localeCompare(a.planned_date||""));
  else if(SORTSEL==="so") rows.sort((a,b)=>(a.odoo_so||"").localeCompare(b.odoo_so||""));
  else if(SORTSEL==="customer") rows.sort((a,b)=>(a.customer||"").localeCompare(b.customer||""));
  else if(SORTSEL==="qty_desc") rows.sort((a,b)=>(b.planned_qty||0)-(a.planned_qty||0));
  else rows.sort((a,b)=>dt(b)-dt(a));
  return rows;
}

  if(VIEW==="kanban") drawKanban(v);
  else if(VIEW==="calendar") drawCalendar(v);
  else if(VIEW==="sheet") drawSheet(v);
  else if(VIEW==="stats") drawStats(v);
  else drawQueue(v);
}

/* ---------------- planning analytics ---------------- */
function drawStats(v){
  const rows=filtered();
  const pcs=a=>a.reduce((s,p)=>s+(p.planned_qty||0),0);
  const isNewSync=p=>p.created_by==="odoo-sync"&&!p.updated_by;
  const live=rows.filter(p=>p.odoo_state!=="cancel");
  const cancelled=rows.filter(p=>p.odoo_state==="cancel");
  const groups={
    "New from Odoo":live.filter(p=>p.plan_status==="Draft"&&isNewSync(p)),
    "In planning":live.filter(p=>p.plan_status==="Draft"&&!isNewSync(p)),
    "Pushed":live.filter(p=>p.plan_status==="Pushed"),
    "Returned":live.filter(p=>p.plan_status==="Returned"),
    "Accepted":live.filter(p=>p.plan_status==="Accepted")
  };
  const backlog=live.filter(p=>p.plan_status!=="Accepted");
  const fab=backlog.filter(p=>p.needs_fabrication);
  const late=backlog.filter(p=>p.plan_indicator==="Late");
  const tile=(label,big,sub,toneVar)=>`<div class="st-tile"${toneVar?` style="border-top-color:var(${toneVar})"`:""}>
      <div class="st-big">${big}</div><div class="st-label">${esc(label)}</div>${sub?`<div class="st-sub">${sub}</div>`:""}</div>`;
  const barRows=(pairs,unit)=>{ 
    const max=Math.max(1,...pairs.map(x=>x[1]));
    return pairs.map(([lab,val,tone])=>`<div class="bar-row">
      <div class="bar-lab" title="${esc(lab)}">${esc(lab)}</div>
      <div class="bar-tr"><i style="width:${Math.max(2,Math.round(val/max*100))}%;background:${tone||"var(--navy)"}"></i></div>
      <div class="bar-val">${fmt(val)}${unit||""}</div>
    </div>`).join(""); };
  // pieces by week (next horizon based on planned_date)
  const byWeek={};
  backlog.forEach(p=>{ const w=p.planned_date?isoWeekStr(p.planned_date):"Unscheduled";
    byWeek[w]=(byWeek[w]||0)+(p.planned_qty||0); });
  const weekPairs=Object.entries(byWeek).sort((a,b)=>a[0]==="Unscheduled"?1:(b[0]==="Unscheduled"?-1:a[0].localeCompare(b[0])))
    .slice(0,14).map(([w,n])=>[w==="Unscheduled"?w:weekLabel(w),n,w==="Unscheduled"?"var(--warn)":"var(--info)"]);
  // stock status over backlog
  const stockPairs=[["In Stock","var(--ok)"],["Partial Stock","var(--warn)"],["Cargo/PO Item","var(--info)"],["Not set","var(--muted)"]]
    .map(([lab,tone])=>[lab, pcs(backlog.filter(p=>(p.bom_stock_status||"Not set")===lab)), tone]);
  // top customers / regions by pieces (backlog)
  const agg=key=>{ const m={}; backlog.forEach(p=>{ const k=p[key]||"(none)"; m[k]=(m[k]||0)+(p.planned_qty||0); });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8); };
  const custPairs=agg("customer"), regionPairs=agg("region"), salesPairs=agg("sales_person");
  // fab stages
  const fabPairs=[["Not started",fab.filter(p=>!p.fabrication_stage).length],
    ["Fabrication",fab.filter(p=>p.fabrication_stage==="Fabrication").length],
    ["Painting Pending",fab.filter(p=>p.fabrication_stage==="Painting Pending").length],
    ["Fabrication Complete",fab.filter(p=>p.fabrication_stage==="Fabrication Complete").length]];
  const kinds=[["Production"],["Sample"],["Sticker"],["Non-Production"]]
    .map(([k])=>[k, backlog.filter(p=>(p.record_kind||"Production")===k).length]);
  v.innerHTML=`
    <p class="sub" style="margin-top:0">Live view of the plans matching the current search and filters. Backlog means everything not yet accepted.</p>
    <div class="st-tiles">
      ${tile("Backlog plans", fmt(backlog.length), fmt(pcs(backlog))+" pieces","--navy2")}
      ${tile("New from Odoo", fmt(groups["New from Odoo"].length), fmt(pcs(groups["New from Odoo"]))+" pcs")}
      ${tile("In planning", fmt(groups["In planning"].length), fmt(pcs(groups["In planning"]))+" pcs")}
      ${tile("Pushed, awaiting assembly", fmt(groups["Pushed"].length), fmt(pcs(groups["Pushed"]))+" pcs","--info")}
      ${tile("Returned to fix", fmt(groups["Returned"].length), fmt(pcs(groups["Returned"]))+" pcs","--hold")}
      ${tile("Accepted", fmt(groups["Accepted"].length), fmt(pcs(groups["Accepted"]))+" pcs","--ok")}
      ${tile("Fabrication items", fmt(fab.length), fmt(pcs(fab))+" pcs","--info")}
      ${tile("Late", fmt(late.length), fmt(pcs(late))+" pcs","--hold")}
      ${tile("Cancelled (label only)", fmt(cancelled.length), fmt(pcs(cancelled))+" pcs","--hold")}
      ${tile("AFP backlog", fmt(backlog.filter(p=>p.afp===true).length), fmt(pcs(backlog.filter(p=>p.afp===true)))+" pcs","--ok")}
      ${tile("Not AFP backlog", fmt(backlog.filter(p=>p.afp===false).length), fmt(pcs(backlog.filter(p=>p.afp===false)))+" pcs","--hold")}
    </div>
    <div class="st-grid">
      <div class="st-card"><h2>Pieces by planned week</h2>${barRows(weekPairs," pcs")||'<div class="empty">No data</div>'}</div>
      <div class="st-card"><h2>Backlog by stock status (pieces)</h2>${barRows(stockPairs," pcs")}</div>
      <div class="st-card"><h2>Top customers (backlog pieces)</h2>${barRows(custPairs.map(x=>[x[0],x[1]])," pcs")||'<div class="empty">No data</div>'}</div>
      <div class="st-card"><h2>By region (backlog pieces)</h2>${barRows(regionPairs.map(x=>[x[0],x[1]])," pcs")||'<div class="empty">No data</div>'}</div>
      <div class="st-card"><h2>By salesperson (backlog pieces)</h2>${barRows(salesPairs.map(x=>[x[0],x[1]])," pcs")||'<div class="empty">No data</div>'}</div>
      <div class="st-card"><h2>Fabrication stages (items)</h2>${barRows(fabPairs)}</div>
      <div class="st-card"><h2>Piece types (backlog items)</h2>${barRows(kinds)}</div>
      <div class="st-card"><h2>Status mix (pieces)</h2>${barRows(Object.entries(groups).map(([k,a])=>[k,pcs(a)])," pcs")}</div>
    </div>`;
}

/* ---------------- kanban (columns = plan status) ---------------- */
function drawKanban(v){
  const rows=filtered();
  const isNewSync=p=>p.created_by==="odoo-sync"&&!p.updated_by;
  const cols=[
    ["new","New from Odoo","", rows.filter(p=>p.plan_status==="Draft"&&isNewSync(p))],
    ["draft","In planning","", rows.filter(p=>p.plan_status==="Draft"&&!isNewSync(p))],
    ["Pushed","Pushed","info", rows.filter(p=>p.plan_status==="Pushed")],
    ["Returned","Returned","hold", rows.filter(p=>p.plan_status==="Returned")],
    ["Accepted","Accepted / other","ok", rows.filter(p=>!["Draft","Pushed","Returned"].includes(p.plan_status))]
  ];
  const colBody=(key,cards)=>{
    const cap=key==="Accepted"?30:200;
    if(!GROUPMODE){
      const shown=cards.slice(0,cap);
      const hidden=cards.length-shown.length;
      return `${shown.map(cardHTML).join("")||'<div class="empty" style="padding:14px">None</div>'}
        ${hidden>0?`<div class="empty" style="padding:10px">+ ${hidden} more not shown. Use the search or filters to narrow.</div>`:""}`;
    }
    // grouped by SO
    const groups={}; const order=[];
    cards.forEach(p=>{ const so=p.odoo_so||p.sap_so||"(no SO)";
      if(!groups[so]){ groups[so]=[]; order.push(so); } groups[so].push(p); });
    if(!order.length) return '<div class="empty" style="padding:14px">None</div>';
    let shownGroups=order.slice(0, key==="Accepted"?15:80);
    const hiddenG=order.length-shownGroups.length;
    return shownGroups.map(so=>{
      const g=groups[so]; const gk=key+"|"+so;
      const open=GEXP.has(gk);
      const pcs=g.reduce((a,p)=>a+(p.planned_qty||0),0);
      const cust=g[0].customer||"";
      return `<div class="so-group">
        <div class="so-head" data-g="${esc(gk)}">
          <span class="so-arrow">${open?"\u25be":"\u25b8"}</span>
          <b>${esc(so)}</b><span class="so-meta">${esc(cust)}</span>
          <span class="n" style="margin-left:auto">${fmt(g.length)} \u00b7 ${fmt(pcs)} pcs</span>
        </div>
        ${open?`<div class="so-body">${g.map(cardHTML).join("")}</div>`:""}
      </div>`;
    }).join("")+(hiddenG>0?`<div class="empty" style="padding:10px">+ ${hiddenG} more SOs. Narrow with search or filters.</div>`:"");
  };
  v.innerHTML=`<div class="toolbar" style="margin-bottom:10px">
      <button class="btn ghost sm" id="grpToggle">${GROUPMODE?"Separate cards":"Group by SO"}</button>
      ${GROUPMODE?'<span class="sub" style="margin:0">Click an SO row to open or close its cards.</span>':""}
    </div>
    <div class="kb kb5">${cols.map(([key,label,tone,cards])=>{
    const mini=!!COLLAPSED[key];
    const pcs=cards.reduce((a,p)=>a+(p.planned_qty||0),0);
    return `<div class="kb-col${mini?" mini":""}" data-st="${key}">
      <h3><span class="chip" data-tone="${tone}">${label}</span><span class="n">${fmt(cards.length)} \u00b7 ${fmt(pcs)} pcs</span>
        <span class="fold" data-fold="${key}" title="${mini?"Expand":"Minimize"}">${mini?"+":"\u2212"}</span></h3>
      <div class="kb-body"${mini?' style="display:none"':""}>${colBody(key,cards)}</div>
    </div>`;}).join("")}</div>`;
  document.getElementById("grpToggle").onclick=()=>{ GROUPMODE=!GROUPMODE; draw(); };
  v.querySelectorAll(".so-head").forEach(h=>h.onclick=()=>{
    const k=h.dataset.g; if(GEXP.has(k)) GEXP.delete(k); else GEXP.add(k); draw(); });
  v.querySelectorAll("[data-fold]").forEach(f=>f.onclick=e=>{
    e.stopPropagation(); COLLAPSED[f.dataset.fold]=!COLLAPSED[f.dataset.fold]; draw(); });
  v.querySelectorAll(".pcard").forEach(c=>{
    c.onclick=()=>planModal(PLANS.find(p=>p.id===c.dataset.id));
    c.addEventListener("dragstart",e=>{ c.classList.add("dragging"); e.dataTransfer.setData("text/plain",c.dataset.id); });
    c.addEventListener("dragend",()=>c.classList.remove("dragging"));
  });
  // drag a draft/returned card into Pushed to push it
  const pushed=v.querySelector('.kb-col[data-st="Pushed"]');
  if(pushed && may("planning","edit")){
    pushed.addEventListener("dragover",e=>{ e.preventDefault(); pushed.classList.add("dragover"); });
    pushed.addEventListener("dragleave",()=>pushed.classList.remove("dragover"));
    pushed.addEventListener("drop",async e=>{
      e.preventDefault(); pushed.classList.remove("dragover");
      const id=e.dataTransfer.getData("text/plain");
      busy(true);
      const { error }=await db.rpc("push_plan",{ p_id:id });
      busy(false);
      if(error){ banner(error.message); return; }
      banner("Plan pushed to the acceptance queue.",true); await load();
    });
  }
}

    ${mrib}
    <div class="l1"><b>${esc(p.odoo_so||p.model||"plan")}</b>${p.planned_qty?" \u00b7 "+p.planned_qty:""}

      ${p.plan_indicator==="Late"?'<span class="late">L</span>':""}${p.needs_fabrication?'<span class="fabb">F</span>':""}${p.odoo_state==="cancel"?'<span class="late">CX</span>':""}</div>
    <div class="l2">${esc(prod)}${cust?` \u00b7 <i>${esc(cust)}</i>`:""}</div></div>`;
}
function drawCalendar(v){
  const rows=filtered();
  const now=new Date(); now.setDate(now.getDate()+WEEKPAGE*WEEKCOUNT*7);
  const weeks=[];
  for(let i=0;i<WEEKCOUNT;i++){ const d=new Date(now); d.setDate(now.getDate()+i*7); weeks.push(isoWeekStr(d)); }
  const byWeek={};
  rows.forEach(p=>{ const w=p.planned_date?isoWeekStr(p.planned_date):null;
    if(w) (byWeek[w]=byWeek[w]||[]).push(p); });
  const unscheduled=rows.filter(p=>!p.planned_date&&(p.plan_status==="Draft"||p.plan_status==="Returned"));
  const thisWeek=isoWeekStr(new Date());
  const cardFn=CARDMODE==="mini"?miniCardHTML:cardHTML;
  const gridCols=Math.min(WEEKCOUNT,4);
  v.innerHTML=`<div class="toolbar" style="margin-bottom:10px">
      <button class="btn ghost sm" id="wkPrev">&larr;</button>
      <b style="color:var(--navy)">${esc(weeks[0])} to ${esc(weeks[weeks.length-1])}</b>
      <button class="btn ghost sm" id="wkNext">&rarr;</button>
      ${WEEKPAGE!==0?'<button class="btn ghost sm" id="wkNow">This week</button>':''}
      <span style="border-left:1px solid var(--line);height:22px"></span>
      <button class="btn ghost sm" id="zoomIn" ${WEEKCOUNT<=2?"disabled":""} title="Fewer weeks, bigger cells">Zoom in</button>
      <button class="btn ghost sm" id="zoomOut" ${WEEKCOUNT>=12?"disabled":""} title="More weeks on screen">Zoom out</button>
      <button class="btn ghost sm" id="cardMode">${CARDMODE==="mini"?"Detailed cards":"Compact cards"}</button>
      <span class="sub" style="margin:0 0 0 8px">Drag a plan onto a week to reschedule it.</span>
    </div>
    <div class="kb" style="grid-template-columns:repeat(${gridCols},minmax(0,1fr))">
      ${weeks.map(w=>`<div class="kb-col wk${w===thisWeek?" today":""}" data-week="${w}" ${w===thisWeek?'style="outline:2px solid var(--orange)"':""}>
        <h3><span class="chip" data-tone="info">${esc(weekLabel(w))}</span><span class="n">${fmt((byWeek[w]||[]).length)} \u00b7 ${fmt((byWeek[w]||[]).reduce((a,p)=>a+(p.planned_qty||0),0))} pcs</span></h3>
        ${(byWeek[w]||[]).map(cardFn).join("")||'<div class="empty" style="padding:10px">None</div>'}
      </div>`).join("")}
    </div>
    ${unscheduled.length?`<h1 style="font-size:15px">Unscheduled (${unscheduled.length})</h1>
      <div class="kb"><div class="kb-col" style="grid-column:1/-1">
      <div style="display:${CARDMODE==="mini"?"flex":"block"};flex-wrap:wrap;gap:6px">${unscheduled.map(cardFn).join("")}</div></div></div>`:""}`;
  document.getElementById("wkPrev").onclick=()=>{ WEEKPAGE--; draw(); };
  document.getElementById("wkNext").onclick=()=>{ WEEKPAGE++; draw(); };
  const wn=document.getElementById("wkNow"); if(wn) wn.onclick=()=>{ WEEKPAGE=0; draw(); };
  document.getElementById("zoomIn").onclick=()=>{ WEEKCOUNT=Math.max(2, WEEKCOUNT===12?8:(WEEKCOUNT===8?4:2)); WEEKPAGE=0; draw(); };
  document.getElementById("zoomOut").onclick=()=>{ WEEKCOUNT=Math.min(12, WEEKCOUNT===2?4:(WEEKCOUNT===4?8:12)); WEEKPAGE=0; draw(); };
  document.getElementById("cardMode").onclick=()=>{ CARDMODE=CARDMODE==="mini"?"full":"mini"; draw(); };
  v.querySelectorAll(".pcard").forEach(c=>{
    c.onclick=()=>planModal(PLANS.find(p=>p.id===c.dataset.id));
    c.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",c.dataset.id));
  });
  if(may("planning","edit")) v.querySelectorAll("[data-week]").forEach(col=>{
    col.addEventListener("dragover",e=>{ e.preventDefault(); col.classList.add("dragover"); });
    col.addEventListener("dragleave",()=>col.classList.remove("dragover"));
    col.addEventListener("drop",async e=>{
      e.preventDefault(); col.classList.remove("dragover");
      const id=e.dataTransfer.getData("text/plain");
      const p=PLANS.find(x=>x.id===id); if(!p) return;
      busy(true);
      const { error }=await db.rpc("upsert_planned_record",{ p_id:id, p_fields:{ ...fieldsOf(p), planned_date:weekMonday(col.dataset.week) } });
      busy(false);
      if(error){ banner(error.message); return; }
      banner("Rescheduled to "+weekLabel(col.dataset.week)+".",true); await load();
    });
  });
}

/* ---------------- spreadsheet ---------------- */
const SHF={};   // spreadsheet per-column filters: key -> text
let SHFOCUS=null; // which filter input to refocus after redraw
const SHEETCOLS=[
  ["odoo_so","Odoo SO","text"],["sap_so","SAP SO","text"],["customer","Client","text"],
  ["product_name","Product","text"],["c_ref","C.Ref","text"],["so_qty","SO Qty","number"],
  ["model","Model","text"],["planned_qty","Plan Qty","number"],["planned_date","Plan week","week"],
  ["record_kind","Type","select:Production,Sample,Sticker,Non-Production"],
  ["needs_fabrication","Fab","select:false,true"],
  ["bom_stock_status","BOM stock","select:,In Stock,Partial Stock,Cargo/PO Item"],
  ["plan_indicator","Indicator","select:,On Time,Late"],
  ["estimated_ready_week","Ready week","text"],["plan_remarks","Remarks","text"]];
const SHEETCAP=300;
function drawSheet(v){
  let allRows=filtered();
  // per-column filters: every active filter must match (AND across columns);
  // inside a text filter, comma separates OR terms
  const shfVal=(p,k)=>{
    if(k==="planned_date") return p.planned_date?isoWeekStr(p.planned_date):"";
    if(k==="needs_fabrication") return String(!!p.needs_fabrication);
    if(k==="record_kind") return p.record_kind||"Production";
    return p[k]==null?"":String(p[k]);
  };
  allRows=allRows.filter(p=>{
    for(const [k,raw] of Object.entries(SHF)){
      if(!raw) continue;
      if(k==="plan_status"){ if(p.plan_status!==raw) return false; continue; }
      if(k==="__afp"){ if(raw==="afp"&&p.afp!==true) return false; if(raw==="notafp"&&p.afp!==false) return false; continue; }
      const col=SHEETCOLS.find(c=>c[0]===k);
      if(col&&col[2]&&col[2].startsWith("select:")){ if(shfVal(p,k)!==raw) return false; continue; }
      const hay=shfVal(p,k).toLowerCase();
      const terms=raw.toLowerCase().split(",").map(t=>t.trim()).filter(Boolean);
      if(terms.length&&!terms.some(t=>hay.includes(t))) return false;
    }
    return true;
  });
  const rows=allRows.slice(0,SHEETCAP);
  const totSO=allRows.reduce((a,p)=>a+(p.so_qty||0),0);
  const totPlan=allRows.reduce((a,p)=>a+(p.planned_qty||0),0);
  const dirty={}; const selected=new Set();
  const canEdit=may("planning","edit");
  v.innerHTML=`<div class="toolbar" style="margin-bottom:10px">
      ${canEdit?`<button class="btn primary" id="shSave" disabled>Save changes (0)</button>
      <span style="border-left:1px solid var(--line);height:24px"></span>
      <span class="sub" style="margin:0">Selected:</span>
      <select id="shWeek" style="max-width:190px">${weekOptions("")}</select>
      <button class="btn ghost" id="shSetWeek" disabled>Set week (0)</button>
      <button class="btn orange" id="shPush" disabled>Push (0)</button>
      <span style="border-left:1px solid var(--line);height:24px"></span>
      <select id="shFabSel" style="max-width:120px"><option value="">Fab: keep</option><option value="true">Fab: Yes</option><option value="false">Fab: No</option></select>
      <select id="shStockSel" style="max-width:170px"><option value="">Stock: keep</option><option>In Stock</option><option>Partial Stock</option><option>Cargo/PO Item</option></select>
      <button class="btn ghost" id="shApply" disabled>Apply to (0)</button>`:""}
    </div>
    ${rows.length>SHEETCAP?`<p class="sub" style="margin:0 0 8px">Showing the first ${SHEETCAP} of ${rows.length} plans (totals cover all ${rows.length}). Use the filters or week selector to narrow.</p>`:""}
    <div class="tbl-wrap"><table id="shTable"><thead><tr>
      ${canEdit?'<th style="width:34px"><input type="checkbox" id="shAll"></th>':""}
      <th style="width:80px">Status</th><th style="width:64px">AFP</th>${SHEETCOLS.map(c=>`<th>${c[1]}<span class="rz"></span></th>`).join("")}</tr>
    <tr class="colf">
      ${canEdit?"<th></th>":""}
      <th><select class="shf" data-f="plan_status"><option value="">all</option>${[...new Set(["Draft","Pushed","Accepted","Returned"].concat(PLANS.map(p=>p.plan_status)))].filter(Boolean).map(x=>`<option${SHF.plan_status===x?" selected":""}>${x}</option>`).join("")}</select></th>
      <th><select class="shf" data-f="__afp"><option value="">all</option><option value="afp"${SHF.__afp==="afp"?" selected":""}>AFP</option><option value="notafp"${SHF.__afp==="notafp"?" selected":""}>Not AFP</option></select></th>
      ${SHEETCOLS.map(([k,_,ty])=>{
        if(ty&&ty.startsWith("select:")){
          const opts=ty.slice(7).split(",");
          return `<th><select class="shf" data-f="${k}"><option value="">all</option>${opts.filter(o=>o!=="").map(o=>`<option value="${o}"${SHF[k]===o?" selected":""}>${k==="needs_fabrication"?(o==="true"?"Fab":"Not fab"):o}</option>`).join("")}</select></th>`;
        }
        return `<th><input class="shf" data-f="${k}" placeholder="filter" value="${esc(SHF[k]||"")}"></th>`;
      }).join("")}
    </tr></thead>
    <tbody>${rows.map(p=>`<tr>
      ${canEdit?`<td><input type="checkbox" class="shSel" data-sel="${p.id}"></td>`:""}
      <td><span class="chip" data-tone="${STONE[p.plan_status]}">${p.plan_status}</span>${p.odoo_state==="cancel"?'<br><span class="late" style="display:inline-block;margin-top:3px">CANCELLED</span>':(p.odoo_state?`<div style="font-size:10.5px;color:var(--muted);margin-top:3px">DN: ${esc(DNLABEL[p.odoo_state]||p.odoo_state)}</div>`:"")}</td>
      <td>${p.afp===true?'<span class="chip" data-tone="ok">AFP</span>':(p.afp===false?'<span class="chip" data-tone="hold">Not AFP</span>':"")}</td>
      ${SHEETCOLS.map(([k,_,ty])=>{
        let val=p[k]==null?"":p[k];
        if(k==="planned_date") val=p.planned_date?isoWeekStr(p.planned_date):"";
        if(k==="needs_fabrication") val=String(!!p.needs_fabrication);
        if(k==="record_kind") val=p.record_kind||"Production";
        if(!canEdit) return `<td>${k==="planned_date"?esc(weekLabel(val)):esc(val)}</td>`;
        if(ty==="week")
          return `<td class="cell"><select data-id="${p.id}" data-col="${k}" data-wk="${esc(val)}">${weekOptionsBase()}</select></td>`;
        if(ty.startsWith("select:")){
          const opts=ty.slice(7).split(",");
          const lab=o=>k==="needs_fabrication"?(o==="true"?"Yes":"No"):(o||"\u2014");
          return `<td class="cell"><select data-id="${p.id}" data-col="${k}">${opts.map(o=>`<option value="${esc(o)}" ${String(val)===o?"selected":""}>${esc(lab(o))}</option>`).join("")}</select></td>`;
        }
        return `<td class="cell"><input type="${ty}" data-id="${p.id}" data-col="${k}" value="${esc(val)}"></td>`;
      }).join("")}
    </tr>`).join("")}</tbody>
    <tfoot><tr style="font-weight:800;color:var(--navy);border-top:2px solid var(--navy)">
      ${canEdit?"<td></td>":""}<td>Totals (${fmt(allRows.length)})</td><td></td>
      ${SHEETCOLS.map(([k])=>`<td>${k==="so_qty"?fmt(totSO):(k==="planned_qty"?fmt(totPlan):"")}</td>`).join("")}
    </tr></tfoot></table></div>
    ${rows.length?"":'<div class="empty">No plans match the filter.</div>'}`;
  // apply stored week values to the cached option lists
  v.querySelectorAll('select[data-wk]').forEach(sel=>{
    const w=sel.dataset.wk||"";
    if(w && ![...sel.options].some(o=>o.value===w)){
      const o=document.createElement("option"); o.value=w; o.textContent=weekLabel(w); sel.appendChild(o);
    }
    sel.value=w;
  });
  if(!canEdit) return;

  const orig={}; rows.forEach(p=>{ orig[p.id]={}; SHEETCOLS.forEach(([k])=>{
    let v0=p[k]==null?"":String(p[k]);
    if(k==="planned_date") v0=p.planned_date?isoWeekStr(p.planned_date):"";
    if(k==="needs_fabrication") v0=String(!!p.needs_fabrication);
    if(k==="record_kind") v0=p.record_kind||"Production";
    orig[p.id][k]=v0; }); });

  const saveBtn=document.getElementById("shSave");
  const setWeekBtn=document.getElementById("shSetWeek");
  const pushBtn=document.getElementById("shPush");
  const applyBtn=document.getElementById("shApply");
  const updBtns=()=>{
    const nd=Object.keys(dirty).length, ns=selected.size;
    saveBtn.disabled=!nd; saveBtn.textContent=`Save changes (${nd})`;
    setWeekBtn.disabled=!ns; setWeekBtn.textContent=`Set week (${ns})`;
    pushBtn.disabled=!ns; pushBtn.textContent=`Push (${ns})`;
    if(applyBtn){ applyBtn.disabled=!ns; applyBtn.textContent=`Apply to (${ns})`; }
  };
  if(applyBtn) applyBtn.onclick=async()=>{
    const fab=document.getElementById("shFabSel").value;
    const stock=document.getElementById("shStockSel").value;
    if(!fab&&!stock) return banner("Choose a Fab and/or Stock value to apply first.");
    const f={};
    if(fab) f.needs_fabrication=(fab==="true");
    if(stock) f.bom_stock_status=stock;
    let ok=0, skip=0, firstErr=null;
    busy(true);
    for(const id of selected){
      const { error }=await db.rpc("upsert_planned_record",{ p_id:id, p_fields:f });
      if(error){ skip++; if(!firstErr) firstErr=error.message; }
      else ok++;
    }
    busy(false);
    banner(`Applied to ${ok} plan${ok==1?"":"s"}${skip?`; ${skip} skipped (${firstErr})`:""}.`, !skip||ok>0);
    await load();
  };
  // draggable column resize
  v.querySelectorAll("#shTable th .rz").forEach(rz=>{
    rz.addEventListener("mousedown",e=>{
      e.preventDefault();
      const th=rz.parentElement, startX=e.pageX, startW=th.offsetWidth;
      const move=ev=>{ th.style.width=Math.max(60,startW+(ev.pageX-startX))+"px"; };
      const up=()=>{ document.removeEventListener("mousemove",move); document.removeEventListener("mouseup",up); };
      document.addEventListener("mousemove",move); document.addEventListener("mouseup",up);
    });
  });
  let _shfT=null;
  v.querySelectorAll(".shf").forEach(el=>{
    const apply=()=>{ 
      const k=el.dataset.f, val=el.value.trim?el.value.trim():el.value;
      if(val) SHF[k]=val; else delete SHF[k];
      SHFOCUS=el.tagName==="INPUT"?k:null;
      drawSheet(v);
    };
    if(el.tagName==="SELECT") el.onchange=apply;
    else el.oninput=()=>{ clearTimeout(_shfT); _shfT=setTimeout(apply,350); };
  });
  if(SHFOCUS){
    const f=v.querySelector(`.shf[data-f="${SHFOCUS}"]`);
    if(f){ f.focus(); const L=f.value.length; try{ f.setSelectionRange(L,L); }catch(e){} }
    SHFOCUS=null;
  }
  v.querySelectorAll(".shSel").forEach(cb=>cb.onchange=()=>{
    if(cb.checked) selected.add(cb.dataset.sel); else selected.delete(cb.dataset.sel); updBtns(); });
  document.getElementById("shAll").onchange=e=>{
    v.querySelectorAll(".shSel").forEach(cb=>{ cb.checked=e.target.checked;
      if(cb.checked) selected.add(cb.dataset.sel); else selected.delete(cb.dataset.sel); });
    updBtns(); };

  v.querySelectorAll("[data-col]").forEach(el=>el.addEventListener("input",()=>{
    const id=el.dataset.id,k=el.dataset.col,val=el.value;
    dirty[id]=dirty[id]||{};
    if(val===orig[id][k]){ delete dirty[id][k]; if(!Object.keys(dirty[id]).length) delete dirty[id]; }
    else dirty[id][k]=val;
    el.closest("td").classList.toggle("changed", dirty[id]&&dirty[id][k]!==undefined);
    updBtns();
  }));

  const applyRows=async(entries)=>{
    let ok=0, fail=null;
    for(const [id,ch] of entries){
      const p=PLANS.find(x=>x.id===id);
      const f={ ...fieldsOf(p) };
      for(const [k,v] of Object.entries(ch)){
        if(k==="planned_date") f.planned_date=v?weekMonday(v):"";
        else if(k==="needs_fabrication") f.needs_fabrication=(v==="true");
        else f[k]=v;
      }
      const { error }=await db.rpc("upsert_planned_record",{ p_id:id, p_fields:f });
      if(error){ fail=`${p.odoo_so||id}: ${error.message}`; break; } ok++;
    }
    return { ok, fail };
  };

  saveBtn.onclick=async()=>{
    saveBtn.disabled=true; saveBtn.textContent="Saving\u2026"; busy(true);
    const { ok, fail }=await applyRows(Object.entries(dirty)); busy(false);
    if(fail) banner(`Saved ${ok}, then failed at ${fail}`); else banner(`Saved ${ok} plan${ok==1?"":"s"}.`,true);
    await load();
  };
  setWeekBtn.onclick=async()=>{
    const w=document.getElementById("shWeek").value;
    if(!w){ banner("Choose a week first."); return; }
    setWeekBtn.disabled=true; busy(true);
    const { ok, fail }=await applyRows([...selected].map(id=>[id,{planned_date:w}])); busy(false);
    if(fail) banner(`Updated ${ok}, then failed at ${fail}`); else banner(`Set ${weekLabel(w)} on ${ok} plan${ok==1?"":"s"}.`,true);
    await load();
  };
  pushBtn.onclick=async()=>{
    pushBtn.disabled=true; pushBtn.textContent="Pushing\u2026"; busy(true);
    let ok=0; const errs=[];
    for(const id of selected){
      const { error }=await db.rpc("push_plan",{ p_id:id });
      if(error){ const p=PLANS.find(x=>x.id===id); errs.push(`${p?.odoo_so||"plan"}: ${error.message}`); }
      else ok++;
    }
    busy(false);
    if(errs.length) banner(`Pushed ${ok}. Not pushed: ${errs.join(" | ")}`);
    else banner(`Pushed ${ok} plan${ok==1?"":"s"} to the acceptance queue.`,true);
    await load();
  };
}

/* ---------------- acceptance queue ---------------- */
function drawQueue(v){
  const rows=filtered().filter(p=>p.plan_status==="Pushed");
  const canAccept=may("records","edit");
  v.innerHTML=rows.length?rows.map(p=>`
    <div class="qrow">
      <div class="info">
        <div class="t">${p.afp===true?'<span class="chip" data-tone="ok" style="margin-right:6px">AFP</span>':(p.afp===false?'<span class="chip" data-tone="hold" style="margin-right:6px">Not AFP</span>':"")}${esc(p.odoo_so||p.sap_so||"(no SO)")} &middot; ${esc(p.model||p.product_name||"")}
          ${p.needs_fabrication?'<span class="fabb">FAB</span>':""}</div>
        <div class="m">Qty ${p.planned_qty??"?"} &middot; ${esc(p.customer||"")}${p.planned_date?" \u00b7 planned "+esc(p.planned_date):""}${p.voltage?" \u00b7 "+esc(p.voltage):""}</div>
        ${p.plan_remarks?`<div class="m">${esc(p.plan_remarks)}</div>`:""}
      </div>
      ${canAccept?`<div class="act">
        <select data-line="${p.id}"><option value="">Choose line\u2026</option>${CONVEYORS.map(c=>`<option>${c}</option>`).join("")}</select>
        <input type="date" data-date="${p.id}" value="${esc(p.planned_date||new Date().toISOString().slice(0,10))}">
        <button class="btn primary sm" data-acc="${p.id}">Accept</button>
        <button class="btn danger" data-ret="${p.id}">Return</button>
      </div>`:'<div class="act"><span class="chip" data-tone="info">Awaiting assembly</span></div>'}
    </div>`).join("")
  :`<div class="empty">No pushed plans waiting. ${may("planning","edit")?"Push a ready plan from the kanban.":""}</div>`;
  if(!canAccept) return;
  v.querySelectorAll("[data-acc]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.acc;
    const line=v.querySelector(`[data-line="${id}"]`).value||null;
    const date=v.querySelector(`[data-date="${id}"]`).value||null;
    b.disabled=true; b.textContent="Accepting\u2026"; busy(true);
    const { data, error }=await db.rpc("accept_plan",{ p_id:id, p_line:line, p_date:date }); busy(false);
    if(error){ banner(error.message); b.disabled=false; b.textContent="Accept"; return; }
    banner(`Accepted. Production record ${data.serial} created; open it in the console to print the tag.`,true);
    await load();
  });
  v.querySelectorAll("[data-ret]").forEach(b=>b.onclick=()=>returnModal(b.dataset.ret));
}

/* ---------------- return reason modal ---------------- */
function returnModal(id){
  const bg=document.createElement("div"); bg.className="modal-bg";
  bg.innerHTML=`<div class="modal" style="max-width:440px"><div class="mh">Return plan to planner<span class="x">&times;</span></div>
    <div class="mb">
      <div class="field"><label>Reason</label>
        <div class="checks" style="flex-direction:column;align-items:flex-start;gap:9px">
          <label><input type="radio" name="rr" value="nostock" checked> No stock</label>
          <div id="rr-parts" style="padding-left:24px">
            <div class="checks">${["Driver","LED","EM","Housing"].map(x=>`<label><input type="checkbox" class="rr-part" value="${x}"> ${x}</label>`).join("")}</div>
          </div>
          <label><input type="radio" name="rr" value="other"> Other</label>
          <input id="rr-text" placeholder="Describe the reason" style="width:100%;display:none">
        </div></div>
      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="btn primary" id="rr-go">Return plan</button>
        <button class="btn ghost" id="rr-cancel">Cancel</button>
      </div>
      <div class="banner" id="rr-msg" style="margin-top:12px"></div>
    </div></div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.querySelector(".x").onclick=close;
  bg.querySelector("#rr-cancel").onclick=close;
  bg.onclick=e=>{ if(e.target===bg) close(); };
  const sync=()=>{
    const other=bg.querySelector('input[name="rr"][value="other"]').checked;
    bg.querySelector("#rr-text").style.display=other?"block":"none";
    bg.querySelector("#rr-parts").style.display=other?"none":"block";
  };
  bg.querySelectorAll('input[name="rr"]').forEach(r=>r.onchange=sync);
  bg.querySelector("#rr-go").onclick=async()=>{
    const other=bg.querySelector('input[name="rr"][value="other"]').checked;
    let reason;
    if(other){
      reason=bg.querySelector("#rr-text").value.trim();
      if(!reason){ const m=bg.querySelector("#rr-msg"); m.textContent="Describe the reason."; m.className="banner show err"; return; }
      reason="Other: "+reason;
    } else {
      const parts=[...bg.querySelectorAll(".rr-part:checked")].map(x=>x.value);
      if(!parts.length){ const m=bg.querySelector("#rr-msg"); m.textContent="Tick what has no stock."; m.className="banner show err"; return; }
      reason="No stock: "+parts.join(", ");
    }
    busy(true);
    const { error }=await db.rpc("return_plan",{ p_id:id, p_reason:reason });
    busy(false);
    if(error){ const m=bg.querySelector("#rr-msg"); m.textContent=error.message; m.className="banner show err"; return; }
    close(); banner("Plan returned: "+reason,true); await load();
  };
}

    "plan_remarks","estimated_ready_week","wh_no_stock","sort_order"];

        <button class="btn primary" id="p-save">${p?"Save plan":"Create plan"}</button>
        ${p?`${(p.record_kind==="Non-Production")
              ?`<button class="btn orange" id="p-complete">Complete (no assembly)</button>`
              :`<button class="btn orange" id="p-push">Push to assembly</button>`}
        <button class="btn ghost" id="p-split">Split qty</button>
        <button class="btn danger" id="p-del" style="margin-left:auto">Delete plan</button>`:""}
      </div>`:""}
      ${p&&p.production_record_id?`<p class="sub" style="margin-top:12px">Accepted into production. Open the console to see the record.</p>`:""}
      <div class="banner" id="p-msg" style="margin-top:12px"></div>
    </div></div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.querySelector(".x").onclick=close;
  bg.onclick=e=>{ if(e.target===bg) close(); };
  const stockSel=bg.querySelector("#p-bom_stock_status");
  stockSel.onchange=()=>{
    const showCargo=stockSel.value==="Cargo/PO Item"
      || bg.querySelector("#p-cargo_eta").value || bg.querySelector("#p-cargo_received").value;
    ["cargoWrap","cargoWrap2","cargoWrap3"].forEach(id=>bg.querySelector("#"+id).style.display=showCargo?"block":"none");
    bg.querySelector("#whWrap").style.display=(stockSel.value&&stockSel.value!=="In Stock")?"block":"none";
  };
  const pmsg=(t,ok)=>{ const m=bg.querySelector("#p-msg"); m.textContent=t; m.className="banner show "+(ok?"ok":"err"); };
  const fabSave=bg.querySelector("#p-fabsave");
  if(fabSave) fabSave.onclick=async()=>{
    const { data, error }=await db.rpc("set_plan_fab_stage",{ p_id:p.id, p_stage:bg.querySelector("#p-fabstage").value||null });
    if(error){ pmsg(error.message); return; }
    p=data; banner("Fabrication stage updated.",true); close(); await load();
  };
  if(!canEdit){
    bg.querySelectorAll("input,select").forEach(el=>el.disabled=true);
    const fs=bg.querySelector("#p-fabstage");
    if(fs && may("fabrication","edit")) fs.disabled=false;
    return;
  }

  // allocations editor
  let ALLOC=Array.isArray(p&&p.stock_allocations)?p.stock_allocations.map(a=>({lot:a.lot||"",lot_qty:a.lot_qty??"",reserved:a.reserved??""})):[];
  function drawAlloc(){
    const box=bg.querySelector("#allocRows"); if(!box) return;
    box.innerHTML=ALLOC.map((a,i)=>`<div style="display:flex;gap:8px;margin-top:6px;align-items:center">
      <input placeholder="Lot / location" data-al="lot" data-i="${i}" value="${esc(a.lot)}" style="flex:2">
      <input type="number" min="0" placeholder="Qty at lot" data-al="lot_qty" data-i="${i}" value="${esc(a.lot_qty)}" style="flex:1">
      <input type="number" min="0" placeholder="Reserve" data-al="reserved" data-i="${i}" value="${esc(a.reserved)}" style="flex:1">
      <b data-alrm="${i}" style="cursor:pointer;color:var(--hold);font-size:16px;padding:0 4px">\u00d7</b></div>`).join("");
    box.querySelectorAll("[data-al]").forEach(inp=>inp.addEventListener("input",()=>{
      ALLOC[+inp.dataset.i][inp.dataset.al]=inp.dataset.al==="lot"?inp.value:inp.value;
      sumAlloc();
    }));
    box.querySelectorAll("[data-alrm]").forEach(b=>b.onclick=()=>{ ALLOC.splice(+b.dataset.alrm,1); drawAlloc(); });
    sumAlloc();
  }
  function sumAlloc(){
    const el=bg.querySelector("#allocSum"); if(!el) return;
    const res=ALLOC.reduce((a,x)=>a+(parseInt(x.reserved,10)||0),0);
    const need=parseInt(bg.querySelector("#p-planned_qty").value,10)||0;
    let bad=ALLOC.find(x=>(parseInt(x.reserved,10)||0)>(parseInt(x.lot_qty,10)||0));
    el.innerHTML=`Reserved <b>${res}</b> of plan qty <b>${need}</b>`
      +(bad?` <span style="color:var(--hold)">\u00b7 a reservation exceeds its lot quantity</span>`
        :(need&&res>need?` <span style="color:var(--warn)">\u00b7 reserved more than the plan needs</span>`:""));
  }
  const aa=bg.querySelector("#allocAdd");
  if(aa){ aa.onclick=()=>{ ALLOC.push({lot:"",lot_qty:"",reserved:""}); drawAlloc(); }; drawAlloc();
    bg.querySelector("#p-planned_qty").addEventListener("input",sumAlloc); }

  const collect=()=>{
    const val=id=>bg.querySelector("#p-"+id).value.trim();
    return { odoo_so:val("odoo_so"), sap_so:val("sap_so"), customer:val("customer"), contact:val("contact"),
      sales_person:val("sales_person"), region:val("region"), product_name:val("product_name"),
      c_ref:val("c_ref"), so_qty:val("so_qty"), model:val("model"), planned_qty:val("planned_qty"),
      planned_date:(bg.querySelector("#p-planned_week").value?weekMonday(bg.querySelector("#p-planned_week").value):""),
      light_type:val("light_type"), voltage:val("voltage"), bom_remarks:val("bom_remarks"),
      bom_driver:val("bom_driver"), bom_led:val("bom_led"), bom_em:val("bom_em"), bom_housing:val("bom_housing"),
      needs_fabrication:bg.querySelector("#p-needs_fabrication").value==="true",
      record_kind:bg.querySelector("#p-record_kind").value,
      bom_stock_status:val("bom_stock_status"), cargo_eta:val("cargo_eta"),
      cargo_received:val("cargo_received"), cargo_remarks:val("cargo_remarks"),
      stock_allocations:ALLOC.filter(a=>a.lot||a.lot_qty||a.reserved)
        .map(a=>({lot:a.lot,lot_qty:parseInt(a.lot_qty,10)||0,reserved:parseInt(a.reserved,10)||0})),
      plan_indicator:val("plan_indicator"), estimated_ready_week:val("estimated_ready_week"),
      plan_remarks:val("plan_remarks"),
      wh_no_stock:[...bg.querySelectorAll(".wh:checked")].map(x=>x.value) };
  };
  bg.querySelector("#p-save").onclick=async()=>{
    busy(true);
    const { data, error }=await db.rpc("upsert_planned_record",{ p_id:p?p.id:null, p_fields:collect() });
    busy(false);
    if(error){ pmsg(error.message); return; }
    p=data; banner("Plan saved.",true); close(); await load();
  };
  const pushBtn=bg.querySelector("#p-push");
  if(pushBtn) pushBtn.onclick=async()=>{
    busy(true);
    const { error:e1 }=await db.rpc("upsert_planned_record",{ p_id:p.id, p_fields:collect() });
    if(e1){ busy(false); pmsg(e1.message); return; }
    const { error }=await db.rpc("push_plan",{ p_id:p.id });
    busy(false);
    if(error){ pmsg(error.message); return; }
    banner("Plan pushed to the acceptance queue.",true); close(); await load();
  };
  const aiBtn=bg.querySelector("#p-ai");
  if(aiBtn) aiBtn.onclick=async()=>{
    aiBtn.disabled=true; aiBtn.textContent="\u2026"; busy(true);
    try{
      const res=await fetch(SUPABASE_URL+"/functions/v1/model-suggest",{ method:"POST",
        headers:{ Authorization:"Bearer "+await fnToken(), "Content-Type":"application/json" },
        body:JSON.stringify({ c_ref:bg.querySelector("#p-c_ref").value, product_name:bg.querySelector("#p-product_name").value }) });
      const j=await res.json();
      if(j.error) pmsg(j.error);
      else if(!j.model) pmsg(j.note||"No model could be derived from the C.Ref.");
      else { bg.querySelector("#p-model").value=j.model; pmsg("Suggested: "+j.model+". Review before saving.",true); }
    }catch(e){ pmsg("Suggestion failed: "+e.message+". Is the model-suggest function deployed?"); }
    busy(false); aiBtn.disabled=false; aiBtn.textContent="AI";
  };
  const copyBtn=bg.querySelector("#p-copysib");
  if(copyBtn) copyBtn.onclick=async()=>{
    const f={};
    ["model","light_type","voltage","planned_qty","planned_date","record_kind","needs_fabrication",
     "bom_driver","bom_led","bom_em","bom_housing","bom_remarks","bom_stock_status",
     "cargo_eta","cargo_received","cargo_remarks","plan_indicator","plan_remarks",
     "estimated_ready_week","wh_no_stock","stock_allocations"]
      .forEach(k=>{ if(SIB[k]!=null) f[k]=SIB[k]; });
    busy(true);
    const { error }=await db.rpc("upsert_planned_record",{ p_id:p.id, p_fields:f });
    busy(false);
    if(error){ pmsg(error.message); return; }
    banner("Planning copied from the cancelled version. Review it against the announced revision.",true);
    close(); planModal({id:p.id});
  };
  const splitBtn=bg.querySelector("#p-split");
  if(splitBtn) splitBtn.onclick=async()=>{
    // read the quantity fresh from the database so the split always works
    // on the real current number, never a stale or unsaved one
    busy(true);
    const { data:fresh, error:fe }=await db.from("planned_records")
      .select("planned_qty,so_qty,plan_status").eq("id",p.id).single();
    busy(false);
    if(fe){ pmsg(fe.message); return; }
    const total=fresh.planned_qty||0;
    if(total<2){ pmsg(`This plan's planned quantity is ${total}; it needs at least 2 pieces to split.`); return; }
    if(!["Draft","Returned"].includes(fresh.plan_status)){ pmsg(`Only draft or returned plans can be split (this one is ${fresh.plan_status}).`); return; }
    const sb=document.createElement("div"); sb.className="modal-bg";
    sb.innerHTML=`<div class="modal" style="max-width:420px"><div class="mh">Split plan quantity<span class="x">&times;</span></div>
      <div class="mb">
        <p class="sub" style="margin-top:0">Planned quantity right now: <b>${total}</b>${fresh.so_qty?` (SO quantity: ${fresh.so_qty})`:""}.
        The two parts below always add up to ${total}.</p>
        <div class="row">
          <div class="field"><label>This plan keeps</label><input id="sp-keep" type="number" min="1" max="${total-1}" value="${Math.floor(total/2)}"></div>
          <div class="field"><label>New draft gets</label><input id="sp-new" type="number" min="1" max="${total-1}" value="${total-Math.floor(total/2)}"></div>
        </div>
        <div style="display:flex;gap:10px;margin-top:6px">
          <button class="btn primary" id="sp-go">Split</button>
          <button class="btn ghost" id="sp-cancel">Cancel</button>
        </div>
        <div class="banner" id="sp-msg" style="margin-top:12px"></div>
      </div></div>`;
    document.body.appendChild(sb);
    const sclose=()=>sb.remove();
    sb.querySelector(".x").onclick=sclose;
    sb.querySelector("#sp-cancel").onclick=sclose;
    sb.onclick=e=>{ if(e.target===sb) sclose(); };
    const keep=sb.querySelector("#sp-keep"), nw=sb.querySelector("#sp-new");
    const smsg=t=>{ const m=sb.querySelector("#sp-msg"); m.textContent=t; m.className="banner show err"; };
    keep.addEventListener("input",()=>{ const k=parseInt(keep.value,10); if(!isNaN(k)) nw.value=total-k; });
    nw.addEventListener("input",()=>{ const n=parseInt(nw.value,10); if(!isNaN(n)) keep.value=total-n; });
    sb.querySelector("#sp-go").onclick=async()=>{
      const k=parseInt(keep.value,10);
      if(isNaN(k)||k<1||k>total-1){ smsg(`Keep must be between 1 and ${total-1}.`); return; }
      busy(true);
      const { data:sib, error }=await db.rpc("split_plan",{ p_id:p.id, p_first_qty:k });
      busy(false);
      if(error){ smsg(error.message); return; }
      sclose();
      banner(`Split done: this plan now has ${k} pieces, the new draft has ${sib.planned_qty}.`,true);
      close(); await load();
    };
  };
  const compBtn=bg.querySelector("#p-complete");
  if(compBtn) compBtn.onclick=async()=>{
    busy(true);
    const { error:e1 }=await db.rpc("upsert_planned_record",{ p_id:p.id, p_fields:collect() });
    if(e1){ busy(false); pmsg(e1.message); return; }
    const { error }=await db.rpc("complete_plan",{ p_id:p.id });
    busy(false);
    if(error){ pmsg(error.message); return; }
    banner("Completed. This item never passes through assembly.",true);
    close(); await load();
  };
  const delBtn=bg.querySelector("#p-del");
  if(delBtn) delBtn.onclick=async()=>{
    if(!confirm("Delete this plan?")) return;
    const { error }=await db.rpc("delete_planned_record",{ p_id:p.id });
    if(error){ pmsg(error.message); return; }
    banner("Plan deleted.",true); close(); await load();
  };
}
</script>
</body>
</html>
